<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自选 · assay</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared/common.css">
<div id="app">
  <div id="top"></div>
  <div class="page" id="pg"></div>
</div>
<div id="tip"></div>
<script src="/shared/common.js"></script>
<script src="/shared/kchart.js"></script>
<script src="/shared/stockpop.js"></script>
<script>
/* ============ 自选 ============
   ★ 账本 **append-only**（live/watchlist.jsonl），与实盘同一套纪律：
     加 / 移出 / 改分组 / 改备注 都是追加一条，当前状态由**重放**得出。
     删一条就把"我什么时候把它加进来的、为什么"抹掉了 —— 那本身是决策记录。
   ★ 面板里查不到的（退市/未上市）**不静默丢掉**，那一行必须还在并标出来，
     否则"我加过的票不见了"。 */
let GROUP = qs('group') || '';
let NEWG = null;              // 新建分组流程里暂存组名
let W = null;                 // 上一次取回的整份自选（页签切换只重渲染）

pageHead('watch', '⭐ 自选');
load();

async function load() {
  const pg = $('#pg');
  pg.innerHTML = '<div class="lvwhy" style="padding:20px">加载中…</div>';
  try {
    /* 一次取【全部】，页签在本地切 —— 每切一次页签重新打一遍接口的话，
       同一份数据要取 N 遍（自选页与持仓页共用一个实时库，页面侧不该
       多打请求）。切页签也就没有等待。 */
    W = await j('/api/watchlist');
    render();
  } catch (e) {
    pg.innerHTML = '<div class="lvmsg bad">' + esc(String(e)) + '</div>';
  }
}

function render() {
  const pg = $('#pg'), w = W;
  const names = (w.groups || []).map(g => g.name);
  /* 🔴 没有「全部」页签了 —— 不同账户的持仓放一起横向比没有意义
     （区间、策略、本金都不同）。所以 GROUP 必须落在某个真分组上：
     URL 里带的那个不存在了（改过名/清空了）就落到第一个。 */
  if (!names.includes(GROUP)) GROUP = sortGroups(w)[0] ? sortGroups(w)[0].name : '';
  pg.innerHTML = head(w) + '<div class="lvmsg" id="wmsg"></div>' + table(w);
  {
    mountSearch($('#wadd'), {onPick: async r => {
      try {
        /* 加到哪个组：新建流程里用 NEWG，否则就进当前页签那个组。 */
        const rr = await post('/api/watchlist', {act: 'add', code: r.code,
          group: NEWG || GROUP || undefined});
        NEWG = null;
        await load();
        /* ★ 服务端在"加进来那一刻"会给没有实时数据的票立刻补抓一次。
           抓不到时**要说为什么** —— 否则人只看到一片"收盘价"，
           会以为分钟数据这条链没工作（而收盘后本来就没有盘中数据）。 */
        const m = $('#wmsg'), rt = rr && rr.rt;
        if (rt && rt.skipped) {
          m.className = 'lvmsg';
          m.textContent = '已加入。' + rt.skipped
            + ' —— 分钟数据要等开盘后才有，现价先按收盘价显示。';
        } else if (rt && rt.snap) {
          m.className = 'lvmsg ok';
          m.textContent = '已加入，并立刻补抓了实时数据（' + rt.snap + ' 只快照'
            + (rt.bars ? ' + ' + rt.bars + ' 根分钟线' : '') + '）。';
        }
      } catch (e) { alert(String(e)); }
    }, placeholder: '加自选：代码或名称'});
    /* innerHTML 填充之后才存在的元素要重新绑事件 —— 只在页面加载时绑
       的话，重渲染出来的那些永远没有 handler：点了/拖了没反应且不报错。 */
    wtabDrag();
    $$('.wtab[data-g]').forEach(e => e.onclick = ev => {
      ev.preventDefault(); GROUP = e.dataset.g;
      const u = new URL(location.href);
      u.searchParams.set('group', GROUP);
      history.replaceState(null, '', u); render(); });
    /* 新建分组：先建个空页签没意义（自选是按票分组的），所以让它
       "选一只票 + 填组名"一步完成 —— 空组存不下来也不该假装存下来了。 */
    $('#wnewg').onclick = ev => {
      ev.preventDefault();
      const g = prompt('新分组叫什么？\n\n（分组是靠"票属于哪个组"存的，'
        + '所以建组时要同时指定第一只票 —— 下一步会让你搜）');
      if (!g) return;
      NEWG = g.trim();
      $('#wadd input').focus();
      $('#wmsg').className = 'lvmsg ok';
      $('#wmsg').textContent = '现在在右上角搜一只票，它会被加进「' + NEWG + '」';
    };
    $('#wsync').onclick = async ev => {
      ev.preventDefault();
      try {
        const r = await post('/api/watchlist/sync', {});
        $('#wmsg').className = 'lvmsg ok';
        $('#wmsg').textContent = '同步完成：新加 ' + (r.added || []).length
          + ' 只、改组 ' + (r.regrouped || []).length
          + ' 只、标已清仓 ' + (r.cleared || []).length + ' 只'
          + '（只加不自动移 —— 自动移会把手写的备注一起抹掉）';
        load();
      } catch (e) { $('#wmsg').className = 'lvmsg bad'; $('#wmsg').textContent = String(e); }
    };
    $$('.wrm').forEach(e => e.onclick = async ev => {
      ev.preventDefault();
      if (!confirm('把 ' + e.dataset.c + ' 移出自选？\n\n账本是 append-only 的 —— '
        + '会追加一条 remove，历史记录仍然保留。')) return;
      try { await post('/api/watchlist', {act: 'remove', code: e.dataset.c}); load(); }
      catch (err) { alert(String(err)); } });
    $$('.wgr').forEach(e => e.onclick = async ev => {
      ev.preventDefault();
      const g = prompt('改分组（当前 ' + e.dataset.g + '）', e.dataset.g);
      if (g == null) return;
      try { await post('/api/watchlist', {act: 'group', code: e.dataset.c, group: g}); load(); }
      catch (err) { alert(String(err)); } });
    $$('.wnt').forEach(e => e.onclick = async ev => {
      ev.preventDefault();
      const n = prompt('备注（为什么关注它）', e.dataset.n || '');
      if (n == null) return;
      try { await post('/api/watchlist', {act: 'note', code: e.dataset.c, note: n}); load(); }
      catch (err) { alert(String(err)); } });
  }
}

/* ---- 页签拖动改顺序 ------------------------------------------------
   🔴 **顺序由服务端给、也存在服务端**（`watchlist.jsonl` 追加一条
     `{act:'order',groups:[...]}`，当前顺序由重放得出）。页面既不自己
     排、也不存 localStorage：
       · 页面自己排 -> 第二份实现，"两处对同一份分组给出不同顺序"不报错
       · 存 localStorage -> 换台机器/换浏览器就回到默认，而分组顺序是
         "我怎么归类这些票"，属于决策记录，该跟账本一起走
   ★ 拖完**立刻存**，不留"排了但没生效"的窗口（同定时窗口那条）。
   ★ 点击仍然切换分组 —— HTML5 拖拽结束不会再触发 click，两者不冲突。
   ★ `＋`（新建分组）不参与：它不是分组，永远在最后。 */
function wtabDrag() {
  let src = null;
  const clr = () => $$('.wtab').forEach(e =>
    e.classList.remove('wdl', 'wdr', 'wdrag'));
  $$('.wtab[data-g]').forEach(el => {
    el.draggable = true;
    el.ondragstart = ev => {
      src = el; el.classList.add('wdrag');
      ev.dataTransfer.effectAllowed = 'move';
      /* setData 不是可选的 —— 不设的话 Firefox 根本不开始拖，
         而表现是"按住拖不动"且没有任何报错。 */
      ev.dataTransfer.setData('text/plain', el.dataset.g);
    };
    el.ondragend = () => { src = null; clr(); };
    el.ondragover = ev => {
      if (!src || src === el) return;
      ev.preventDefault();
      const r = el.getBoundingClientRect();
      const after = ev.clientX > r.left + r.width / 2;
      el.classList.toggle('wdr', after);
      el.classList.toggle('wdl', !after);
    };
    el.ondragleave = () => el.classList.remove('wdl', 'wdr');
    el.ondrop = async ev => {
      ev.preventDefault();
      if (!src || src === el) { clr(); return; }
      const r = el.getBoundingClientRect();
      const after = ev.clientX > r.left + r.width / 2;
      el.parentNode.insertBefore(src, after ? el.nextSibling : el);
      clr();
      await wtabSave();
    };
  });
}

/* 把当前 DOM 里的页签顺序存回账本，并**照服务端说的**对账。 */
async function wtabSave() {
  const want = $$('.wtab[data-g]').map(e => e.dataset.g);
  let r;
  try { r = await post('/api/watchlist/order', {groups: want}); }
  catch (e) { r = {error: String(e)}; }
  if (r.error) {
    /* 🔴 失败要**退回服务端那份顺序**，不能把本地那个"看着排好了"的
       留在屏幕上 —— 那样页面显示的和账本对不上，而它不报错。 */
    $('#wmsg').className = 'lvmsg bad';
    $('#wmsg').textContent = '顺序没存上：' + r.error;
    render();
    return;
  }
  W.groups = r.groups || W.groups;
  const got = (r.groups || []).map(g => g.name);
  /* 🔴 服务端的顺序与我刚拖出来的不一样时**照它的重渲染**。
     它是权威（账本在它那边），而"我看到的顺序不是存下来的那个"
     是最难查的那种不一致。 */
  if (got.join('|') !== want.join('|')) render();
}

/* ---- 页签 ----------------------------------------------------------
   ★ 从 chip 改成【页签】：分组是"我要分别盯的几拨票"，而 chip 看着像
     筛选标签。参考 table-data-viewer 的 `groups[] -> items[]` 模型。
   ★ 实盘账户组带「持」标记并排在前面 —— 它们是自动同步来的，
     和手工分的组语义不同（自动组里的票会跟着持仓变）。 */
/* 🔴 **顺序不在这里排** —— `watchlist.groups()` 已经排好了（人拖过的
   顺序从账本重放，没排过的按"自动组在前、再按名称"）。页面再排一遍就是
   第二份实现，而"页面显示的顺序和账本对不上"不报错。
   ★ `auto` 也由服务端给（`is_auto_group`），页面不再自己 `startsWith`
     猜前缀 —— 前缀改一次就要改两处。 */
function sortGroups(w) { return (w.groups || []).slice(); }
function rowsOf(w) {
  return (w.rows || []).filter(x => x.group === GROUP);
}

function head(w) {
  const gs = sortGroups(w);
  const total = gs.reduce((s, g) => s + g.n, 0);
  const rows = rowsOf(w);
  const codes = rows.map(x => x.code).slice(0, 6).join(',');
  const nrt = rows.filter(x => x.rt_src).length;
  return `<div class="lvhead">
      <h2 style="font-size:17px">自选 <span class="lvwhy">${rows.length} 只
        ${total > rows.length ? '· 共 ' + total : ''}</span></h2>
      <span class="lvtag${nrt === rows.length && nrt ? ' on' : (nrt ? ' warn' : '')}"
        title="自选与持仓共用同一个实时库（datalake/rt/），页面不额外调接口">
        数据日 ${esc(w.date || '—')}${nrt === rows.length && nrt
          ? ' · 实时 ' + esc((w.rt_at || '').slice(5))
          : (nrt ? ' · 部分实时 ' + nrt + '/' + rows.length : ' · 收盘价')}</span>
      <span style="flex:1"></span>
      ${codes ? `<a class="chip" href="/compare.html?codes=${encodeURIComponent(codes)}"
        title="把本页签前 6 只拉去对比后复权涨幅">⚖ 前 6 只去对比</a>` : ''}
      <a href="#" class="chip" id="wsync"
        title="把各实盘账户的当前持仓同步进自选（按账户分组）">⟳ 同步持仓</a>
      <div id="wadd" style="flex:0 0 240px"></div>
    </div>
    <div class="wtabs">
      ${gs.map(g => `<a href="#" class="wtab${GROUP === g.name ? ' on' : ''}"
        data-g="${esc(g.name)}" title="${g.auto
          ? '实盘账户自动同步的组 —— 里面的票跟着持仓变'
          : '手工分组'}　·　按住可拖动改顺序（拖完立刻存进账本）"
        >${g.auto ? '<b class="au">持</b> ' : ''}${
          esc(g.name.replace('实盘·', ''))} <span class="n">${g.n}</span></a>`).join('')}
      <a href="#" class="wtab add" id="wnewg" title="新建一个分组页签">＋</a>
    </div>`;
}

function table(w) {
  const rows = rowsOf(w);
  if (!rows.length) return '<div class="none">'
    + (W && (W.groups || []).length ? '这个分组是空的' : '自选是空的')
    + ' —— 右上角搜代码或名称加进来，或者在个股页/盘面榜单里点 ★</div>';
  return `<div class="lvsec"><h3>盯盘 <span class="lvwhy">${esc(GROUP)}</span></h3>
    <div class="pw"><table class="pkt">
      <tr><th class="tx">分组</th><th class="tx">名称</th>
        <th class="rt">现价</th><th class="rt">涨跌</th><th class="rt">换手</th>
        <th class="rt">成交额</th><th class="rt">流通市值</th><th class="rt">PE</th>
        <th class="rt">PB</th><th class="rt">ROE</th><th class="tx">行业</th>
        <th class="tx">备注</th><th class="tx">加入</th><th class="tx"></th></tr>
      ${rows.map(x => `<tr>
        <td class="tx"><a href="#" class="chip wgr" data-c="${esc(x.code)}"
          data-g="${esc(x.group)}" title="点击改分组">${esc(x.group)}</a></td>
        <td class="tx">${cnCell(x.code, x.name)}
          ${x.missing ? '<span class="stale" title="面板里查不到 —— 可能已退市或还没上市。这一行刻意留着，不静默丢掉">查不到行情</span>' : ''}
          ${x.is_st ? '<span class="stale">ST</span>' : ''}
          ${x.limit_up ? '<span class="lvwhy" style="color:var(--up)">涨停</span>' : ''}
          ${x.limit_down ? '<span class="lvwhy" style="color:var(--down)">跌停</span>' : ''}</td>
        <td class="rt">${fmtN(x.close)}${x.rt_src?`<span class="lvwhy"
          style="color:var(--accent)" title="盘中实时价（${esc(x.rt_at||'')}）">实</span>`:''}</td>
        <td class="rt" style="color:${upc(x.change_pct)}">${pctv(x.change_pct)}</td>
        <td class="rt">${pctn(x.turnover)}</td>
        <td class="rt">${yiv(x.amount)}</td>
        <td class="rt">${yiv(x.floatmv)}</td>
        <td class="rt">${fmtN(x.pe_ttm)}</td>
        <td class="rt">${fmtN(x.pb)}</td>
        <td class="rt">${ratv(x.roe_ttm)}</td>
        <td class="tx lvwhy">${esc(x.industry || '')}</td>
        <td class="tx lvwhy"><a href="#" class="wnt" data-c="${esc(x.code)}"
          data-n="${esc(x.note || '')}" style="color:inherit"
          title="点击改备注">${esc(x.note || '（写点什么）')}</a></td>
        <td class="tx lvwhy">${esc(String(x.added || '').slice(0, 10))}</td>
        <td class="tx"><a href="#" class="wrm" data-c="${esc(x.code)}"
          class="lvwhy">移出</a></td>
      </tr>`).join('')}
    </table></div>
    <div class="lvwhy" style="margin-top:6px">
      账本 <b>append-only</b>（<code>live/watchlist.jsonl</code>）——
      移出是追加一条 <code>remove</code>，当前池子由<b>重放</b>得出，
      不单独存一份：存两份就会分叉，而"页面显示的和日志对不上"没法复盘。<br>
      带「持」标记的页签是<b>实盘账户自动同步</b>的（跟着持仓变）。
      🔴 <b>只加不自动移</b> —— 卖光了标"已清仓"但留在自选里，
      自动移出会把手写的备注一起抹掉。要清就自己点「移出」。<br>
      现价带「实」的是<b>盘中实时价</b>，与持仓页<b>共用同一个实时库</b>
      （<code>datalake/rt/</code>）—— 抓取由 server 统一做，范围是
      <b>持仓 ∪ 自选</b>去重后的那一份，页面侧<b>不额外调接口</b>。
    </div>
  </div>`;
}

</script>
