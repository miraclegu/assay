<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指标广场 · assay</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared/common.css">
<div id="app">
  <div id="top"></div>
  <div class="page" id="pg"></div>
</div>
<div id="tip"></div>
<script src="/shared/common.js"></script>
<script src="/shared/kchart.js"></script>
<script src="/shared/stockpop.js"></script>
<script>
/* ============ 指标广场 ============
   回答三件事：**支持哪些指标、每个是怎么算的、我能在哪儿用它**。

   🔴 整页**照服务端那份清单渲染**（/api/indicators/defs，正本在
     assay/indicators.py）—— 页面里没有任何一个指标名。写死一份的话，
     加一个指标它在这儿根本不出现，而那不报错：只是没人知道它存在
     （同「可选基准由服务端给」那条）。

   ★ 每张卡都配**一张真实的小图**（拿一只真票画出来）。只列公式的话，
     "它长什么样"还是得去个股页一个个点开试 —— 而这正是广场存在的理由。
   ★ 它是【个股的子页】：顶栏点亮「📈 个股」，不单占一个入口 ——
     指标是看盘时用的东西，而这一页是低频的参考（同板块之于盘面）。 */
let CODE = qs('code') || localStorage.getItem('skcode') || '601857.XSHG';
let N = +(qs('n') || 120);
/* 🔴 **主图指标与副图指标分成两个页签**（用户 2026-09-15）：它们是两回事
   —— 主图那几条与 K 线共用价格坐标（叠上去），副图各自一套坐标。
   摆在一个流里的话，"哪些能叠在 K 线上"这件事就得一张张卡去看。 */
let TAB = qs('tab') === 'sub' ? 'sub' : 'main';
/* 🔴 **分页 + 搜索**：现在 12 个指标一屏放得下，但这一页的开销不在列表 ——
   在于**每张卡都要一张真图**。上百个指标时，"一次算完再画一百张画布"
   必然把页面拖死。所以：
     ① 只向服务端要**当前这一页**那几个指标（`inds=` 只带这一页的 id）
     ② 每页固定 `PER` 张，翻页才算下一批
     ③ 搜索先过滤再分页 —— 上百个的时候，找一个指标靠翻页是翻不到的
   ★ `per` 放进 URL（而不是写死）：既能按屏幕大小调，
     也让"分页真的在工作"可以被验证。 */
let PAGE = Math.max(1, +(qs('page') || 1));
/* ★ 默认 **9**（3×3）：用户 2026-09-16"副图指标一页展示 6 个或者 9 个
   已经够了，超出则分页"。`?per=` 仍可覆盖 —— selftest 靠它把每页压到 3
   才测得到分页（真实只有十来个指标，不压小的话那段永远是"第 1/1 页"）。 */
let PER = Math.min(60, Math.max(1, +(qs('per') || 9)));
let Q = qs('q') || '';
/* 复权口径。🔴 **默认前复权**（用户 2026-09-16："短期指标用前复权差异不大，
   主流的软件默认都是展示前复权，只是在做回测的时候使用后复权"）——
   这一页是**看指标长什么样**的，与券商软件对着看才自然；而不复权跨除权日
   有假跌幅，会让 MACD/KDJ 在那一天凭空拐一下，人还以为是指标的形态。
   ★ 三种都能切：同一个指标在三种口径下差多少，本来就是这一页该能回答的。 */
let FQ = qs('fq') || 'qfq';
let D = null, BARS = null, ROWS = null, PANELS = [];
/* 上一次取 K 线用的 (code, n) —— 换页签/翻页/搜索时**不重取 K 线**，
   它跟指标无关（同一段行情）。 */
let BKEY = null;

pageHead('stock', '📊 指标广场');
load();

function nav() {
  const u = new URL(location.href);
  u.searchParams.set('code', CODE);
  u.searchParams.set('tab', TAB);
  if (PAGE > 1) u.searchParams.set('page', PAGE); else u.searchParams.delete('page');
  if (Q) u.searchParams.set('q', Q); else u.searchParams.delete('q');
  if (FQ !== 'qfq') u.searchParams.set('fq', FQ); else u.searchParams.delete('fq');
  history.replaceState(null, '', u);
}

/* 当前页签 + 搜索之后剩下哪些指标（分页之前）。
   ★ 搜索匹配**名称 / 说明 / 公式**：上百个指标时，人记得住的往往是
     "那个算离均线多远的"，而不是它叫 BIAS。 */
function inTab() {
  const q = Q.trim().toLowerCase();
  return ((D || {}).inds || []).filter(d => d.panel === TAB).filter(d => {
    if (!q) return true;
    return [d.id, d.short, d.label, d.desc, d.formula]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  });
}
function pages() { return Math.max(1, Math.ceil(inTab().length / PER)); }
function pageItems() {
  const all = inTab();
  PAGE = Math.min(PAGE, Math.max(1, Math.ceil(all.length / PER)));
  return all.slice((PAGE - 1) * PER, PAGE * PER);
}

async function load() {
  const pg = $('#pg');
  const one = u => j(u).catch(e => ({error: String(e)}));
  if (!D) {
    pg.innerHTML = '<div class="lvwhy" style="padding:20px">加载中…</div>';
    D = await one('/api/indicators/defs');
    if (D.error) {
      pg.innerHTML = '<div class="lvmsg bad">' + esc(D.error) + '</div>';
      return;
    }
  }
  const items = pageItems();
  const ids = items.map(x => x.id).join(',');
  /* 缓存键含 `FQ`。★ 在"切换时 `BKEY = null`"的前提下**它是冗余的**
     （去掉照样对，变异测试抓不到）—— 保留它防的是**别的入口**：
     换票、翻页、换页签走的是同一个 `load()`，哪天有人在那些路径上忘了
     清 `BKEY`，键里有 FQ 就还能兜住。别把这两条的分工记反
     （同 `realtime` 那条：锁是根本修复，唯一 tmp 名防的是跨进程）。 */
  const bkey = CODE + '|' + N + '|' + FQ;
  /* 🔴 **只要这一页那几个指标**。一次要全部的话，上百个指标就是一个
     几兆的响应 + 一百次计算，而屏幕上同时也就看得见十来张卡。 */
  const [k, ind] = await Promise.all([
    (BARS && BKEY === bkey) ? Promise.resolve(null)
      : one('/api/stock/kline?fq=' + FQ + '&n=' + N + '&code='
            + encodeURIComponent(CODE)),
    ids ? one('/api/stock/indicators?fq=' + FQ + '&n=' + N + '&inds=' + ids
              + '&code=' + encodeURIComponent(CODE))
        : Promise.resolve({rows: [], panels: []}),
  ]);
  if (k) { BARS = k.error ? null : k.bars; BKEY = k.error ? null : bkey; }
  ROWS = ind.error ? null : ind.rows;
  PANELS = ind.error ? [] : (ind.panels || []);
  pg.innerHTML = head(k, ind) + ipCards(items) + sigTable() + foot();
  wire();
  draw();
  /* 🔴 量截断必须在**画完之后**：`ipCards` 刚填进 DOM 时布局还没定，
     scrollHeight 量出来是 0，于是一个「展开」都不会出现（而它不报错）。 */
  ipClamp();
}

function head(k, ind) {
  const err = (k && k.error) || ind.error;
  const all = ((D || {}).inds || []);
  const nMain = all.filter(x => x.panel === 'main').length;
  const nSub = all.filter(x => x.panel === 'sub').length;
  const T = [['main', '主图指标', nMain, '与 K 线共用价格坐标，直接叠在上面'],
             ['sub', '副图指标', nSub, '各自一套坐标，画在主图下方']];
  const n = inTab().length, np = pages();
  return '<div class="lvhead"><h2>📊 指标广场</h2>'
    + '<span class="lvtags"><span class="lvtag">' + all.length
    + ' 个指标</span><span class="lvtag">' + ((D || {}).signals || []).length
    + ' 条买点条件</span></span>'
    + '<span style="flex:1"></span>'
    + '<label class="lvwhy">示例用哪只票'
    + '<input id="icode" value="' + esc(CODE) + '" style="width:130px">'
    + '</label><a href="#" class="lvtag" id="igo">换</a>'
    /* 复权口径：这一页的每张小图都按它画、指标也按它算。 */
    + '<span class="lvwhy">|</span>'
    + [['bfq', '不复权'], ['qfq', '前复权'], ['hfq', '后复权']].map(
        ([k, t]) => '<a href="#" class="lvtag ifq' + (FQ === k ? ' on' : '')
          + '" data-f="' + k + '">' + t + '</a>').join('')
    + '</div>'
    /* 🔴 **把"什么时候用哪种"说出来**，不要只摆三个按钮：这一页的读者正是
       来搞清楚指标怎么回事的人，而"同一个 MACD 在三种口径下不一样"是他
       迟早会撞上的事（用户 2026-09-16："短期指标用前复权差异不大，主流的
       软件默认都是展示前复权，只是在做回测的时候使用后复权"）。 */
    + '<div class="lvwhy" style="margin:2px 0 6px">'
    + '<b>' + ({bfq: '不复权', qfq: '前复权', hfq: '后复权'}[FQ] || '') + '</b>：'
    + ({bfq: '与券商软件的价一致，但跨除权日有<b>假跌幅</b> —— '
             + 'MACD/KDJ 会在那一天凭空拐一下，看着像指标的形态。',
        qfq: '主流行情软件的默认口径，也是这一页的默认。'
             + '短周期指标（MACD/KDJ/RSI 这些只看最近几十根的）'
             + '<b>三种口径差别很小</b>，而它最新那根还等于当前实际价。',
        hfq: '历史不随新事件变 —— <b>回测与特征用的是它</b>；'
             + '代价是纵轴上的数与券商看到的价对不上。'}[FQ] || '')
    + '</div>'
    + (err ? '<div class="lvmsg bad">示例图取不到：' + esc(err)
             + '（指标定义仍然照常列出）</div>' : '')
    + '<div id="tabs">' + T.map(([kk, t, c, why]) =>
        '<div class="itab' + (TAB === kk ? ' on' : '') + '" data-t="' + kk
        + '" title="' + esc(why) + '">' + t + ' <span class="lvwhy">'
        + c + '</span></div>').join('') + '</div>'
    + '<div class="lvform" style="margin:10px 0 8px;gap:8px">'
    + '<label class="lvwhy">搜索<input id="iq" value="' + esc(Q)
    + '" placeholder="名称 / 说明 / 公式" style="width:180px"></label>'
    + '<span class="lvwhy">' + (T.find(x => x[0] === TAB) || [])[3] + '</span>'
    + '<span style="flex:1"></span>'
    + '<span class="lvwhy" id="ipinfo">共 ' + n + ' 个 · 第 ' + PAGE + '/'
    + np + ' 页（每页 ' + PER + ' 个）</span>'
    + '<a href="#" class="lvtag' + (PAGE <= 1 ? ' off' : '') + '" id="iprev">‹ 上一页</a>'
    + '<a href="#" class="lvtag' + (PAGE >= np ? ' off' : '') + '" id="inext">下一页 ›</a>'
    + '</div>'
    + '<div class="lvwhy" style="margin:2px 0 10px">'
    + '定义、参数、画哪几条线、预热多少根 —— <b>全在服务端一处</b>'
    + '（<code>assay/indicators.py</code>），这一页只是把它显示出来；'
    + '所以加一个指标，这里自动就有。'
    + '<br>🔴 <b>只取当前这一页的指标</b>：这一页的开销不在列表，而在'
    + '<b>每张卡都要一张真图</b> —— 上百个指标时"一次全算完再画一百张画布"'
    + '会把页面拖死。示例图用<b>不复权</b>近 ' + N + ' 根。</div>';
}

function ipCards(items) {
  if (!items.length) {
    return '<div class="none">' + (Q ? '没有匹配「' + esc(Q) + '」的指标'
      : '这一组还没有指标') + '</div>';
  }
  return '<div class="igrid">' + items.map((d, i) => ipCard(d, i)).join('')
    + '</div>';
}

function ipCard(d, i) {
  const sigs = ((D || {}).signals || []).filter(s => s.ind === d.id);
  const pan = d.panel === 'main' ? '叠在主图' : '独立副图';
  return '<div class="icard" data-i="' + d.id + '">'
    + '<h4><span style="font-size:15px">' + esc(d.short) + '</span>'
    + '<span class="lvwhy">' + esc(d.label) + '</span>'
    + '<span class="lvtag off" style="cursor:default">' + pan + '</span>'
    + (d.unit ? '<span class="lvwhy">单位 ' + esc(d.unit) + '</span>' : '')
    + '<span style="flex:1"></span>'
    /* ★ 走 `stockHref`（common.js 里那个唯一定义点）再补参数 ——
       页面里各拼各的话，个股页的地址变一次就要翻 N 个文件。
       ☞ 这**不是**"点股票代码跳走"的那种链接（那种一律走 spLink 开浮层），
         它是"带着这个指标去个股页看"的功能入口，跳走正是它要做的事。 */
    + '<a class="lvtag ilink" href="' + stockHref(CODE)
    + (d.panel === 'main' ? (d.id === 'boll' ? '&main=ma,boll' : '')
                          : '&sub=' + encodeURIComponent(d.id))
    + '" data-i="' + d.id + '">在个股页看 ›</a></h4>'
    /* 🔴 说明 / 公式 / 参数包进**定高**的 `.ihead` —— 不锁的话文字长短
       不一，同一行几张卡的画布各在各的高度上，横向比形态时眼睛要上下找
       （用户原话："公式、说明占的空间和下面图占的空间位置相对要固定"）。 */
    + '<div class="ihead">'
    + '<div class="lvwhy idesc iclamp">' + esc(d.desc) + '</div>'
    + '<div class="ifml iclamp">' + esc(d.formula || '（略）') + '</div>'
    + '<div class="ipar">参数：' + ((d.params || []).length
        ? (d.params).map(a => esc(a.label) + ' <b>' + a.default + '</b>'
            + '<span class="lvwhy">(' + a.min + '~' + a.max + ')</span>').join('　')
        : '<span class="lvwhy">没有可配的参数</span>')
      + '　│　画：' + (d.series || []).filter(x => x.style !== 'zero').map(x =>
        '<span class="idot" style="background:' + esc(x.color) + '"></span>'
        + esc(x.label) + (x.style === 'bar' || x.style === 'vbar'
                          ? '<span class="lvwhy">柱</span>' : ''))
        .join('　') + '</div>'
    /* 「展开」只在**真的被截断**时才显示（渲染后量 scrollHeight，见 ipClamp）
       —— 常驻一个点了没变化的按钮比不给更糟（同 backLink 那条）。 */
    + '<div class="imore" data-i="' + d.id + '" hidden>'
    + '<a href="#" class="lvtag imorea">展开 ▾</a></div>'
    + '</div>'
    + '<div class="cvbox" style="margin-top:6px">'
    + '<canvas class="icv" data-i="' + d.id
    + '" style="width:100%;height:190px;display:block"></canvas></div>'
    + (sigs.length
       ? '<div class="lvwhy" style="margin-top:6px">🎯 可用作买点条件：'
         + sigs.map(s => '<b>' + esc(s.label) + '</b>（' + esc(s.sample) + '）')
           .join('、')
         + '　<a class="lvtag" href="/alerts.html">去买点页 ›</a></div>'
       : '<div class="lvwhy" style="margin-top:6px">'
         + '（还没有基于它的买点条件）</div>')
    + '</div>';
}

function sigTable() {
  const rows = D.signals || [];
  if (!rows.length) return '';
  return '<div class="lvsec" style="margin-top:14px"><h3>买点条件'
    + '<span class="lvwhy">每条 = 一个指标 + 一个阈值。'
    + '买点页会把它<b>反解成一个触发价</b>（"今天收在那个价位，'
    + '这条件刚好成立"）—— 所以它和价格档是同一个口径</span></h3>'
    + '<div class="pw"><table class="lvt">'
    + '<tr><th class="tx">条件</th><th class="tx">基于</th>'
    + '<th class="tx">方向</th><th class="tx">默认</th>'
    + '<th class="tx">参数</th><th class="tx">怎么用</th></tr>'
    + rows.map(s => '<tr><td class="tx"><b>' + esc(s.label) + '</b></td>'
        + '<td class="tx">' + esc(s.ind_label) + '</td>'
        + '<td class="tx">' + (s.dir === 'up'
            ? '<span style="color:var(--up)">涨到才成立</span>'
            : '<span style="color:var(--down)">跌到才成立</span>') + '</td>'
        + '<td class="tx">' + esc(s.sample) + '</td>'
        + '<td class="tx lvwhy">' + (s.args || []).map(a =>
            esc(a.label) + ' ' + a.default).join('　') + '</td>'
        + '<td class="tx lvwhy">' + esc(s.tip) + '</td></tr>').join('')
    + '</table></div></div>';
}

function foot() {
  return '<div class="lvsec" style="margin-top:14px"><h3>口径（踩过才定下来的）</h3>'
    + '<div class="lvwhy">'
    + '🔴 <b>口径跟行情软件走，不跟教科书走</b> —— 对不上券商软件时，'
    + '人会以为是<b>数据错了</b>，而不会想到是口径不同。'
    + '<br>· KDJ 用<b>通用平滑</b>（K = 2/3·前K + 1/3·RSV），不是 SMA(3)'
    + '<br>· BOLL 的 σ 用<b>总体</b>标准差（除 N），不是样本（除 N−1）'
    + '<br>· ATR / RSI 用 <b>Wilder</b> 递推（1/N），不是简单均值'
    + '<br>🔴 <b>预热有下限</b>：RSI/ATR 这类 Wilder 递推永远记着起点，'
    + '多喂 24 根末尾的值就会差几厘 —— 所以服务端固定多取一截再切掉，'
    + '前端自己算的话"少取了导致头部是错的"<b>不报错</b>，只是曲线不对。'
    + '<br>🔴 <b>WR 数值越小越强</b>（与 KDJ 方向相反）—— 它是"离最高点多远"。'
    + '</div></div>';
}

/* 每张卡画一张小图。**复用 drawKChart** —— 另写一个"迷你画法"的话，
   广场上看到的形状会和个股页上的慢慢不一样，而那不报错。
   ★ 只画**当前页**那几张：卡片本来就只渲染了这一页。 */
function draw() {
  if (!BARS || !ROWS) return;
  const by = {};
  PANELS.forEach(p => by[p.id] = p);
  $$('.icv').forEach(cv => {
    const id = cv.dataset.i, p = by[id];
    if (!p) return;
    if (p.panel === 'main') {
      /* 主图叠加型（MA / BOLL）：把它那几条线并进 bars —— 同一条时间轴。 */
      const keys = (p.series || []).map(x => x.key);
      const bars = BARS.map((b, i) => {
        const r = ROWS[i];
        if (!r) return b;
        const o = Object.assign({}, b);
        keys.forEach(k => o[k] = r[k]);
        return o;
      });
      drawKChart(cv, {bars: bars, hover: null});
      return;
    }
    drawKChart(cv, {bars: BARS, hover: null,
      subs: [{id: p.id, label: p.short || p.label, unit: p.unit,
              rows: ROWS, series: p.series}]});
  });
}

/* 「展开」按钮：**只在文字真的被截断时才露出来**。
   常驻一个点了没变化的按钮比不给更糟（同 backLink 那条），而"截没截断"
   只有渲染完量一下才知道 —— 同一段说明在宽屏上三行装得下、窄屏上装不下。
   🔴 所以它也要跟着 resize 重算：窄屏截断了、拉宽之后按钮还留着的话，
     点了什么都不会变。 */
function ipClamp() {
  $$('.icard').forEach(card => {
    const more = card.querySelector('.imore');
    if (!more) return;
    const cut = [...card.querySelectorAll('.iclamp')]
      .some(e => !e.classList.contains('on')
                 && e.scrollHeight - e.clientHeight > 2);
    /* 已经展开的那张：按钮要留着（收起来用），别因为"现在不截断"就藏掉。 */
    const open = !!card.querySelector('.iclamp.on');
    more.hidden = !(cut || open);
  });
}

function wire() {
  wireStarsAll();
  /* 展开 / 收起：事件委托绑在**稳定的容器**上 —— 卡片是 innerHTML 整块
     填进去的，逐个绑的话翻一页就全没 handler（点了没反应且不报错）。 */
  const cb = $('#pg');
  if (cb) cb.onclick = ev => {
    const a = ev.target.closest('.imorea');
    if (!a) return;
    ev.preventDefault();
    const card = a.closest('.icard');
    const on = !card.querySelector('.iclamp.on');
    card.querySelectorAll('.iclamp').forEach(e => e.classList.toggle('on', on));
    a.textContent = on ? '收起 ▴' : '展开 ▾';
    ipClamp();
  };
  const go = () => {
    const v = ($('#icode').value || '').trim();
    if (!v) return;
    CODE = v; BKEY = null; nav(); load();
  };
  if ($('#igo')) $('#igo').onclick = ev => { ev.preventDefault(); go(); };
  $$('.ifq').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    if (FQ === a.dataset.f) return;
    FQ = a.dataset.f; BKEY = null;      /* K 线要按新口径重取 */
    nav(); load();
  });
  if ($('#icode')) $('#icode').onkeydown = ev => {
    if (ev.key === 'Enter') go();
  };
  /* 页签：换一组**从第 1 页开始** —— 停在第 3 页而新的一组只有 1 页的话，
     屏幕上就是一片空白（而它不报错）。 */
  $$('#tabs .itab').forEach(e => e.onclick = () => {
    if (TAB === e.dataset.t) return;
    TAB = e.dataset.t; PAGE = 1; nav(); load();
  });
  const pgo = d => {
    const np = pages(), want = Math.min(np, Math.max(1, PAGE + d));
    if (want === PAGE) return;
    PAGE = want; nav(); load();
  };
  if ($('#iprev')) $('#iprev').onclick = ev => { ev.preventDefault(); pgo(-1); };
  if ($('#inext')) $('#inext').onclick = ev => { ev.preventDefault(); pgo(1); };
  const q = $('#iq');
  if (q) {
    /* ★ 搜索**防抖**：每敲一个字就重取一次指标数据的话，
       上百个指标时每次都是一轮请求。 */
    let t = null;
    q.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        Q = q.value; PAGE = 1; nav(); load();
      }, 260);
    };
  }
}
/* 🔴 resize 之后**两件事都要做**：重画（画布是按 CSS 像素算的）+ 重算
   截断（同一段说明在宽屏三行装得下、窄屏装不下）。只重画的话，拉宽之后
   「展开」还留在那儿，点了什么都不会变（同"给一个点了没反应的按钮"）。 */
window.addEventListener('resize', () => { if (BARS) draw(); ipClamp(); });
</script>
