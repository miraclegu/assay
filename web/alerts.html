<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>买点 · assay</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared/common.css">
<div id="app">
  <div id="top"></div>
  <div class="page" id="pg"></div>
</div>
<div id="tip"></div>
<script src="/shared/common.js"></script>
<script src="/shared/kchart.js"></script>
<script src="/shared/stockpop.js"></script>
<script>
/* ============ 股息率买点清单 ============
   就是把用户手里那张 Excel 搬进来：一只票一行，一个「实际分红（每股）」，
   再写几档想买的价；每档旁边是那个价对应的股息率。到价提醒。

   🔴 分红这一列是**实际已公告**的（本地 std/dividend + 东财
     RPT_SHAREBONUS_DET 合并，取最近一个完整会计年度的合计），
     **不存在账本里、也不能手填** —— "预计分红"没有价值：猜出来的目标价
     看着和真的一样，而它错在你不会回头检查的地方。
     新公告一到，所有档位的目标价**自动跟着变**。

   ★ 它**不是策略**（没有回测、不产生委托）—— 是手工的挂单计划表。
     所以这一页不出现任何"回测/信号/持仓"，只回答两件事：
       ① 每档目标价是多少、对应股息率多少
       ② 现在离最近的那档还差多少
   ★ 每档可以填【目标价】也可以填【目标股息率】，另一个由分红现算。
     存的是你填的那个（by），另一个不存 —— 都存下来的话改了分红以后
     另一个就是过期的，而它看着仍然像个正常数字。
   ★ 现价与自选/持仓页**共用同一个实时库**（datalake/rt/），页面不额外
     打行情接口；抓取范围里已经包含这张清单里的票。 */
let V = null;            // 上一次取回的整份清单
let EDIT = null;         // 正在编辑哪一行（code），'' = 新增
let FORM = null;         // 编辑中的表单状态（不直接改 V）
let SORT = 'near';       // near = 按接近度（默认）/ mine = 我排的顺序

pageHead('alerts', '🎯 买点');
load();

async function load() {
  const pg = $('#pg');
  if (!V) pg.innerHTML = '<div class="lvwhy" style="padding:20px">加载中…</div>';
  try {
    V = await j('/api/alerts');
    if (V.error) throw new Error(V.error);
    /* 买点条件清单取一次就够（进程内不变）。取不到也**不能让整页打不开**：
       退回空清单，那时只能按价格/股息率填，而不是白屏
       （同「外部挂了退回本地那份并把 err 给页面」那条）。 */
    if (!ASIG.length) ASIG = ((await j('/api/indicators/defs')
      .catch(() => ({}))).signals) || [];
    render();
  } catch (e) {
    pg.innerHTML = '<div class="lvmsg bad">' + esc(String(e)) + '</div>';
  }
}

/* ---- 排序 ----
   默认【按接近度】而不是"我排的顺序"：这一页是拿来回答"现在该做什么"的，
   跌破的必须在最上面。但保留"我排的顺序"—— 那张表的行序是用户自己的分组
   习惯（银行放一起、公用事业放一起），排序把它打散了就不好扫。 */
function sorted(rows) {
  if (SORT === 'mine') return rows;
  const rank = {hit: 0, near: 1, far: 2};
  return rows.slice().sort((a, b) => {
    const ra = rank[a.state] ?? 3, rb = rank[b.state] ?? 3;
    if (ra !== rb) return ra - rb;
    const ga = a.next ? a.next.gap : 9, gb = b.next ? b.next.gap : 9;
    return (gb ?? 9) - (ga ?? 9);      /* gap 是负的：越接近 0 越近 */
  });
}

function render() {
  const pg = $('#pg'), rows = V.rows || [];
  pg.innerHTML = head() + '<div class="lvmsg" id="amsg"></div>'
    + (EDIT === null ? '' : editor()) + table(sorted(rows)) + foot();
  /* 顶栏那个红点用【本页已经取回的这份数据】点，不再打一遍接口；
     改完一行也要立刻跟上 —— 只在加载时点一次的话，刚加的那只到价了
     红点还是灭的，而它不报错。 */
  setAlertDot(V);
  wire();
}

function head() {
  const n = (V.rows || []).length;
  const src = V.price_src === '实时' ? ' · 实时 ' + esc(String(V.rt_at || '').slice(5))
    : (V.price_src === '部分实时' ? ' · 部分实时 ' + V.rt_n + '/' + n : ' · 收盘价');
  return `<div class="lvhead">
      <h2 style="font-size:17px">买点清单 <span class="lvwhy">${n} 只</span></h2>
      <span class="lvtag${V.price_src === '实时' ? ' on' : ''}"
        title="现价与持仓页/自选页共用同一个实时库（datalake/rt/），本页不额外调接口"
        >数据日 ${esc(V.date || '—')}${src}</span>
      ${V.n_hit ? `<span class="lvtag warn" title="现价已跌到目标价以下"
        >⚑ ${V.n_hit} 只到价</span>` : ''}
      ${V.n_near ? `<span class="lvtag" title="现价在目标价上方 ${
        ((V.near_default || 0) * 100).toFixed(0)}% 以内"
        >${V.n_near} 只接近</span>` : ''}
      ${divTag()}
      <span style="flex:1"></span>
      <a href="#" class="chip" id="adivref"
        title="立刻重抓一次分红明细（东财 RPT_SHAREBONUS_DET）——\n平时一天只抓一次，这个按钮是"我知道刚出了公告"时用的"
        >↻ 刷新分红</a>
      <a href="#" class="chip${SORT === 'near' ? ' on' : ''}" id="asort"
        title="默认按接近度排（跌破的在最上面）；切成"我排的顺序"就是加入的先后"
        >${SORT === 'near' ? '按接近度' : '我排的顺序'}</a>
      <div id="aadd" style="flex:0 0 240px"></div>
    </div>`;
}

/* 分红要显示到【它本来的精度】：2.7056 写成 2.71 的话，与悬浮提示里的
   "1.2701 + 1.4355" 对不上，看着像哪儿算错了。去掉末尾的 0。 */
const divN = v => v == null ? '—'
  : (+v).toFixed(4).replace(/0+$/, '').replace(/\.$/, '');

/* ---- 分红数据是什么时候更新的 ----
   ★ 必须显示：这一页的目标价全是"分红 ÷ 股息率"算出来的，
     分红过期就整页都是过期的数 —— 而它不报错。
   ★ 判据来自服务端（每只票的 ext.fetched）—— 前端不自己判新旧。 */
function divTag() {
  const sg = V.suggest || {}, rows = V.rows || [];
  const st = rows.map(x => (sg[x.code] || {}).ext || {});
  const today = st.filter(x => x.fetched === V.day).length;
  const nnew = st.reduce((a, x) => a + (x.n_new || 0), 0);
  const err = (st.find(x => x.err) || {}).err;
  if (err) return `<span class="lvtag warn" title="${esc(err)}"
    >分红：外部源取不到，用本地那份</span>`;
  if (!rows.length) return '';
  return `<span class="lvtag${today === rows.length ? ' on' : ''}"
    title="分红明细 = 本地 std/dividend.parquet（聚宽）+ 东财 RPT_SHAREBONUS_DET 合并；&#10;外部一天只抓一次，同一次分红按(报告期,金额)/(公告日,金额)去重"
    >分红 ${today === rows.length ? '今天已更新' : today + '/' + rows.length + ' 已更新'}${
      nnew ? ' · 外部新增 ' + nnew + ' 条' : ''}</span>`;
}

/* ---- 一行的编辑器 ----
   ★ 表单每一项都有【标签】，不靠 placeholder —— 字段取不到值时
     placeholder 也没了，剩一个空框，人不知道要填什么。 */
/* 🔴 有哪些买点条件（距均线 / 金叉 / 超卖…）**由服务端给**
   （/api/indicators/defs，正本在 assay/indicators.py）。页面写死一份的话，
   加一条条件要改两处，而漏改那处的表现是**新条件在页面上根本选不到**：
   不报错，只是没人知道它存在（同「可选基准由服务端给」那条）。 */
let ASIG = [];
function asig(id) { return ASIG.find(x => x.id === id) || null; }
/* 新加一个指标档时的默认值：第一条条件 + 它自己的默认参数与默认阈值。 */
function aNewInd() {
  const d = ASIG[0];
  if (!d) return {by: 'price', v: ''};
  const args = {};
  d.args.forEach(a => args[a.key] = a.default);
  return {by: 'ind', sig: d.id, args: args, v: d.v};
}
/* 一个指标档在编辑器里的样子：条件下拉 + 它的参数 + 阈值。
   ★ 参数框是**照服务端那份 args 渲染**的 —— 页面不知道 `w` 该念成
     "均线周期"还是别的，那句中文在服务端（同「指标的中文标签在服务端」）。 */
function indCell(t, i) {
  const d = asig(t.sig) || ASIG[0] || {args: [], unit: '', tip: ''};
  const args = t.args || {};
  return `<select class="asig" data-i="${i}" style="max-width:150px">
      ${ASIG.map(x => `<option value="${x.id}"${x.id === t.sig ? ' selected' : ''}
        >${esc(x.label)}</option>`).join('')}
    </select>
    ${d.args.map(a => `<label style="margin-left:6px" title="${esc(a.label)}">${esc(a.label)}
      <input class="aarg" data-i="${i}" data-k="${a.key}" type="number"
        min="${a.min}" max="${a.max}" style="width:56px"
        value="${args[a.key] == null ? a.default : args[a.key]}"></label>`).join('')}
    <label style="margin-left:6px">${d.dir === 'up' ? '涨到' : '跌到'}
      <input class="av" data-i="${i}" value="${t.v == null ? '' : t.v}"
        style="width:70px;text-align:right"></label>${esc(d.unit || '')}
    <div class="lvwhy">${esc(d.tip || '')}
      <a class="lvtag" href="/indicators.html" target="_blank" rel="noopener"
         title="指标广场：这些条件基于哪些指标、怎么算的">指标说明 ↗</a></div>`;
}

function editor() {
  const f = FORM || {};
  const tiers = f.tiers || [];
  const sg = (V.suggest || {})[f.code];
  const fy = sg && sg.fy;          /* 实际分红：只读，由数据来 */
  return `<div class="lvsec" style="margin-bottom:12px">
    <h3>${f.isnew ? '新增' : '修改'} ${esc(f.code || '')}
      <span class="lvwhy">${esc(f.name || '')}</span></h3>
    <div class="frow">
      <label>实际分红（每股，元）
        <div class="rov" id="adiv">${fy ? fy.per_share : '—'}</div>
      </label>
      <span class="lvwhy">
        ${fy ? `<b>${esc(fy.src)}</b>：${esc(fy.detail || '')}<br>` :
          '<b style="color:var(--warn)">查不到已公告的分红</b>'
          + '（从不分红 / 数据还没到）—— 这一行只能按<b>目标价</b>填，'
          + '按目标股息率填的档算不出目标价。<br>'}
        ${sg && sg.r365 ? `另一个口径「近 12 个月已公告」= ${sg.r365.per_share}
          （不参与目标价：半年派的公司刚公告完中期时它会混入不同归属期）<br>` : ''}
        ${(sg && sg.ext && sg.ext.n_new) ? `<b style="color:var(--accent)">东财比本地新
          ${sg.ext.n_new} 条</b>：${(sg.ext.new || []).map(x =>
            esc(x.report_date + ' ' + x.per_share + '（' + (x.progress || '')
                + '，公告 ' + x.plan_pub + '）')).join('、')}<br>` : ''}
        🔴 分红<b>不能手填也不存下来</b> —— "预计分红"没有价值，而存一份就会
        过期。新公告一到，这一行所有档位的目标价自动跟着变。
      </span>
      <label>「接近」阈值（%）
        <input id="anear" value="${f.near == null ? '' : (f.near * 100)}"
          style="width:70px" placeholder="${((V.near_default || 0) * 100).toFixed(0)}">
      </label>
      <label>备注
        <input id="anote" value="${esc(f.note || '')}" style="width:200px">
      </label>
    </div>
    <table class="lvt" style="margin-top:8px">
      <tr><th class="tx">档</th><th class="tx">按什么填</th><th class="rt">数值</th>
        <th class="rt">换算出来的</th><th class="tx">备注</th><th></th></tr>
      ${tiers.map((t, i) => {
        const div = (fy && fy.per_share) || 0;
        const v = parseFloat(t.v) || 0;
        let other = '—';
        if (div > 0 && v > 0) {
          other = t.by === 'price'
            ? (div / v * 100).toFixed(2) + '%　（' + div + '/' + v + '）'
            : (div / (v >= 1 ? v / 100 : v)).toFixed(2) + ' 元';
        }
        const byCell = `<td class="tx"><select class="aby" data-i="${i}">
          <option value="price"${t.by === 'price' ? ' selected' : ''}>目标价</option>
          <option value="yield"${t.by === 'yield' ? ' selected' : ''}>目标股息率 %</option>
          <option value="ind"${t.by === 'ind' ? ' selected' : ''}>指标条件</option>
        </select></td>`;
        if (t.by === 'ind') return `<tr>
        <td class="tx lvwhy">${i + 1}</td>
        ${byCell}
        <td class="tx" colspan="2">${indCell(t, i)}</td>
        <td class="tx"><input class="an" data-i="${i}" value="${esc(t.note || '')}"
          style="width:120px"></td>
        <td class="tx"><a href="#" class="atrm" data-i="${i}">删</a></td>
      </tr>`;
        return `<tr>
        <td class="tx lvwhy">${i + 1}</td>
        ${byCell}
        <td class="rt"><input class="av" data-i="${i}" value="${t.v == null ? '' : t.v}"
          style="width:90px;text-align:right"></td>
        <td class="rt lvwhy">${esc(other)}</td>
        <td class="tx"><input class="an" data-i="${i}" value="${esc(t.note || '')}"
          style="width:120px"></td>
        <td class="tx"><a href="#" class="atrm" data-i="${i}" class="lvwhy">删</a></td>
      </tr>`; }).join('')}
    </table>
    <div class="frow" style="margin-top:8px">
      <button class="btn" id="atadd">+ 加一档</button>
      <span style="flex:1"></span>
      ${f.isnew ? '' : '<button class="btn" id="adel">删掉这一行</button>'}
      <button class="btn" id="acancel">取消</button>
      <button class="btn on" id="asave">保存</button>
    </div>
    <div class="lvmsg" id="aemsg"></div>
  </div>`;
}

function table(rows) {
  if (!rows.length) return '<div class="none">清单是空的 —— '
    + '右上角搜代码或名称加一只 —— 分红自动取实际已公告的，你只写几档想买的价</div>';
  const nt = Math.max(1, ...rows.map(x => (x.tiers || []).length));
  const st = {hit: ['到价', 'var(--up)'], near: ['接近', 'var(--warn)'],
              far: ['', 'var(--dim)'], na: ['', 'var(--dim)']};
  return `<div class="lvsec"><h3>盯价
      <span class="lvwhy">价格档从高到低（指标档排在后面）· 到了哪一档就点亮哪一档
        ·「触发价」对指标档是<b>现算</b>的：今天收在那个价位，条件刚好成立</span></h3>
    <div class="pw"><table class="pkt">
      <tr><th class="tx">名称</th>
        <th class="rt">现价</th><th class="rt">当日</th>
        <th class="rt">实际分红</th><th class="rt">当前股息率</th>
        ${Array.from({length: nt}, (_, i) => `<th class="rt">第 ${i + 1} 档</th>`).join('')}
        <th class="tx">状态</th><th class="tx"></th></tr>
      ${rows.map(x => `<tr${x.state === 'hit' ? ' class="ahit"'
          : (x.state === 'near' ? ' class="anear"' : '')}>
        <td class="tx">${cnCell(x.code, x.name)}${x.missing
            ? '<span class="stale" title="面板里查不到这个代码 —— 可能填错了，或已退市/未上市。这一行刻意留着，不静默丢掉">查不到</span>' : ''}
          ${x.is_st ? '<span class="stale">ST</span>' : ''}
          ${x.note ? `<span class="lvwhy" style="cursor:help"
            title="${esc(x.note)}">✎</span>` : ''}</td>
        <td class="rt">${fmtN(x.price)}${x.rt_src ? `<span class="lvwhy"
          style="color:var(--accent)" title="盘中实时价（${esc(x.rt_at || '')}）">实</span>` : ''}</td>
        <td class="rt" style="color:${upc(x.change_pct)}">${pctv(x.change_pct)}</td>
        <td class="rt" title="${x.div == null ? '查不到已公告的分红'
          : esc((x.div_src || '') + '：' + (x.div_detail || ''))}"
          >${x.div == null
            ? '<span class="stale" title="从不分红 / 数据还没到 —— 按目标股息率填的档算不出目标价">查不到</span>'
            : divN(x.div)}</td>
        <td class="rt">${x.yield_now == null ? '—'
          : (x.yield_now * 100).toFixed(2) + '%'}</td>
        ${Array.from({length: nt}, (_, i) => {
          const t = (x.tiers || [])[i];
          if (!t) return '<td class="rt lvwhy">—</td>';
          const s = st[t.state] || st.far;
          const up = t.dir === 'up';
          /* 🔴 **方向不是都朝下**：价格档与「距均线/超卖」是跌到才算，
             「金叉」是涨上去才成立。一律写"跌 x%"的话，一只离金叉还差
             2% 的票会被读成"还要跌 2%"——意思正好反了，而它不报错。 */
          const gapTxt = t.gap == null ? ''
            : (t.state === 'hit' ? (up ? '已站上' : '已跌破')
               : (t.gap < 0 ? '跌 ' + (-t.gap * 100).toFixed(1) + '%'
                            : '涨 ' + (t.gap * 100).toFixed(1) + '%'));
          return `<td class="rt" style="color:${s[1]}"
            title="${t.by === 'ind' ? esc(t.text || '') + '　触发价是【现算】的：'
                      + '今天收在这个价位，这个条件刚好成立（均线每天在动，'
                      + '所以它每天都不一样）'
                      : (t.by === 'price' ? '填的是目标价' : '填的是目标股息率')}${
              t.note ? '　' + esc(t.note) : ''}">
            <b>${t.price == null ? '—' : fmtN(t.price)}</b>
            <div class="lvwhy" style="color:inherit">${
              t.by === 'ind' ? esc(t.text || '')
                : (t.yield == null ? '' : (t.yield * 100).toFixed(2) + '%')}</div>
            <div class="lvwhy">${t.by === 'ind' && t.price == null
              ? esc(t.why || '算不出') : gapTxt}</div></td>`;
        }).join('')}
        <td class="tx">${x.state === 'hit'
          ? `<b style="color:var(--up)">到价 · 第 ${x.hit + 1} 档</b>`
          : (x.state === 'near'
             ? `<b style="color:var(--warn)">接近 · 第 ${x.near + 1} 档</b>`
             : (x.next && x.next.gap != null
                ? '<span class="lvwhy">还要' + (x.next.gap < 0
                    ? '跌 ' + (-x.next.gap * 100).toFixed(1)
                    : '涨 ' + (x.next.gap * 100).toFixed(1)) + '%</span>' : ''))}</td>
        <td class="tx"><a href="#" class="aed" data-c="${esc(x.code)}"
          title="${x.note ? '备注：' + esc(x.note) : '改这一行'}">改</a></td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}

function foot() {
  const fired = V.fired_today || [];
  return `${fired.length ? `<div class="lvsec" style="margin-top:12px">
      <h3>今天提醒过 <span class="lvwhy">${fired.length} 条 · 同一档一天只提醒一次</span></h3>
      <table class="lvt">
        <tr><th class="tx">时刻</th><th class="tx">名称</th>
          <th class="tx">类型</th><th class="rt">目标价</th><th class="rt">当时现价</th></tr>
        ${fired.slice().reverse().slice(0, 30).map(r => `<tr>
          <td class="tx lvwhy">${esc(String(r.ts || '').replace('T', ' ').slice(5))}</td>
          <td class="tx">${cnCell(r.code, r.name)}</td>
          <td class="tx">${r.kind === 'hit' ? '到价' : '接近'}</td>
          <td class="rt">${fmtN(r.target)}</td>
          <td class="rt">${fmtN(r.price)}</td></tr>`).join('')}
      </table></div>` : ''}
    <div class="lvwhy" style="margin-top:10px">
      这一页<b>不是策略</b>：没有回测、不产生委托，就是手工的挂单计划表
      （止损、调仓那些规则在实盘模块里，一条都不在这儿重写）。<br>
      每档<b>存的是你填的那个数</b>（目标价或目标股息率），另一个由分红
      <b>现算</b> —— 两个都存的话，改了分红以后另一个就是过期的，
      而它看着仍然像个正常数字。<br>
      🔴 <b>分红是【实际已公告】的，不存也不能手填</b>：本地
      <code>std/dividend.parquet</code>（聚宽）与东财
      <code>RPT_SHAREBONUS_DET</code> 合并，每天更新一次，取<b>最近一个完整
      会计年度</b>的合计（口径与红利策略同源：按董事会预案公告日可见、
      同一期次去重留流程最靠后那条）。
      <b>"预计分红"没有价值</b> —— 猜出来的目标价看着和真的一样，
      而它错在你不会回头检查的地方；存一份也会过期。
      所以新公告一到，这张表<b>所有档位的目标价自动跟着变</b>。<br>
      查不到已公告分红的票（从不分红 / 数据还没到）那一格标「查不到」，
      按目标股息率填的档就<b>算不出目标价</b> —— 不猜一个数填上去。<br>
      账本 <b>append-only</b>（<code>live/alerts.jsonl</code>）：改一行是
      追加一条、删一行也是追加一条，当前清单由<b>重放</b>得出。<br>
      <b>备注不占一列</b> —— 它是给自己看的一句话，长短不定，摆进表里会把
      要扫的数字挤走。有备注的行名称后面带 <b>✎</b>，鼠标停上去就是；
      要改点那一行的「改」。<br>
      到价提醒走 macOS 通知中心，<b>serve.py 开着时才有</b>；同一
      (票, 档, 类型) <b>一天只提醒一次</b> —— 价格在阈值上下抖一抖就发几十条
      的话，通知就没人看了。
    </div>`;
}

/* ---------------------------------------------------------------- 交互 */
function wire() {
  mountSearch($('#aadd'), {onPick: async r => {
    if ((V.rows || []).some(x => x.code === r.code)) {
      EDIT = r.code; FORM = formOf(r.code); render();
      return;
    }
    /* 新增：分红不用问人 —— 先把它的实际分红取回来【显示】出来，
       人只填想买的价。 */
    let sg = null;
    try { sg = (await j('/api/alerts/suggest?code='
      + encodeURIComponent(r.code))).suggest; } catch (e) { sg = null; }
    if (sg) V.suggest = Object.assign({}, V.suggest, {[r.code]: sg});
    EDIT = ''; FORM = {code: r.code, name: r.name || '', isnew: true,
      note: '', near: null,
      tiers: [{by: 'yield', v: ''}, {by: 'yield', v: ''}, {by: 'yield', v: ''}]};
    render();
    if ($('.av')) $('.av').focus();
  }, placeholder: '加一只：代码或名称'});

  $('#asort').onclick = ev => { ev.preventDefault();
    SORT = SORT === 'near' ? 'mine' : 'near'; render(); };
  $('#adivref').onclick = async ev => {
    ev.preventDefault();
    const m = $('#amsg');
    m.className = 'lvmsg'; m.textContent = '重抓分红明细…';
    try {
      const r = await post('/api/alerts/refresh_div', {});
      await load();
      const m2 = $('#amsg');
      m2.className = 'lvmsg ok';
      m2.textContent = '已重抓：' + (r.n_codes || 0) + ' 只、'
        + (r.n_rows || 0) + ' 条明细'
        + (r.n_new ? '，其中 ' + r.n_new + ' 条比本地新' : '，与本地一致');
    } catch (e) { const m2 = $('#amsg') || m;
      m2.className = 'lvmsg bad'; m2.textContent = String(e); }
  };
  $$('.aed').forEach(a => a.onclick = ev => { ev.preventDefault();
    EDIT = a.dataset.c; FORM = formOf(a.dataset.c); render(); });
  if (!$('#asave')) return;

  /* 编辑器里的每一次输入都要**回写 FORM 再重渲染** —— 只改 DOM 的话，
     "换算出来的"那一列不会跟着动，而那一列正是这一页的意义。 */
  const pull = () => {
    FORM.note = $('#anote').value;
    const nv = $('#anear').value.trim();
    FORM.near = nv === '' ? null : (parseFloat(nv) / 100);
    $$('.aby').forEach(e => FORM.tiers[+e.dataset.i].by = e.value);
    $$('.asig').forEach(e => FORM.tiers[+e.dataset.i].sig = e.value);
    $$('.aarg').forEach(e => {
      const t = FORM.tiers[+e.dataset.i];
      t.args = Object.assign({}, t.args);
      t.args[e.dataset.k] = parseInt(e.value, 10);
    });
    $$('.av').forEach(e => FORM.tiers[+e.dataset.i].v = e.value.trim());
    $$('.an').forEach(e => FORM.tiers[+e.dataset.i].note = e.value);
  };
  const redraw = () => { pull(); render(); };
  $$('.aby').forEach(e => e.onchange = e2 => {
    const i = +e.dataset.i, by = e.value;
    /* 切到「指标条件」时要**带上默认的条件与参数**：留个空壳的话
       下拉是空的、保存直接报错，而人看不出要填什么。 */
    FORM.tiers[i] = by === 'ind'
      ? aNewInd()
      : {by: by, v: '', note: FORM.tiers[i].note || ''};
    render();
  });
  $$('.asig').forEach(e => e.onchange = () => {
    const i = +e.dataset.i, d = asig(e.value);
    const args = {};
    (d ? d.args : []).forEach(a => args[a.key] = a.default);
    FORM.tiers[i] = {by: 'ind', sig: e.value, args: args, v: d ? d.v : '',
                     note: FORM.tiers[i].note || ''};
    render();
  });
  $$('.aarg').forEach(e => e.onchange = () => {
    const i = +e.dataset.i;
    FORM.tiers[i].args = Object.assign({}, FORM.tiers[i].args);
    FORM.tiers[i].args[e.dataset.k] = parseInt(e.value, 10);
    pull(); render();
  });
  $$('.av').forEach(e => e.onchange = redraw);
  $('#atadd').onclick = () => { pull();
    const prev = FORM.tiers[FORM.tiers.length - 1];
    FORM.tiers.push(prev && prev.by === 'ind' ? aNewInd()
      : {by: (FORM.tiers.length && FORM.tiers[0].by) || 'yield', v: ''});
    render(); };
  $$('.atrm').forEach(a => a.onclick = ev => { ev.preventDefault(); pull();
    FORM.tiers.splice(+a.dataset.i, 1); render(); });
  $('#acancel').onclick = () => { EDIT = null; FORM = null; render(); };
  if ($('#adel')) $('#adel').onclick = async () => {
    if (!confirm('把 ' + FORM.code + ' 从买点清单里删掉？\n\n'
      + '账本是 append-only 的 —— 会追加一条 remove，历史仍然保留。')) return;
    try {
      await post('/api/alerts', {act: 'remove', code: FORM.code});
      EDIT = null; FORM = null; await load();
    } catch (e) { msg(String(e), true); }
  };
  $('#asave').onclick = async () => {
    pull();
    const tiers = FORM.tiers
      .filter(t => String(t.v).trim() !== '')
      .map(t => (t.by === 'ind'
        ? {by: 'ind', sig: t.sig, args: t.args || {},
           v: parseFloat(t.v), note: t.note || ''}
        : {by: t.by, v: parseFloat(t.v), note: t.note || ''}));
    try {
      await post('/api/alerts', {act: 'set', code: FORM.code,
        tiers: tiers, note: FORM.note, near: FORM.near});
      EDIT = null; FORM = null; await load();
      msg('已保存');
    } catch (e) { msg(String(e), true); }
  };
}

function formOf(code) {
  const x = (V.rows || []).find(y => y.code === code) || {};
  /* 编辑时要拿【存的那个】—— 表里显示的是换算后的两个数，
     照着显示值回填会把"我填的是股息率"变成"我填的是价格"。 */
  return {code: code, name: x.name || '', note: x.note || '',
    near: x.near_used === (V.near_default) ? null : x.near_used,
    tiers: (x.tiers || []).map(t => (t.by === 'ind'
      /* 指标档回填的是**条件与阈值**，不是那个触发价 —— 触发价是现算的
         派生物，照它回填等于把"距 MA20 -3%"变成"目标价 10.84"，
         而明天那个数就不对了（同「照显示值回填会把股息率变成价格」）。 */
      ? {by: 'ind', sig: t.sig, args: Object.assign({}, t.args), v: t.v,
         note: t.note || ''}
      : {by: t.by,
         v: t.by === 'price' ? t.price : +(t.yield * 100).toFixed(4),
         note: t.note || ''}))};
}

function msg(t, bad) {
  const m = $('#aemsg') || $('#amsg');
  if (!m) return;
  m.className = 'lvmsg ' + (bad ? 'bad' : 'ok');
  m.textContent = t;
}
</script>
