<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个股 · assay</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared/common.css">
<div id="app">
  <div id="top"></div>
  <div class="page" id="pg"></div>
</div>
<div id="tip"></div>
<script src="/shared/common.js"></script>
<script src="/shared/kchart.js"></script>
<script src="/shared/stockpop.js"></script>
<script>
/* ============ 个股 ============
   ★ 这一页【不出现 SQL】—— 它回答固定的几个问题，接口也是固定形状的。
     （原来那个只读 SQL 页已取消；命令行工具仍在 datalake/build/query.py。）
   ★ 一次并发拉 7 个接口，任何一个失败只让它那一块显示错误，
     不拖垮整页 —— 看 K 线的时候不该因为"解禁表读不了"整页白屏。 */
let CODE = qs('code') || localStorage.getItem('skcode') || '';
let N = +(qs('n') || 250), FQ = qs('fq') || 'bfq';
/* 副图指标：**一组**（最多 4 个），URL 里是 `sub=macd,kdj`。
   ★ 老链接 `sub=macd` 照旧能用（单个就是一个元素的组）。
   🔴 "一个都不要"写成 `sub=0` 而不是 `sub=` —— `nav()` 对空值是
     **删掉这个参数**，于是下次打开又回到默认的 MACD，表现是
     "关不掉的副图"，而它不报错。 */
const KMAX = 4;
/* 🔴 副图是**槽位**（一个位置放一个指标），不是"勾中的一堆指标"。
   用户 2026-09-15："在下面默认两个副图的位置，然后可以点击增加副图增加。
   副图左上角是一个下拉框，可以选择显示什么指标。"
   —— 这正是行情软件的形态：默认副图1=成交量、副图2=MACD。
   ★ 所以**成交量不再是画死的一块**，它就是第一个槽位的默认值。 */
const KDEFAULT = ['vol', 'macd'];
let KINDS = kindsFromUrl();
/* 指标参数（KDJ 看几日之类）。**存 localStorage、不进 URL**：它是
   "我习惯看几日"的个人设置（同实盘页那个区间选择），而 URL 是拿去
   分享/加书签的，塞一段 JSON 进去只会让链接没法看。 */
let KP = kpLoad();
/* 参数弹窗开着没开着。★ 参数**不在图旁边改** —— 用户 2026-09-15：
   "修改指标的参数应该在单独的地方（至少是一个单独的弹窗，不然每次点击
   导致页面高度、宽度变化，会影响整个页面的布局）"。弹窗是 fixed 的，
   开关它一个像素的布局都不动。 */
let KMODAL = false;
/* 🔴 有哪些指标、各画哪几条线、什么颜色 —— **服务端给**
   （/api/indicators/defs，正本在 assay/indicators.py）。页面硬编码一份的话，
   加一个指标要改两处，而漏改那处的表现是**新指标在页面上根本不出现**：
   不报错，只是没人知道它存在（同「可选基准由服务端给」那条）。 */
/* 主图最多叠几个。
   ★ 定义放这儿是因为 `mainFromUrl()` 在文件很靠前的地方就被调用
     （放后面是 TDZ，踩过一次）。
   🔴 写成 `let` 是为了**可测**：本地主图指标统共两个（均线 / BOLL），
     凑不出 3 个，上限那条判据在真实数据上是**空转**的。selftest 把它临时
     压到 1 再验（同指标广场把每页个数做成 `?per=` 的理由：
     **真实数据触发不到的上限，判据必须能构造出来**）。 */
let KMAIN_MAX = 3;
let KDEFS = null, KPANELS = [];
/* 🔴 **并发保护**：`load()` 与 `reloadInd()` 都是 async，而工具条上
   「区间 / 复权 / 指标」几个按钮挨在一起 —— 连点两下就有两次渲染在飞。
   回来晚的那次会往**已经被换掉**的节点上写，浏览器抛
   `The node to be removed is no longer a child of this node`，
   而它**只在控制台里报**：页面看着像渲染了一半（同 live-perf.js 那条
   "异步回调在人已经走开之后往 null 写"）。
   做法与那条一致：发号，回来晚了就**安静放弃这一次**。
   🔴 **两个号各管各的**：`reloadInd` 只重画图、不重建 `#body`，让它去把
     飞行中的 `load()` 作废的话，首屏就停在"加载中…"再也不动了（实测：
     页面加载时 load 在飞，用例一点下拉框就把它废了，40 秒超时）。
     所以 `reloadInd` 记下**开始时那一代** `KSEQ`，回来后只在"`load` 期间
     重建过 `#body`"时才放弃。 */
let KSEQ = 0, KISEQ = 0;

/* 对数坐标：线性轴上「涨 1 块」在 10 元和 100 元处占同样高度，于是长
   区间里低价那一段的波动被压平 —— 翻倍的行情看着像条平线。默认关
   （对着券商软件看的是线性），存进 URL 所以能加书签。 */
let KLOG = qs('log') === '1';
/* 主图指标（均线 / 布林带）与副图指标分两组 —— 用户 2026-09-15：
   "指标也要分类，主图指标、副图指标"。它们**本来就是两回事**：
   主图那几条与 K 线共用一套价格坐标，副图各自一套坐标。
   ★ 默认只开均线。BOLL 默认关：主图已经有 4 条均线，而 BOLL 中轨就是
     MA20（同一条线画两遍），上下轨又与 MA5 撞色 —— 表现正是
     "5 日线看着有两条、两条都不对"。
   ★ 老链接 `boll=1` 照旧认（它曾经是工具条上一个独立开关）。 */
let KMAIN = mainFromUrl();

let BARS = null, IND = null, EVS = null, HOVER = null, SHOWEV = true;
/* K 线左右移动：往回翻几根（0 = 最新）。**按根数不按日期** ——
   按日期翻要前端自己算交易日，而前端没有交易日历（本项目为此栽过：
   硬编码判据误报了一整页假告警）。服务端一句 OFFSET 就够。 */
let KOFF = 0, KTOTAL = 0;
/* 我在这只票上的成交（跨账户）。**画成 B/S 标记 + hover 时列出那天的明细** ——
   与实盘浮层同一个接口、同一种画法（`drawKChart` 的 `trades`）。 */
let TRADES = [];
/* 框选出来的区间（**索引**，不是像素）：重画之后要落在同样那几天上。 */
let KSEL = null;
/* 画布几何（`drawKChart` 的返回）。**模块级** —— `renderSel()` 在
   `wire()` 外面，用它那个局部 `geo` 会 ReferenceError（只在控制台里报，
   页面看着正常，靠 pageerror 才抓到）。 */
let KGEO = null;
const RANGES = [[60,'3月'],[120,'半年'],[250,'1年'],[500,'2年'],[1200,'5年']];

pageHead('stock', '📈 个股');
$('#pg').innerHTML = `<div class="lvhead">
    <div id="sbox" style="flex:0 0 320px"></div>
    <span style="flex:1"></span>
    <a class="lvtag" id="cmp" href="/compare.html"
       title="2~6 只叠加后复权涨幅曲线">⚖ 拉去对比</a>
    <a class="lvtag" href="/watchlist.html">⭐ 自选</a>
  </div><div id="body"></div>`;
/* 🔴 **对比入口要带上当前这只票**（2026-09-14）。对比已经从顶栏收进个股页，
   而"对比"这件事天然是"拿【这只】和别的比" —— 链到裸的 /compare.html
   等于到了那边还要把刚才看的票再搜一遍，那是把入口做成了摆设。
   ★ 没选票时（刚进页面）就保持裸链接：那时确实还没有"这一只"。 */
if (CODE) {
  const c = $('#cmp');
  c.href = '/compare.html?codes=' + encodeURIComponent(CODE);
  c.title = '把 ' + CODE + ' 拉去和别的票叠加对比（2~6 只，后复权）';
}
mountSearch($('#sbox'), {onPick: r => { location.href = stockHref(r.code); }});
if (CODE) load(); else $('#body').innerHTML =
  '<div class="none">搜代码或名称开始 —— 支持 601857 / 601857.SH / sh601857 / 中国石油</div>';


async function load() {
  const seq = ++KSEQ;
  const b = $('#body');
  /* 🔴🔴 **已经有内容时不要清空**。原来一进来就把 `#body` 换成「加载中…」
     —— 高度**先塌陷再撑开**，那就是用户说的"跳动一下"（实盘页早就为这条
     改过：`loadLive` 的 `livePatch`，CLAUDE.md 里记着"刷新只换数字，
     不许重建 DOM"）。而「区间 / 复权」这几个按钮就挨着副图的下拉框，
     点它们同样会整页塌陷一次。
     ★ 顺带修掉一个只在控制台里报的错：清空时那个 `<select>` 可能正聚焦，
       把它从文档里摘掉会触发 blur，浏览器抛
       `The node to be removed is no longer a child of this node.
        Perhaps it was moved in a 'blur' event handler?`
       —— 页面看着像渲染了一半。
     ★ 首屏（还没有画布）仍然给「加载中…」：那时下面是空的，
       不说一句的话看着像页面坏了。 */
  const first = !b.querySelector('#kcv');
  if (first) {
    b.innerHTML = '<div class="lvwhy" style="padding:20px">加载中…</div>';
  } else {
    /* 不清内容，只在那一行常驻的提示位上说一句 —— 它本来就在工具条下面，
       写字不会改变任何元素的高度。 */
    const m = $('#kimsg');
    if (m) m.innerHTML = '　<span class="lvwhy">更新中…</span>';
  }
  const one = u => j(u).catch(e => ({error: String(e)}));
  /* 指标清单取一次就够（它在进程内不变）——每次进页面重取是同一份数据取 N 遍。
     ★ 取不到不能让整页打不开：退回空清单，那时工具条上没有指标可选，
       但 K 线照画（同「外部挂了退回本地那份」那条）。 */
  if (!KDEFS) KDEFS = await j('/api/indicators/defs')
    .catch(() => ({inds: [], signals: []}));
  const [p, k, ind, f, ev, pe, sc, lk, tr] = await Promise.all([
    one('/api/stock/profile?code=' + encodeURIComponent(CODE)),
    one(`/api/stock/kline?n=${N}&fq=${FQ}&off=${KOFF}&code=` + encodeURIComponent(CODE)),
    /* 🔴 副图也要带 `off` —— 不带的话翻页之后 MACD/KDJ 画的还是最新那一段，
       两张图**上下对不上**，而它不报错，看着像"指标和 K 线不同步"。 */
    kIndsParam()
      ? one(`/api/stock/indicators?n=${N}&fq=${FQ}&off=${KOFF}`
            + `&inds=${encodeURIComponent(kIndsParam())}&code=`
            + encodeURIComponent(CODE))
      : Promise.resolve({rows: [], panels: []}),
    one('/api/stock/finance?n=12&code=' + encodeURIComponent(CODE)),
    one('/api/stock/events?code=' + encodeURIComponent(CODE)),
    one('/api/stock/peers?n=12&code=' + encodeURIComponent(CODE)),
    one('/api/stock/sectors?code=' + encodeURIComponent(CODE)),
    one('/api/stock/links?code=' + encodeURIComponent(CODE)),
    /* ★ 取不到（没开实盘 / 没这只票）就是空数组，不该让整页打不开 */
    one('/api/live/trades_of?code=' + encodeURIComponent(CODE))
      .catch(() => ({trades: []})),
  ]);
  if (p.error) { b.innerHTML = '<div class="lvmsg bad">' + esc(p.error) + '</div>'; return; }
  CODE = p.jq_code; localStorage.setItem('skcode', CODE);
  BARS = k.error ? null : k.bars;
  TRADES = ((tr || {}).trades) || [];
  /* 翻页用：总根数（还能不能往左翻）+ 服务端实际落到的 off（钳过的） */
  if (!k.error) { KTOTAL = k.total || 0; KOFF = k.off || 0; }
  if (seq !== KSEQ) return;      /* 有更新的一次在飞，这一份已经作废 */
  IND = (ind && !ind.error) ? ind.rows : null;
  KPANELS = (ind && !ind.error) ? (ind.panels || []) : [];
  /* 🔴 首屏这一份也要**进缓存** —— 它不经过 `reloadInd`，不存的话
     "第一次切换"必然 miss，于是每次打开页面的头一回切换都要等一个请求
     （实测 59ms，而之后是 8ms）。同「签名从 DOM 读」那条的教训：
     首屏那条路和交互那条路要在同一个状态上会合。 */
  KIND_CACHE = IND ? {key: kIndKey(), rows: IND, panels: KPANELS} : {key: null};
  EVS = (ev && !ev.error) ? ev.events : [];
  /* 🔴 整块替换之前先**主动 blur**：`#body` 里那个副图下拉框可能正聚焦
     （换完指标接着点「后复权」就是这个序列），把聚焦元素从文档里摘掉会
     触发 blur，浏览器直接让这次赋值**失败**：
     `Failed to set the 'innerHTML' property … Perhaps it was moved in a
      'blur' event handler?` —— 而它只在控制台里报，页面停在旧内容上。 */
  try { if (b.contains(document.activeElement)) document.activeElement.blur(); }
  catch (e) { /* 某些环境下 activeElement 可能为 null */ }
  b.innerHTML = head(p, lk) + kpiBox(p) + chartBox(k, ind)
    + linkBox(lk) + sectorBox(sc, pe) + tables(p, f, ev);
  wire();
}

function head(p, lk) {
  const [bt, bc] = boardTag(p.jq_code);
  const starred = !!(lk && lk.watch);
  return `<div class="lvhead" style="margin-top:6px">
    ${starHtml(p.jq_code, starred)}
    <h2 style="font-size:20px">${esc(p.sec_name || p.jq_code)}</h2>
    <span class="lvtag">${esc(p.jq_code)}</span>
    ${p.asset_kind
      /* 🔴 **一眼看得出这不是股票**：这一页所有数字（涨跌、区间涨幅、指标）
         长得和股票一模一样，而 ETF 与指数在口径上差着一截（指数没有成交
         对手、ETF 有折溢价与管理费损耗）。不标的话，把指数当股票读只是
         时间问题（同模拟盘那个紫色「模拟盘」标签的理由）。 */
      ? `<span class="lvtag on">${p.asset_kind === 'etf' ? 'ETF' : '指数'}</span>`
      : `<span class="lvtag" style="color:${bc};border-color:${bc}">${bt}</span>`}
    ${p.is_st ? '<span class="stale">ST</span>' : ''}
    ${p.public_status && p.public_status !== '正常上市'
      ? `<span class="stale">${esc(p.public_status)}</span>` : ''}
    ${p.sw_l1_name ? `<span class="lvtag">${esc(p.sw_l1_name)}</span>` : ''}
    ${(p.indexes || []).map(x => `<span class="lvtag on">${esc(x)}</span>`).join('')}
    <span style="flex:1"></span>
    <span style="font-family:'SF Mono',Menlo,monospace;font-size:22px;
      color:${upc(p.change_pct)}">${p.close_bfq == null ? '—' : (+p.close_bfq).toFixed(2)}</span>
    <span style="color:${upc(p.change_pct)};font-size:13px">${pctv(p.change_pct)}</span>
    <span class="lvtag">数据日 ${esc(String(p.date).slice(0, 10))}</span>
  </div>`;
}

function kpiBox(p) {
  const lim = (p.limit_up != null && p.limit_down != null)
    ? (+p.limit_up).toFixed(2) + ' / ' + (+p.limit_down).toFixed(2) : '—';
  return `<div class="kpi">
    ${cell('今开 / 昨收',
      (p.open == null ? '—' : (+p.open).toFixed(2)) + ' / ' + (p.preclose == null ? '—' : (+p.preclose).toFixed(2)),
      p.is_limit_up ? '<b style="color:var(--up)">涨停</b>'
        : (p.is_limit_down ? '<b style="color:var(--down)">跌停</b>' : ''))}
    ${cell('最高 / 最低',
      (p.high == null ? '—' : (+p.high).toFixed(2)) + ' / ' + (p.low == null ? '—' : (+p.low).toFixed(2)),
      '振幅 ' + pctn(p.amplitude))}
    ${cell('涨停 / 跌停', lim, p.limit_pct != null ? '限幅 ' + pctn(p.limit_pct, 0) : '')}
    ${cell('成交额', yiv(p.amount), '换手 ' + pctn(p.turnover) + ' · 量 ' + yiv(p.volume_shares) + '股')}
    ${cell('流通 / 总市值', yiv(p.floatmv) + ' / ' + yiv(p.totalmv), '')}
  </div>
  <div class="kpi">
    ${cell('PE(TTM)', fmtN(p.pe_ttm), 'PEG ' + fmtN(p.peg))}
    ${cell('PB', fmtN(p.pb), 'PS ' + fmtN(p.ps_ttm))}
    ${cell('ROE(TTM)', ratv(p.roe_ttm), '单季 ' + ratv(p.roe_q))}
    ${cell('营收同比', ratv(p.rev_yoy), '单季 ' + ratv(p.rev_q_yoy))}
    ${cell('净利同比', ratv(p.np_yoy), '单季 ' + ratv(p.np_q_yoy))}
    ${cell('52 周区间',
      (p.low_52w == null ? '—' : (+p.low_52w).toFixed(2)) + ' ~ ' + (p.high_52w == null ? '—' : (+p.high_52w).toFixed(2)),
      '不复权价')}
    ${cell('区间涨幅',
      `<span style="color:${upc(p.ret_20d)}">${ratv(p.ret_20d)}</span>`,
      '20日 · 5日 ' + ratv(p.ret_5d) + ' · 60日 ' + ratv(p.ret_60d)
      + ' · 250日 ' + ratv(p.ret_250d)
      + '　<span title="跨除权日不复权会出现假跌幅，所以区间涨幅一律用后复权算">（后复权）</span>')}
    ${cell('上市', p.listed_days == null ? '—' : p.listed_days + ' 天',
      p.list_date ? String(p.list_date).slice(0, 10) : '')}
  </div>`;
}

function chartBox(k, ind) {
  if (k.error) return '<div class="lvmsg bad">K 线：' + esc(k.error) + '</div>';
  const ie = ind && ind.error;
  /* 🔴 「到头了」必须**看得出来**：往左翻到底、或已经在最新那一页时，
       按钮加 `.off` 变灰并把原因写进 title —— 点了没反应是最难查的那种坏
       （同 backLink 那条）。★ 但**不设 disabled**：那种元素连 title 都
       不触发，人连"为什么点不动"都看不到（本项目明令：按钮一律不 disabled）。 */
  const atNew = KOFF <= 0, atOld = KTOTAL && (KOFF + N >= KTOTAL);
  return `<div class="lvsec" style="margin-bottom:14px"><h3>日 K
      <a href="#" class="lvtag kpan${atOld ? ' off' : ''}" data-pan="-1"
        title="${atOld ? '已经到最早的一根了' : '往前看半屏（' + Math.ceil(N / 2) + ' 根）'}">‹ 早</a>
      <a href="#" class="lvtag kpan${atNew ? ' off' : ''}" data-pan="1"
        title="${atNew ? '已经是最新的一页' : '往后看半屏'}">晚 ›</a>
      <a href="#" class="lvtag kpan${atNew ? ' off' : ''}" data-pan="0"
        title="回到最新">最新</a>
      <span class="lvwhy">|</span>
      <span style="flex:1"></span>
      ${RANGES.map(([n, t]) => `<a href="#" class="lvtag rg${N === n ? ' on' : ''}" data-n="${n}">${t}</a>`).join('')}
      <span class="lvwhy">|</span>
      <a href="#" class="lvtag fq${FQ === 'bfq' ? ' on' : ''}" data-f="bfq"
        title="券商软件看到的价；open 就是当日集合竞价成交价">不复权</a>
      <a href="#" class="lvtag fq${FQ === 'hfq' ? ' on' : ''}" data-f="hfq"
        title="跨除权日比较涨幅必须用它 —— 不复权在除权日会有假跌幅">后复权</a>
      <span class="lvwhy">|</span>
      <span id="kpickbox">${kPickHtml() + kMainHtml()}</span>
      <span class="lvwhy">|</span>
      <a href="#" class="lvtag${KLOG ? ' on' : ''}" id="klogt"
        title="对数坐标：等百分比涨幅 = 等高度。&#10;看几年的走势用它才可比 —— 线性轴会把低价那一段的波动压平">对数</a>
      <label class="lvwhy" style="flex:0 0 auto"><input type="checkbox" id="evck" ${SHOWEV ? 'checked' : ''}> 事件</label>
    </h3>
    <div class="cvbox" id="cbox">
      <!-- ★ 画布跟着副图个数长高（每个 110px），不是把它们挤进同一个高度里 ——
           4 个指标压在 500px 里每个只剩 50px，那种图看不出形态。 -->
      <canvas id="kcv" style="width:100%;height:${KINDS.length ? 390 + 110 * KINDS.length : 420}px;display:block;cursor:crosshair"></canvas>
      <div class="cvtip" id="ktip"></div>

/* ---- 交互 ---- */
function mainFromUrl() {
  const raw = qs('main');
  if (raw === null) return qs('boll') === '1' ? ['ma', 'boll'] : ['ma'];
  if (raw === '0') return [];
  /* 🔴 URL 这条路也要**截到上限**：手写 `main=a,b,c,d` 会绕过按钮那道，
     而绕过之后 K 线上十来条线全糊在一起，且不报错（同 `sub=` 那条）。 */
  return raw.split(',').map(x => x.trim()).filter(Boolean).slice(0, KMAIN_MAX);
}
function kindsFromUrl() {
  const raw = qs('sub');
  if (raw === null) return KDEFAULT.slice();   /* 没写 = 成交量 + MACD */
  if (raw === '0') return [];             /* 显式的"一个都不要" */
  return raw.split(',').map(x => x.trim()).filter(Boolean).slice(0, KMAX);
}
function kpLoad() {
  try { return JSON.parse(localStorage.getItem('kindp') || '{}'); }
  catch (e) { return {}; }
}
function kpSave() {
  try { localStorage.setItem('kindp', JSON.stringify(KP)); } catch (e) {}
}
function kDef(id) { return ((KDEFS || {}).inds || []).find(x => x.id === id) || null; }
/* 要问服务端算哪些：副图那几个 + 主图那几个（均线除外 —— 它是 kline 一起
   带回来的）。一个都不要时**整个请求都不发**：空结果也要花一次往返，
   而这一页本来就并发拉着十个接口。 */
/* ★ 成交量**不进这个清单**：那一块画的是 bars 自带的 volume，
   不用服务端再算一遍（同一份数据取两遍）。 */
/* 🔴🔴 **一次把所有指标都取回来**，不是只取当前选中的那几个。
   用户 2026-09-16（第三次反馈）："切换附图时还是会明显感觉跳动一下。"
   逐帧量过：DOM 一个元素都没动、整页 242 帧位置零变化、屏幕帧的像素差
   也只落在副图那一块 —— **布局层面确实没有跳动**。剩下的就是那几百毫秒：
   点完下拉框，旧图还杵在那儿，等接口回来才"啪"地换成新图。
   那个突变就是"跳动一下"的来源。

   实测一次取全部 10 个副图 + 主图共 **47.6 KB / 29ms**，而只取 2 个是
   13.4 KB / 28ms —— **几乎一样快**（开销在建面板，不在算哪几个指标）。
   所以一次全取、缓存住，切换时**零请求、零延迟**，图当场就换。
   ★ 这与指标广场那条「分页只取当前页」**不冲突**：那边是上百个指标的
     场景，这边副图统共十来个。判据不同是因为量级不同。 */
function kWant() {
  const all = ((KDEFS || {}).inds || []).map(x => x.id)
    .filter(x => x !== 'ma');          /* ma 跟着 kline 一起回来，不用算 */
  /* KDEFS 还没到（首屏那一次）时退回"只要当前用着的"——它至少画得出来。 */
  return all.length ? all
    : KINDS.concat(KMAIN.filter(x => x !== 'ma'))
        .filter((x, i, a) => a.indexOf(x) === i);
}
function kIndsParam() {
  const ids = kWant();
  if (!ids.length) return '';
  const custom = ids.some(id => KP[id] && Object.keys(KP[id]).length);
  return custom ? JSON.stringify(ids.map(id => ({id: id, params: KP[id] || {}})))
                : ids.join(',');
}
/* 给 drawKChart 的副图数组。**画什么由服务端那份 panels 决定**，
   页面只负责把同一份 rows 递进去（它们是同一条时间轴）。 */
/* 给 drawKChart 的副图数组：**按槽位顺序**（KINDS），不是按服务端返回的
   顺序 —— 人把第 2 个副图换成 KDJ，它就该出现在第 2 个位置。
   ★ `reserve` 是左上角留给下拉框的宽度（下拉框浮在画布上）。 */
const KSEL_W = 96;
function kSubs() {
  if (!IND || !KPANELS.length) return [];
  const by = {};
  KPANELS.forEach(x => { if (x.panel === 'sub') by[x.id] = x; });
  return KINDS.map(id => by[id]).filter(Boolean).map(x => ({
    id: x.id, label: x.short || x.label, unit: x.unit,
    reserve: KSEL_W + 30, rows: IND, series: x.series}));
}
function nav(over) {
  const u = new URL(location.href);
  u.searchParams.set('code', CODE);
  Object.entries(over || {}).forEach(([k, v]) => {
    if (v === '' || v == null) u.searchParams.delete(k); else u.searchParams.set(k, v);
  });
  history.replaceState(null, '', u);
}
function wire() {
  wireStarsAll();
  /* ★ geo（画布几何，命中测试用）在这里声明：几个 handler 都要更新它，
     放到函数末尾声明的话，上面那些 handler 只能靠"点击总发生在 wire()
     跑完之后"这个隐含前提 —— 那种依赖坏起来是静默的。 */
  let geo = null;
  /* ★ 这些是 <a href="#">，必须 preventDefault —— 不拦的话会把 hash 改成 '#'，
     在独立页面上表现为滚到顶部 + URL 变脏。 */
  $$('#body .rg').forEach(e => e.onclick = ev => {
    ev.preventDefault(); N = +e.dataset.n; nav({n: N}); load(); });
  $$('#body .fq').forEach(e => e.onclick = ev => {
    ev.preventDefault(); FQ = e.dataset.f; nav({fq: FQ}); load(); });
  /* 🔴 **事件委托绑在容器上**：选择器那一截会被 `reloadInd()` 用 innerHTML
     整块换掉，逐个绑的话换完那些元素永远没有 handler ——
     点了没反应且不报错（对比页「移除」栽过）。 */
  /* 🔴 **事件委托绑在容器上**：这几处的内容都会被 `reloadInd()` 用
     innerHTML 整块换掉，逐个绑的话换完那些元素永远没有 handler ——
     点了没反应且不报错（对比页「移除」栽过）。 */
  const pbox = $('#kpickbox');
  if (pbox) pbox.onclick = async ev => {
    const a = ev.target.closest('a');
    if (!a) return;
    ev.preventDefault();
    if (a.id === 'kparam') { kModal(true); return; }
    /* 「+ 主图」：到上限就**说清怎么腾位置**，不许静默不动。 */
    if (a.id === 'kmadd') {
      const on = KMAIN.filter(id => kDef(id) && kDef(id).panel === 'main');
      const pk = $('#kmpick');
      if (on.length >= KMAIN_MAX) {
        if (pk) pk.innerHTML = `　<b>主图最多叠 ${KMAIN_MAX} 个</b>，`
          + '先点某个主图 chip 右上角的 × 去掉一个再叠（副图那几个不占名额）';
        return;
      }
      if (pk) pk.innerHTML = pk.innerHTML ? '' : kMainPickHtml();
      return;
    }
    if (a.classList.contains('kmpicka')) {      /* 从清单里挑一个叠上去 */
      kToggleMain(a.dataset.i);
      await reloadInd();
      return;
    }
    if (a.classList.contains('kmainx')) {       /* chip 右上角的 × */
      kToggleMain(a.dataset.x);
      await reloadInd();
      return;
    }
    if (a.classList.contains('kmain')) {        /* 点 chip 本身 = 也是取消 */
      kToggleMain(a.dataset.i);
      await reloadInd();
    }
  };
  const arow = $('#kaddrow');
  if (arow) arow.onclick = async ev => {
    const a = ev.target.closest('a');
    if (!a || a.id !== 'kadd') return;
    ev.preventDefault();
    if (!kSlotAdd()) {
      /* 🔴 到上限时**说出来**，不要静默不动（同 backLink 那条）。

      const m = $('#kimsg');

  /* 副图左上角那组控件（下拉框 + ⚙ + ×）—— 它们浮在画布上。 */
  const sbox = $('#kslots');
  if (sbox) {
    sbox.onchange = async ev => {

    };
    sbox.onclick = async ev => {
      const a = ev.target.closest('a');

  /* 参数弹窗。★ 它是 **fixed 浮层**：开关它一个像素的布局都不动
     （用户原话："每次点击导致页面高度、宽度变化，会影响整个页面的布局"）。 */
  /* Esc 关掉 —— 项目里所有浮层都是这个约定 */
  if (!wire._esc) {
    wire._esc = true;
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && KMODAL) kModal(false);
    });
  }
  const mbox = $('#kmodal');
  if (mbox) {
    /* 🔴 「正在程序化重置」的门闩。销毁 / blur 一个改过值的 `<input>` 时，
       浏览器会**补发一次 change**（值是那一刻框里的），于是「恢复默认参数」
       刚把 `KP` 删空，这一发 change 又按框里的旧值写了回去 ——
       按钮点了看着没反应，而控制台一个字都不报。
       实测日志：`RST after KP={}` → 1.6 秒后 KP 又是 `{kdj:{n:19}}`。
       ★ 门闩表达的正是"这一次是程序在重置，不是人在输入"。 */
    let krst = false;
    mbox.onclick = async ev => {
      const a = ev.target.closest('a');
      if (a && a.id === 'kmore') return;      /* 去指标广场：真跳走 */
      if (a) ev.preventDefault();
      if (a && a.id === 'kmclose') { kModal(false); return; }
      if (a && a.id === 'kprst') {
        krst = true;
        try {
        KMAIN.concat(KINDS).forEach(id => delete KP[id]);
        kpSave(); await reloadInd();
        /* 🔴 这一处**必须显式重渲染弹窗**：`kApplyInd` 会跳过"焦点在弹窗
           里"的那次（防止改参数时把正在编辑的输入框换掉），而点这个按钮
           时焦点正落在它自己身上 —— 不补这一下的话框里还是旧数字，
           看着就是"点了没反应"。
           ★ 重渲染前先把焦点挪开：销毁聚焦元素会让 innerHTML 赋值直接
             失败（`Perhaps it was moved in a 'blur' event handler?`）。 */
        try { if (mbox.contains(document.activeElement)) document.activeElement.blur(); }
        catch (e2) { /* activeElement 可能为 null */ }
        kModal(true);
        } finally { krst = false; }
        return;
      }
      /* 点遮罩关掉（点框里不关）—— 同浮层那套 */
      if (ev.target.id === 'kmwrap') kModal(false);
    };
    mbox.onchange = async ev => {
      const e = ev.target;
      if (!e.classList || !e.classList.contains('kpi')) return;
      /* 🔴 **已经脱离文档的输入框补发的 change 一律忽略。**
         重渲染弹窗时会销毁正聚焦的那个 `<input>`，浏览器为它**补发一次
         change**（值是销毁那一刻的）—— 于是「恢复默认参数」刚把 `KP`
         删空，这一发 change 又按框里的旧值把它写了回去：
         按钮点了看着没反应，而控制台一个字都不报。
         实测日志：`RST after KP={}` → 1.6 秒后 KP 又是 `{kdj:{n:19}}`。 */
      if (!e.isConnected || krst) return;
      const id = e.dataset.id, k = e.dataset.k, v = parseInt(e.value, 10);
      const d = kDef(id), a2 = d && d.params.find(x => x.key === k);
      /* 🔴 越界**当场拒**并说清范围 —— 让它发到服务端只会换来一句报错，
         而输入框里还留着那个非法值。 */
      if (!a2 || !(v >= a2.min && v <= a2.max)) {
        /* ★ 提示放在**弹窗里**（就在那个输入框旁边）—— 扔到图下面那行去的话，

        const m = $('#kmmsg');
        if (m) {
          m.className = 'lvmsg bad';
          m.textContent = (a2 ? a2.label : k) + ' 要在 '
            + (a2 ? a2.min : '?') + '~' + (a2 ? a2.max : '?') + ' 之间';
        }
        e.value = (KP[id] || {})[k] != null ? KP[id][k] : (a2 ? a2.default : '');

      }
      /* 🔴🔴 **值没变就什么都不做。** 浏览器在输入框失焦 / 被销毁时会

         变了）。于是点「恢复默认参数」的那一下：先 blur 补发一发 change
         把旧值又写进 `KP`，**然后**才轮到 click handler 去删它 ——
         顺序反着，按钮点了看着没反应，而控制台一个字都不报。
         实测日志：`KPWRITE t=5776 v=19` 出现在 `RST START` **之前**。
         ★ 所以门闩（krst）拦不住它 —— 那一发在 handler 之外。
           幂等守卫才是对的：这一发的值与 `KP` 里已有的完全相同。 */
      const _cur = (KP[id] || {})[k];
      if (v === a2.default ? _cur == null : _cur === v) return;
      const _ok = $('#kmmsg');
      if (_ok) { _ok.className = 'lvmsg'; _ok.textContent = ''; }
      KP[id] = Object.assign({}, KP[id]); KP[id][k] = v;
      /* 与默认值相同就不存 —— 存了的话弹窗里会一直挂着等于没改的值。 */
      if (v === a2.default) {
        delete KP[id][k];
        if (!Object.keys(KP[id]).length) delete KP[id];
      }
      kpSave(); await reloadInd();
    };
  }
  /* 🔴 「对数」这个 handler 曾被我连着 BOLL 那段一起删掉（改指标选择器时
     整段替换，它恰好夹在中间）—— 按钮还在、**点了没反应**，而这不报错。
     是既有那条「对数状态要进 URL」的断言抓出来的。
     ★ 只**重画**，不重新取数 —— 换的是坐标映射，数据一个字没变。 */
  if ($('#klogt')) $('#klogt').onclick = ev => {
    ev.preventDefault();
    KLOG = !KLOG;
    nav({log: KLOG ? '1' : ''});
    ev.currentTarget.classList.toggle('on', KLOG);
    geo = redraw();
  };
  const ck = $('#evck');
  if (ck) ck.onchange = () => { SHOWEV = ck.checked; geo = redraw(); };
  /* ---- 左右移动 ---- */
  $$('.kpan').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const d = +a.dataset.pan;
    /* 半屏一步：整屏跳的话左右两页**没有重叠**，接不上形态。 */
    const stepN = Math.ceil(N / 2);
    const was = KOFF;
    KOFF = d === 0 ? 0 : Math.max(0, KOFF + (d < 0 ? stepN : -stepN));
    if (KTOTAL) KOFF = Math.min(KOFF, Math.max(0, KTOTAL - N));
    if (KOFF === was) return;           /* 到头了：不白打一次接口 */
    KSEL = null;                        /* 换了时间段，旧选区不再成立 */
    load();
  });
  geo = redraw();
  const cv = $('#kcv');
  if (!cv) return;
  const tip = $('#ktip');
  const hit = ev => {
    if (!geo) return null;
    const r = cv.getBoundingClientRect();
    const i = Math.round((ev.clientX - r.left - geo.PADL) / geo.step - 0.5);
    return (i >= 0 && i < geo.n) ? i : null;
  };
  cv.onmousemove = ev => {
    const i = hit(ev);
    if (i === HOVER && i != null) { posTip(ev); return; }
    HOVER = i; geo = redraw();
    if (i == null) { tip.style.display = 'none'; return; }
    const b = BARS[i], q = IND ? IND[i] : null;
    tip.style.display = 'block';
    /* 🔴 **不重复图上已有的东西**（用户 2026-09-15）：
         · MA 四条：主图左上角的图例本来就带**那一天的值**，跟着光标变
         · DIF/DEA/MACD（及 KDJ/RSI）：改到**副图自己的左上角**，
           那三个数只在副图上有意义，浮窗里再列一遍是同一份信息两处看
       浮窗只留**那根 K 线自己的事实**：OHLC / 涨跌 / 换手 / 量额 /
       事件 / 那天的成交。 */
    const ln = [
      b.date + (b.limit_up ? '  涨停' : '') + (b.limit_down ? '  跌停' : ''),
      '开 ' + b.open + '   高 ' + b.high,
      '低 ' + b.low + '   收 ' + b.close,
      '涨跌 ' + pctv(b.change_pct) + '   换手 ' + pctn(b.turnover),
      '量 ' + yiv(b.volume) + '股  额 ' + yiv(b.amount),
    ];
    /* ★ BOLL 留着：它叠在**主图**上，而主图图例只列 MA 不列上下轨。 */
    if (KMAIN.indexOf('boll') >= 0 && q && q.mb != null)
      ln.push('BOLL ' + q.lb + ' ~ ' + q.ub + '（中轨 ' + q.mb + ' = MA20）');
    const hitEv = (EVS || []).filter(x => x.date === b.date);
    hitEv.forEach(x => ln.push('◆ ' + x.label + ' ' + (x.detail || '').slice(0, 30)));
    /* 🔴 **那天的成交**（用户 2026-09-15："移到买入、卖出那一根时看不到
         买入、卖出的价格数量，需要一个独立的浮窗，多笔就展示多笔"）。
       ★ `.cvtip` 是 `white-space:pre` 的**纯文本**浮窗，所以这里拼文本
         而不是 HTML —— 用 `tradesOfDay` 那个 HTML 版会把标签原样印出来
         （两个浮窗的实现不同，不能照搬）。 */
    (TRADES || []).filter(t => t.date === b.date).forEach((t, k, arr) => {
      if (!k) ln.push('── 我的成交 ' + (arr.length > 1 ? arr.length + ' 笔' : ''));
      ln.push('  ' + (t.side === 'buy' ? '买' : '卖') + ' ' + num(t.shares, 0)
        + ' 股 @ ' + num(t.price, 3)
        + '  = ' + num((+t.shares || 0) * (+t.price || 0), 0)
        + (t.fee == null ? '' : '  费 ' + num(t.fee, 2))
        + (t.account_name ? '  ' + t.account_name : ''));
    });
    tip.textContent = ln.join('\n');
    posTip(ev);
  };
  const posTip = ev => {
    /* 🔴 **按实测尺寸翻转，不要写死 210/170。** 原来那两个数是浮窗当时的
       大致宽高 —— 内容一变（比如加了"我的成交"几行）就不够，
       浮窗右半边被切在容器外面，而**那不报错**，只是读数看不全
       （实测："费 5.8" 被截断）。
       ★ 必须**先量再算**：`offsetWidth` 在 `textContent` 赋值之前是**旧值**，
         用它算翻转会翻错边（`_tipAt` 那次就是这么错的）。调用方已经先填
         内容再调这里，所以这里量到的是新尺寸。 */
    const box = $('#cbox').getBoundingClientRect();
    const tw = tip.offsetWidth || 210, th = tip.offsetHeight || 170;
    let x = ev.clientX - box.left + 12, y = ev.clientY - box.top + 12;
    if (x + tw > box.width) x = ev.clientX - box.left - tw - 12;
    if (y + th > box.height) y = ev.clientY - box.top - th - 12;
    /* 极窄时宁可压着光标也要可见（同 `_tipAt` 的钳制那条） */
    tip.style.left = Math.max(0, Math.min(x, box.width - tw)) + 'px';
    tip.style.top = Math.max(0, Math.min(y, box.height - th)) + 'px';
  };
  /* ---- 框选测算 ----
     🔴 **与十字光标共存**：按下不动只是"准备选"，拖过 4px 才算框选，
       这期间隐藏读数浮层（两个东西同时跟着鼠标会互相打架）。
       松手没拖动 = 普通点击 -> 清掉选区。
     ★ 选区存**索引**不是像素：换副图/换对数/resize 之后重画，
       它必须还落在同样那几天上。 */
  let dragFrom = null, dragging = false;
  cv.onmousedown = ev => {
    if (ev.button !== 0) return;
    dragFrom = hit(ev); dragging = false;
    ev.preventDefault();                /* 不然拖动会选中页面文字 */
  };
  window.addEventListener('mouseup', ev => {
    if (dragFrom == null) return;
    const to = hit(ev);
    if (!dragging) { KSEL = null; renderSel(); geo = redraw(); }
    dragFrom = null; dragging = false;
  });
  const onDrag = ev => {
    if (dragFrom == null) return false;
    const i = hit(ev);
    if (i == null) return true;
    if (!dragging && Math.abs(i - dragFrom) < 1) return true;
    dragging = true;
    KSEL = {i0: dragFrom, i1: i};
    tip.style.display = 'none';
    HOVER = null;
    renderSel(); geo = redraw();
    return true;
  };
  const oldMove = cv.onmousemove;
  cv.onmousemove = ev => { if (onDrag(ev)) return; oldMove(ev); };
  cv.onmouseleave = () => { HOVER = null; tip.style.display = 'none'; geo = redraw(); };
  /* 🔴 resize 之后也要重摆：副图的 y 坐标跟画布高度走，只重画不重摆的话
     下拉框会**留在原来的位置**（浮在别的副图上），而它不报错。 */
  if (!wire._rs) {
    wire._rs = true;
    window.addEventListener('resize', () => { redraw(); kSlotPos(); });
  }
  geo = KGEO = redraw();
  kSlotPos();
}
/* 框选区间的读数。
   🔴 **区间涨跌幅的基点取第一根的【前收】，不是它自己的收盘** ——
     用首日收盘做基点等于把首日那根的涨跌排除在外，而那正是人框进来
     想看的东西（同「基准的基点取第一天的前一交易日收盘」那条，
     本项目实测差过 9.5pp）。
   ★ 前收取不到（面板第一根、或数据缺）时退回"上一根的收盘"，
     再取不到就用当根开盘并**把口径写出来** —— 不静默换一个基准。
   ★ 振幅 = (区间最高 − 区间最低) / 基点，与"单日振幅"同一个形状，
     这样两个数可以直接比。 */
function renderSel() {
  const el = $('#kselpop');
  if (!el) return;
  if (!KSEL || !BARS) { el.style.display = 'none'; return; }
  const a = Math.max(0, Math.min(KSEL.i0, KSEL.i1));
  const b = Math.min(BARS.length - 1, Math.max(KSEL.i0, KSEL.i1));
  const seg = BARS.slice(a, b + 1);
  if (!seg.length) { el.style.display = 'none'; return; }
  let base = seg[0].preclose, how = '首根前收';
  if (base == null && a > 0) { base = BARS[a - 1].close; how = '上一根收盘'; }
  if (base == null) { base = seg[0].open; how = '首根开盘（前收取不到）'; }
  const hi = Math.max(...seg.map(x => x.high).filter(v => v != null));
  const lo = Math.min(...seg.map(x => x.low).filter(v => v != null));
  const last = seg[seg.length - 1].close;
  const ret = (base && last != null) ? (last / base - 1) : null;
  const amp = (base && isFinite(hi) && isFinite(lo)) ? (hi - lo) / base : null;
  const vol = seg.reduce((s, x) => s + (x.volume || 0), 0);
  const amt = seg.reduce((s, x) => s + (x.amount || 0), 0);
  const up = seg.filter(x => x.change_pct > 0).length;
  /* 竖排而不是一长行：浮窗要窄才贴得住选区旁边，而横排到 800px
     又会盖住半张图。★ 区间涨跌放最上面并加大 —— 框选就是为了看它。 */
  el.innerHTML = `<div class="sphi" style="color:${upc(ret)}">${
      ret == null ? '—' : ratv(ret)}</div>`
    + `<div><b>${esc(seg[0].date)}</b> ~ <b>${esc(seg[seg.length-1].date)}</b></div>`
    + `<div>${seg.length} 个交易日 · ${up} 涨 / ${seg.length - up} 跌平</div>`
    + `<div>最高 <b>${isFinite(hi) ? hi : '—'}</b>`
    + `　最低 <b>${isFinite(lo) ? lo : '—'}</b></div>`
    + `<div>振幅 <b>${amp == null ? '—' : (amp * 100).toFixed(2) + '%'}</b>`
    + `　量 ${yiv(vol)} 股</div>`
    + `<div>额 ${yiv(amt)}</div>`
    + `<div class="lvwhy">基点 ${esc(how)} ${base == null ? '—' : base}<br>`
    + `点一下图上任意处取消</div>`;
  el.style.display = 'block';
  /* ---- 贴在**选区外侧** ----
     🔴 不能盖住选区本身 —— 那正是人刚框出来、正在看的东西。
       所以：选区在左半边就贴右侧，在右半边就贴左侧；竖直居中于图。
     ★ 先填内容再量尺寸（offsetWidth 在赋值前是旧值 —— _tipAt 那次
       就是这么翻错边的）。
     ⚠️ 这段注释在模板字符串外面，但上面那条 HTML 注释在**模板里** ——
       那里不许出现反引号（写过一次，当场把模板闭合掉，整个文件
       SyntaxError；同 CLAUDE.md 里 chart.js 那条）。 */
  /* 🔴 `geo` 是 `wire()` 里的**局部变量**，这个函数在它外面 ——
       直接引用会 `ReferenceError: geo is not defined`，而那**只在控制台里报**，
       浮窗照样弹出、只是位置没算（实测就是这么发现的：功能"看着好了"，
       是 pageerror 抓出来的）。
     ★ 用 `KGEO`（模块级，`redraw()` 每次更新）—— 同 `LVSORT` 必须模块级那条。 */
  const box = $('#cbox').getBoundingClientRect();
  /* 🔴 `KGEO.X(i)` 返回的**已经是 CSS 像素** —— `cvPrep` 是按 canvas 的
     实际宽度绘制的，不是固定 viewBox。我一度又乘了一次 `width/1160`，
     算出来的 x 跑到画布外面（实测 1522 > 视口 1440），只是被下面的钳制
     兜住了才"看着正常" —— 那种错最难查：**功能看着是好的**。
     ★ 判据：拿 `KGEO.X(最后一根)` 与画布 CSS 宽度比一比就知道该不该换算。 */
  const x0 = KGEO ? KGEO.X(a) : 0, x1 = KGEO ? KGEO.X(b) : 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = (x0 + x1) / 2 < box.width / 2 ? x1 + 14 : x0 - w - 14;
  x = Math.max(4, Math.min(x, box.width - w - 4));
  el.style.left = x + 'px';
  el.style.top = Math.max(4, Math.min(28, box.height - h - 4)) + 'px';
}

/* ---- 指标选择器 ----
   🔴 走到今天的形态是**两轮用户反馈**换来的：
     一开始：工具条上平铺一排标签（一个指标一个）
       -> "指标数量上去后一横排也放不下"
     第二版：一个按钮 + 竖排勾选面板（参数也在里面）
       -> "点一下就整页刷新"（已改成只重取指标那一个接口）
       -> "改参数会让页面高度、宽度变化，影响整个页面的布局"
     现在：**副图 = 槽位**，每个槽位左上角一个 <select> 浮在画布上；
       工具条上只剩「+ 副图」与「⚙ 参数」，而参数在**弹窗**里改。
   ★ 下拉框浮在画布上（不是画在画布里）：canvas 里画不出可点的控件，
     而"每个副图自己选"要求它就在那个副图的左上角。 */
function kPickHtml() {
  /* 🔴 这里**不放「+ 副图」、也不放提示文字**。
     用户 2026-09-15 反馈："最多 4 个副图 —— 先去掉一个主图，这个没看懂，
     主图的数量和副图的数量会冲突吗？" —— 两者不冲突，是**两段文字挨在
     一起被读成了一句**：提示排在「主图 [均线][布林带]」前面，屏幕上就是
     "…先去掉一个｜主图 均线 布林带"。
     ★ 所以提示要跟着**它说的那个按钮**走（挪到图下面那一行），
       而不是挤在工具条里跟别的标签做邻居。 */
  /* ★ 叫「设置」不叫「参数」：用户 2026-09-16 反馈"现在找不到指标广场的
       入口了……个股页面里加个设置按钮（齿轮），可以在里面进入指标广场"。
     入口一直在这个弹窗里，但它叫「参数」、而广场入口又排在最底下跟
     「恢复默认参数」挤一起 —— **一个叫"参数"的按钮，没人会指望里面有
     "都支持哪些指标"**。现在弹窗第一行就是广场入口。 */
  return `<a href="#" class="lvtag" id="kparam"
      title="指标设置：改参数、看全部指标说明（弹窗，不动布局）">⚙ 设置</a>`;
}

/* 「+ 副图」那一行：**贴在最后一个副图下面**（用户："添加副图的按钮应该
   放在主图的最下面，或者说当前最后一个副图的下面"）—— 那正是你看完最后
   一个副图、想再加一个时手停的位置。
   ★ 放在画布**外面**而不是浮在画布里：画布底部那 18px 是 x 轴的日期，
     浮上去会压住它。 */
function kAddRowHtml() {
  const n = KINDS.length, full = n >= KMAX;
  return `<a href="#" class="lvtag${full ? ' off' : ''}" id="kadd"
      title="${full ? '副图最多 ' + KMAX + ' 个' : '在下面再加一个副图'}"
      >+ 副图</a>
    <span class="lvwhy">副图 ${n}/${KMAX} · 每个副图左上角可以换指标</span>
    <span class="lvwhy" id="kimsg"></span>`;
}

/* 主图那两个（均线 / 布林带）：它们**不是槽位** —— 直接叠在 K 线上，
   而且就这么两个，做成下拉反而绕。 */
/* 🔴🔴 主图叠加也**不能平铺全部、不能无限叠**（2026-09-16 用户："主图选择
   的方式也改一下，如果后续主图的数量增多，都要显示不下了。要限制叠加主图
   的数量，不能无限制叠加"）。这与副图当初那三版演进是**同一个问题**：
   平铺 -> 数量一上去就绕成几排。

   形态取「**已选的 chip（各带一个 ×）+ 一个「+ 主图」挑**」，与实盘业绩页
   的自定义基准同一套（`.chipw/.chipx`，样式也是同一份）——
   ★ 主图与副图形态**刻意不同**：副图是**槽位**（一个位置放一个，有上下
     顺序），主图是**集合**（都叠在同一张 K 线上，没有位置可言）。
     硬把主图也做成槽位的话，"第 2 个主图"这种说法本身就讲不通。
   ★ 上限 `KMAIN_MAX = 3`：均线自己就是 4 条线、BOLL 2 条，叠到第 4 个
     主图时 K 线上已经十来条线，形态全糊了 —— 限制的理由是**看得清**，
     不是"放不下"。 */
function kMainHtml() {
  const mains = ((KDEFS || {}).inds || []).filter(x => x.panel === 'main');
  if (!mains.length) return '';
  const on = KMAIN.filter(id => mains.some(d => d.id === id));
  const full = on.length >= KMAIN_MAX;
  return '<span class="lvwhy">主图</span>'
    + on.map(id => {
        const d = mains.find(x => x.id === id) || {};
        return `<span class="chipw"><a href="#" class="lvtag kmain on"
          data-i="${id}" title="${esc(d.desc || '')}">${esc(d.short || id)}</a>`
          + `<a href="#" class="chipx kmainx" data-x="${id}"
             title="不叠它了">×</a></span>`;
      }).join('')
    + (on.length ? '' : '<span class="lvwhy">（没叠）</span>')
    /* 「+ 主图」：点开列未选的那几个。到上限时**说清怎么腾位置** ——
       静默不给加的话人只会觉得"点了没反应"（同「+ 副图」那条）。 */
    + `<a href="#" class="lvtag${full ? ' off' : ''}" id="kmadd"
         title="${full ? '主图最多叠 ' + KMAIN_MAX + ' 个，先点某个主图 chip 右上角的 × 去掉一个'
                       : '再叠一个指标到 K 线上'}">+ 主图</a>`
    + '<span id="kmpick"></span>';
}

/* 「+ 主图」点开的那份清单：只列**还没叠上去**的。 */
function kMainPickHtml() {
  const mains = ((KDEFS || {}).inds || []).filter(
    x => x.panel === 'main' && KMAIN.indexOf(x.id) < 0);
  if (!mains.length) return '　<span class="lvwhy">主图指标都叠上了</span>';
  return '　' + mains.map(d => `<a href="#" class="lvtag kmpicka"
      data-i="${d.id}" title="${esc(d.desc)}">${esc(d.short)}</a>`).join('');
}

/* 浮在画布上的那一排控件：**一个副图一组**（下拉框 + ⚙ + ×）。
   位置由 `drawKChart` 返回的几何决定（`subY(j)`）—— 画布高度、
   副图个数变了它们自己跟上，不用第二处算一遍。 */
function kSlotHtml() {
  const subs = ((KDEFS || {}).inds || []).filter(x => x.panel === 'sub');
  if (!subs.length) return '';
  return KINDS.map((id, j) => `<div class="kslot" data-j="${j}"
      style="position:absolute;left:0;top:0;display:none;z-index:3">
      <select class="kssel" data-j="${j}" title="这个副图显示什么">
        ${subs.map(d => `<option value="${d.id}"${d.id === id ? ' selected' : ''}
          >${esc(d.short)}</option>`).join('')}
      </select>
      <a href="#" class="ksgear" data-j="${j}" data-i="${id}"
         title="改它的参数">⚙</a>
      <a href="#" class="ksdel" data-j="${j}" title="去掉这个副图">×</a>
    </div>`).join('');
}

/* 把那几组控件摆到各自副图的左上角。**按 `KGEO` 摆**，不自己算坐标 ——
   两处算的话，改一次画布高度就会错位，而那不报错。 */
function kSlotPos() {
  if (!KGEO || !KGEO.subY) return;
  $$('#cbox .kslot').forEach(el => {
    const j = +el.dataset.j;
    if (j >= (KGEO.nSub || 0)) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (KGEO.PADL + 2) + 'px';
    el.style.top = (KGEO.subY(j) + 1) + 'px';
  });
}

/* 主图那两个是**开关**（叠上去 / 不叠）。 */
function kToggleMain(id) {
  const at = KMAIN.indexOf(id);
  if (at >= 0) KMAIN.splice(at, 1);
  else {
    /* 🔴 上限也要在**数据这一层**拦一道：按钮那道在 UI 上拦得住，
       而"URL 里手写 `main=a,b,c,d`"这条路绕过它 —— 而绕过之后 K 线上
       十来条线全糊在一起，且不报错（同自定义基准那两道上限）。 */
    const on = KMAIN.filter(x => kDef(x) && kDef(x).panel === 'main');
    if (on.length >= KMAIN_MAX) return false;
    KMAIN.push(id);
  }
  /* 🔴 `main=` 空值会被 nav() 删掉参数、下次打开又回到默认，
     所以"一个都不要"写成 '0'（同 sub 那条）。 */
  nav({main: KMAIN.join(',') || '0', boll: ''});
  return true;
}

/* 副图是**槽位**：加一个 / 去掉第 j 个 / 把第 j 个换成别的指标。 */
function kSlotAdd() {
  if (KINDS.length >= KMAX) return false;
  const subs = ((KDEFS || {}).inds || []).filter(x => x.panel === 'sub');
  /* ★ 新槽位默认放**还没用上的**第一个 —— 再来一个一模一样的没有意义。 */
  const pick = (subs.find(d => KINDS.indexOf(d.id) < 0) || subs[0] || {}).id;
  if (!pick) return false;
  KINDS.push(pick);
  nav({sub: KINDS.join(',')});
  return true;
}
function kSlotDel(j) {
  KINDS.splice(j, 1);
  nav({sub: KINDS.join(',') || '0'});
}
function kSlotSet(j, id) {
  KINDS[j] = id;
  nav({sub: KINDS.join(',')});
}

/* 参数弹窗：**fixed 浮层**，开关它一个像素的布局都不动。
   ★ 只列**当前用着的**指标（主图那两个 + 各槽位）——把 12 个指标的参数
     全摆出来，要改的那个反而找不着。 */
function kModalHtml() {
  const used = KMAIN.concat(KINDS).filter((x, i, a) => a.indexOf(x) === i);
  const rows = used.map(id => {
    const d = kDef(id);
    if (!d) return '';
    const p = KP[id] || {};
    return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;
         padding:6px 0;border-top:1px solid var(--line)">
      <b style="min-width:70px">${esc(d.short)}</b>
      <span class="lvwhy" style="flex:1;min-width:200px">${esc(d.desc)}</span>
      ${d.params.length ? d.params.map(a => `<label class="lvwhy">${esc(a.label)}
          <input class="kpi" data-id="${id}" data-k="${a.key}" type="number"
            min="${a.min}" max="${a.max}" style="width:56px"
            value="${p[a.key] != null ? p[a.key] : a.default}"></label>`).join('')
        : '<span class="lvwhy">（没有可配的参数）</span>'}
    </div>`;
  }).join('');
  /* 🔴 `.stmodal` **没有 `display:none` 这条规则** —— 项目里的约定是
     "开着时才给它这个类、关掉就把内容清空"（见 views/app.js 的 modal()）。
     照搬 `.on` 那套的话，遮罩会**常驻在页面上**：整页发暗且点不动，
     而它不报错（第一版就是这么挂的，截图上一眼看出来）。 */
  return `<div id="kmwrap" class="stmodal">
    <div class="stbox" style="max-width:720px">
      <h3>⚙ 指标设置
        <span style="flex:1"></span>
        <a href="#" class="lvtag" id="kmclose">关闭</a></h3>
      <!-- 🔴 指标广场的入口放**第一行**，不排在底部跟「恢复默认参数」挤
           一起：用户找不到它（"现在找不到指标广场的入口了"）。
           这一格回答的是"都支持哪些指标"，而下面那些只回答"这几个怎么调"
           —— 前者是进来之前就想问的。 -->
      <div class="lvform" style="margin:2px 0 10px;gap:8px;align-items:center">
        <a class="lvtag on" id="kmore" href="/indicators.html?code=${encodeURIComponent(CODE)}"
           title="指标广场：都支持什么、怎么算的、能用在哪">📊 指标广场 ↗</a>
        <span class="lvwhy">看全部指标：怎么算的、长什么样、能不能拿来当买点</span>
      </div>
      <h4 style="margin:0 0 4px">参数
        <span class="lvwhy">改完立刻生效 · 存在本机、不进 URL</span></h4>
      <div class="lvwhy">这里只列<b>当前用着的</b>指标。参数是"我习惯看几日"
        的个人设置，所以存 localStorage 而不进 URL（URL 是拿去分享的）。</div>
      ${rows || '<div class="none">当前用着的指标都没有参数可调</div>'}
      <div class="lvmsg" id="kmmsg"></div>
      <div class="lvform" style="margin-top:8px;gap:6px">
        <a href="#" class="lvtag" id="kprst">恢复默认参数</a>
      </div>
    </div></div>`;
}

/* 🔴 只重取【指标那一个接口】并重画 —— 不走整页 `load()`。
   走 load() 的话十个接口全重打、整块 #body 重渲染，页面会跳一下，
   而选指标是随手点的动作（同实盘页 `livePatch` 那条）。 */
/* 指标数据的缓存。键里必须含**所有会改变数值的东西** —— 少一项就会
   拿着上一只票 / 上一个区间的数字画图，而它不报错。 */
let KIND_CACHE = {key: null, rows: null, panels: null};
function kIndKey() {
  return [CODE, N, FQ, KOFF, kIndsParam()].join('|');
}

async function reloadInd(force) {
  const q = kIndsParam();
  const key = kIndKey();
  /* 🔴 **命中缓存就一个请求都不打**：切副图是随手点的动作，那几百毫秒的
     "旧图停一下再换成新图"就是用户说的"跳动一下"。数据早就在手上了
     （一次全取，见 kWant），没有任何理由再去问一遍。 */
  if (!force && KIND_CACHE.key === key && KIND_CACHE.rows) {
    IND = KIND_CACHE.rows;
    KPANELS = KIND_CACHE.panels;
    kApplyInd();
    return;
  }
  let ind = {rows: [], panels: []};
  const gen = KSEQ, iseq = ++KISEQ;
  if (q) {
    try {
      ind = await j(`/api/stock/indicators?n=${N}&fq=${FQ}&off=${KOFF}`
        + `&inds=${encodeURIComponent(q)}&code=` + encodeURIComponent(CODE));
    } catch (e) {
      /* ★ 取失败**不要把已经画好的图清掉** —— 抖一下就白屏比不刷新更糟
         （同实盘页"轮询失败安静跳过这一轮"）。说一句就够。 */
      const m = $('#kimsg');
      if (m) m.innerHTML = '　<b style="color:var(--warn)">指标取失败：'
        + esc(String(e)) + '</b>';
      return;
    }
  }
  /* 缓存**照存**（数据是好的，与谁先谁后无关），但**不渲染** ——
     渲染那一步才是会踩到别人 DOM 的地方。 */
  if (!ind.error) KIND_CACHE = {key: key, rows: ind.rows,
                                panels: ind.panels || []};
  if (gen !== KSEQ || iseq !== KISEQ) return;
  IND = ind.error ? null : ind.rows;
  KPANELS = ind.error ? [] : (ind.panels || []);
  kApplyInd();
}

/* 把手上这份指标数据画出来 + 把该重建的那块重建。
   ★ 抽成一个函数是因为它有**两个入口**（缓存命中 / 请求回来），
     两处各抄一份的话迟早只改一边（同「格子内容一处定义」那条）。 */
function kApplyInd() {
  /* 🔴 **只重建真的变了的那一块**（同实盘页 `livePatch` / `lvSig` 那条）。
     用户 2026-09-16："切换副图时整个页面会闪一下。这种局部切换图、数据的
     都不应该刷新整个页面。"

     换一个副图指标时，这三块**没有一块跟着变**：工具条是「⚙ 设置 + 主图
     开关」、槽位层是「下拉框 + ⚙ + ×」（下拉框的 value 本来就是用户刚选
     的那个）、「+ 副图」那行只跟槽位**个数**有关。无条件 `innerHTML` 换掉
     它们的代价是：**用户刚操作的那个 `<select>` 被销毁重建** —— 焦点没了、
     原生控件重绘，看上去就是闪一下。
     ★ 判据是**签名**不是"猜哪次该重建"：主图看 KMAIN、槽位看个数
       （换指标不改个数，加/删才改；删了之后 `data-j` 要重排，所以必须重建）。 */
  /* 🔴 签名**从 DOM 读**，不从状态变量读（也不另存一份"上次渲染成什么样"）。
     首屏那几块是 `load()` 里拼模板直接吐出来的、根本不经过这个函数 ——
     存一份"上次的签名"就会在**每次打开页面的第一次切换**上说谎（初值
     永远不等），于是第一次切换照样整块重建、照样闪一下。实测踩过。
     ★ 从 DOM 读的话不需要任何地方去"记得同步"：页面现在长什么样是事实，
       而记录会过期（同「判据永远是现在的状态，不是记录」那条）。 */
  const nSlot = KINDS.length;
  const cv = $('#kcv');
  /* 高度只在真的不同时赋值 —— 同值赋 style 也会让浏览器重新算一遍布局。 */
  if (cv) {
    const h = (nSlot ? 390 + 110 * nSlot : 420) + 'px';
    if (cv.style.height !== h) cv.style.height = h;
  }
  const box = $('#kpickbox');
  if (box) {
    /* ★ 两边都排序再比：`KMAIN` 是**点击顺序**，而 DOM 里按 defs 的顺序渲染
       —— 不排的话 ['boll','ma'] 与 'ma,boll' 永远不等，等于没有这个判据。 */
    const domMain = [...box.querySelectorAll('a.kmain.on')]
      .map(a => a.dataset.i).sort().join(',');
    if (domMain !== KMAIN.slice().sort().join(','))
      box.innerHTML = kPickHtml() + kMainHtml();
  }
  const sl = $('#kslots');
  if (sl && sl.querySelectorAll('.kslot').length !== nSlot) {
    /* 个数变了才重建 —— 删一个之后 `data-j` 要整体重排，非重建不可。 */
    sl.innerHTML = kSlotHtml();
    const ar = $('#kaddrow');
    if (ar) ar.innerHTML = kAddRowHtml();   /* 它只显示 n/KMAX，跟着个数走 */
  } else if (sl) {
    /* 个数没变：**一个元素都不碰**，只把 value 对齐（用户手动选的那个本来
       就对，这一步是给"程序化改了 KINDS"兜底，幂等、不引起重绘）。 */
    KINDS.forEach((id, j) => {
      const e = sl.querySelector('.kssel[data-j="' + j + '"]');
      if (e && e.value !== id) e.value = id;
      const g = sl.querySelector('.ksgear[data-j="' + j + '"]');
      if (g && g.dataset.i !== id) g.dataset.i = id;
    });
  }
  /* 弹窗**开着才重渲染**：关着时它是空的，渲染进去等于把它打开。
     🔴 **但人正在里面敲字时不能重渲染**（`contains(activeElement)`）：
       改一个参数就整块换掉，用户正编辑的那个 `<input>` 被从文档里摘走 ——
       ① 浏览器直接让这次赋值**失败**（`Failed to set the 'innerHTML'
          property … Perhaps it was moved in a 'blur' event handler?`），
          而它只在控制台里报；
       ② 就算成功，也会**失焦 + 光标位置丢失**，想连着改两个参数得重新点。
     ★ 而这时本来也没什么要更新的：框里的值就是他刚敲进去的。
       加 / 删副图那种（焦点在别处）仍然重渲染 —— 弹窗只列"当前用着的"
       指标，不更新的话新加的那个不出现。 */
  const mb = $('#kmodal');
  if (KMODAL && mb && !mb.contains(document.activeElement)) kModal(true);
  KGEO = redraw();
  kSlotPos();
}

/* 开/关参数弹窗。🔴 用 class 而不是 style.display —— `.stmodal` 的
   `display:none` 写在**样式表**里，`style.display=''` 只是删掉内联样式、
   规则照旧生效，表现是"点了没反应"且不报错（CLAUDE.md 记过这条）。 */
function kModal(on) {
  KMODAL = !!on;
  const m = $('#kmodal');
  if (!m) return;
  /* 关掉就**清空内容**（不是留着藏起来）：留着的话 `.stbox` 会掉进
     正常文档流里，把页面顶下去一大截 —— 而这正是用户要避免的
     "改参数导致页面高度变化"。 */
  m.innerHTML = KMODAL ? kModalHtml() : '';
}

function redraw() {
  const cv = $('#kcv');
  if (!cv || !BARS) return null;
  /* 主图指标**跟着 KMAIN 走**：
     ★ 均线关掉时要把 ma* 从 bars 里摘掉 —— 它们是 kline 一起带回来的，
       留着的话"关了还在画"，而那不报错。
     ★ BOLL 只并 ub/lb，**mb 刻意不带**：它等于 ma20，带上就是同一条线
       画两遍（kchart 那边也不画中轨，两处都堵住）。 */
  const wantMa = KMAIN.indexOf('ma') >= 0;
  const wantBoll = KMAIN.indexOf('boll') >= 0;
  const bars = (wantMa && !wantBoll) ? BARS : BARS.map((b, i) => {
    const o = Object.assign({}, b);
    if (!wantMa) ['ma5', 'ma10', 'ma20', 'ma60'].forEach(k => delete o[k]);
    if (wantBoll && IND && IND[i]) { o.ub = IND[i].ub; o.lb = IND[i].lb; }
    return o;
  });
  return (KGEO = drawKChart(cv, {bars: bars, log: KLOG, events: SHOWEV ? EVS : [],
    subs: kSubs(), hover: HOVER, sel: KSEL,
    /* 🔴 **不复权时才画买卖点**：成交价是不复权实际价，切到后复权之后
       标记会整体飘走（同浮层 `spFq` 那条纪律，只是这一页可以切）。 */
    trades: FQ === 'bfq' ? TRADES : []}));
}
</script>
