<!doctype html>
<meta charset="utf-8">
<title>assay 回测归档</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1d2229; --line:#2a313a;
  --fg:#dfe5ec; --dim:#8b97a6; --up:#f05b5b; --down:#2fb87a;
  --accent:#5b9cf0; --warn:#e0a33c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
#app{max-width:1500px;margin:0 auto;padding:0 22px 60px}
/* ---- 顶栏 ---- */
#top{position:sticky;top:0;background:var(--bg);z-index:9;padding:13px 0 10px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
#top h1{margin:0;font-size:15px;letter-spacing:.5px;color:var(--dim);font-weight:600;
  cursor:pointer;white-space:nowrap}
#top h1 b{color:var(--fg)}
#top .sp{flex:1}
#filter{padding:5px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;color:var(--fg);font-size:12px;width:270px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
/* ---- 目录树：任意深度，样式按 depth 生成而不是每层写一套 ---- */
#cat{padding-top:14px}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  margin-bottom:9px;overflow:hidden}
.nd{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  padding:8px 14px;border-bottom:1px solid #20262e}
.nd:hover{background:var(--panel2)}
.nd .ar{color:var(--dim);width:11px;font-size:10px;flex:0 0 11px;
  transition:transform .12s}
.nd.op .ar{transform:rotate(90deg)}
.nd .ic{flex:0 0 auto;font-size:12px;color:var(--dim)}
.nd .nm{font-weight:600}
.nd .sub{color:var(--dim);font-size:11.5px}
.nd .sp{flex:1}
.nd.d0 .nm{font-size:14px}
.nd.d0{background:var(--panel)}
.nd.leaf{cursor:default}
.body{display:none}
.body.op{display:block}
.sha{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--accent)}
.runs{background:var(--bg);padding:0 0 4px}
.runs table{font-size:12px}
.runs th{position:static;background:var(--bg);padding:6px 9px;box-shadow:none}
.runs tbody tr{cursor:pointer}
.runs tbody tr:hover{background:var(--panel2)}
.runs td{border-bottom:1px solid #20262e}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:11px}
.cd{color:var(--dim);font-size:10.5px;font-family:"SF Mono",Menlo,monospace;margin-left:5px}
.cd0{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.pill{font-size:10px;padding:1px 6px;border-radius:3px;background:#243040;color:var(--dim);
  margin-right:4px;white-space:nowrap}
.stale{color:var(--warn);font-size:10px;border:1px solid #5a4520;border-radius:3px;
  padding:0 4px;margin-left:5px;white-space:nowrap}
#fpbar{background:#2a2113;border:1px solid #5a4520;border-radius:7px;
  padding:9px 13px;margin:12px 0 0;font-size:12px;color:#e0c98c;line-height:1.7}
#fpbar b{color:var(--warn)}
/* ---- 版本页 ---- */
.vnote{color:var(--warn);font-size:11.5px}
.vopen{color:var(--accent);font-size:11px;border:1px solid var(--line);
  border-radius:4px;padding:1px 7px;cursor:pointer}
.vopen:hover{border-color:var(--accent);background:var(--panel2)}
#vp .sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:12px}
#vp h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600}
#vp pre{margin:0;max-height:460px;overflow:auto;background:#12161b;
  border:1px solid var(--line);border-radius:6px;padding:12px 14px;
  font:11.5px/1.65 "SF Mono",Menlo,monospace;color:#cbd4de;white-space:pre}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pf label{display:block;color:var(--dim);font-size:11px;margin-bottom:3px}
.pf input{width:100%;padding:5px 8px;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:5px;font-size:12px}
.pf input:focus{outline:none;border-color:var(--accent)}
.pf .cmt{color:#6f7c8c;font-size:10.5px;margin-top:3px;min-height:13px}
.pf .dv{color:var(--accent);font-family:"SF Mono",Menlo,monospace}
#joblog{margin:0;max-height:300px;overflow:auto;background:#12161b;
  border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  font:11px/1.6 "SF Mono",Menlo,monospace;color:#a8b4c2;white-space:pre-wrap}
.bad{color:var(--warn)}
/* ---- 详情 ---- */
#hd{position:sticky;top:47px;background:var(--bg);padding:12px 0 10px;z-index:5;
  border-bottom:1px solid var(--line)}
#hd .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#hd h2{margin:0;font-size:17px}
#hd .meta{color:var(--dim);font-size:12px}
#tabs{display:flex;gap:2px;margin-top:11px;flex-wrap:wrap}
#tabs div{padding:6px 13px;cursor:pointer;color:var(--dim);border-radius:5px 5px 0 0;
  font-size:12px}
#tabs div:hover{color:var(--fg)}
#tabs div.on{background:var(--panel);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.pane{display:none;padding-top:16px}
.pane.on{display:block}
/* ---- 统计卡 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.card .k{color:var(--dim);font-size:11px}
.card .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.card .n{color:var(--dim);font-size:10px;margin-top:1px}
.pos{color:var(--up)} .neg{color:var(--down)}
h3.sec{margin:22px 0 9px;font-size:13px;color:var(--dim);font-weight:600;
  border-bottom:1px solid var(--line);padding-bottom:5px}
/* ---- 图 ---- */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:10px 6px 4px;margin-top:10px;position:relative}
.chart .ttl{position:absolute;left:12px;top:8px;font-size:11px;color:var(--dim);z-index:2}
.chart .ctl{position:absolute;right:10px;top:6px;font-size:11px;color:var(--dim);z-index:2}
.chart .ctl span{cursor:pointer;padding:2px 7px;border-radius:4px}
.chart .ctl span.on{background:var(--panel2);color:var(--fg)}
svg{display:block;width:100%;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--dim);font-size:10px}
#tip{position:fixed;pointer-events:none;background:#0b0e12ee;border:1px solid var(--line);
  border-radius:5px;padding:6px 9px;font-size:11.5px;display:none;z-index:99;white-space:pre}
/* ---- 权益曲线区间条 ---- */
.rgbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:11.5px;
  color:var(--dim);margin:2px 0 4px}
.rg{cursor:pointer;padding:3px 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--panel2);color:var(--fg)}
.rg:hover{border-color:var(--dim)}
.rg.on{background:var(--accent);border-color:var(--accent);color:#0f1216;font-weight:600}
.rgbar .sp{width:8px}
.rgbar input[type=date]{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;color:var(--fg);font-size:11.5px;padding:2px 6px;
  font-family:inherit;color-scheme:dark}
/* ---- 年/月/日 热力下钻 ---- */
/* 配色原则：底色只负责【方向 + 强度】，数字一律用中性前景色。
   曾经底色和数字同色相（红底红字 / 绿底绿字），叠上去几乎读不出来。
   方向改由数字前面的 +/- 号承担，弱格子（底色近乎透明）也能一眼看出正负。 */
.hm{display:grid;gap:6px;margin-top:4px}
.hm.y{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.hm.m{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.hc{border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer;
  transition:outline-color .1s;outline:2px solid transparent;outline-offset:-2px}
.hc:hover{outline-color:var(--dim)}
.hc.on{outline-color:var(--accent)}
.hc.na{cursor:default;opacity:.28}
.hc.na:hover{outline-color:transparent}
.hc .k{font-size:11px;color:#d2dae4}
.hc .v{font-size:17px;font-variant-numeric:tabular-nums;margin:1px 0;color:var(--fg)}
.hc .n{font-size:10px;color:#d2dae4}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:12px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumb span{color:var(--dim)}
.lgd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:8px}
.lgd i{width:22px;height:11px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
#cal{margin-top:14px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px}
.calg .wd{color:var(--dim);font-size:11px;text-align:center;padding:2px 0}
.cd{border:1px solid var(--line);border-radius:5px;min-height:46px;padding:4px 5px;
  font-size:11px;line-height:1.35;cursor:pointer;
  outline:2px solid transparent;outline-offset:-2px}
.cd:hover{outline-color:var(--dim)}
.cd.on{outline-color:var(--accent)}
.cd .d{color:#d2dae4;font-size:10px}
.cd .v{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fg)}
.cd.off{opacity:.3;cursor:default;background:repeating-linear-gradient(135deg,
  transparent 0 5px,var(--line) 5px 6px)}
.cd.off:hover{outline-color:transparent}
.cd.pad{border:0;background:none;cursor:default}
.cd.pad:hover{outline-color:transparent}
#day{margin-top:14px}
#day .tw{max-height:none}
/* ---- 表 ---- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
/* .tw 自己是滚动容器 -> th 贴【容器】顶部，top 必须是 0。
   原先写 top:52px（那是给整页滚动准备的偏移），把表头往下推了 52px；
   背景也要用 --panel2 与 .tw 的 --panel 区分，否则滚动时行会透上来。 */
th{color:var(--dim);font-weight:600;font-size:11px;text-align:right;
  position:sticky;top:0;z-index:2;background:var(--panel2);
  cursor:pointer;user-select:none;box-shadow:inset 0 -1px 0 var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:hover{background:var(--panel)}
.tw{max-height:calc(100vh - 230px);overflow:auto;border:1px solid var(--line);
  border-radius:7px;background:var(--panel)}
/* 日期分隔块：粘在表头下方，滚动时始终知道当前看的是哪一天 */
tr.dayhd td{position:sticky;top:var(--thh,26px);z-index:1;background:#202832;color:var(--fg);
  font-weight:600;border-top:1px solid var(--line);text-align:left;font-size:12px}
tr.dayhd td span{color:var(--dim);font-weight:400;margin-left:12px;font-size:11px}
.pg{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;color:var(--dim)}
.pg button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer}
.pg button:disabled{opacity:.35;cursor:default}
.pg input{width:52px;background:var(--panel2);border:1px solid var(--line);
  color:var(--fg);border-radius:5px;padding:3px 6px;font-size:12px;text-align:center}
pre{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px;
  overflow:auto;max-height:calc(100vh - 200px);font:12px/1.65 "SF Mono",Menlo,monospace;
  color:#c8d3e0}
.kv{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:12px}
.kv .k{color:var(--dim)}
.kv .v{font-family:"SF Mono",Menlo,monospace;word-break:break-all}
.note{color:var(--dim);font-size:11.5px;margin:7px 0}
.warn{color:var(--warn)}
#empty{padding:60px 0;text-align:center;color:var(--dim)}
select,input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:5px;padding:4px 7px;font-size:12px}
/* 选中标记：★ 打在【单次回测】上 —— run 才记录了策略+参数+区间+成本+数据指纹，
   即完整的「规则」；策略文件或版本都不足以确定一条规则（同版本不同参数是不同规则）。 */
.st{cursor:pointer;font-size:14px;line-height:1;user-select:none;color:#3b4657;
    padding:0 2px;transition:color .12s}
.st:hover{color:#c9a227}
.st.on{color:#f2c744;text-shadow:0 0 6px rgba(242,199,68,.45)}
tr.marked{background:rgba(242,199,68,.07)}
tr.marked td{border-top:1px solid rgba(242,199,68,.25);border-bottom:1px solid rgba(242,199,68,.25)}
.stcnt{color:#f2c744;font-size:11px;margin-left:6px}
#pick{border:1px solid rgba(242,199,68,.35);border-radius:6px;background:rgba(242,199,68,.05);
      padding:10px 12px;margin:0 0 12px}
#pick h3{margin:0 0 8px;font-size:12.5px;color:#f2c744;font-weight:600}
#pick table{width:100%;border-collapse:collapse;font-size:11.5px}
#pick td{padding:3px 8px 3px 0;vertical-align:top}
#pick tr{cursor:pointer}
#pick tr:hover{background:rgba(242,199,68,.08)}
#pick .mn{color:var(--dim)}
/* 独立索引页：目录页顶部那条只列关键几列，这里是完整视图 */
#pk{padding:4px 0}
#pk h2{font-size:15px;margin:0 0 4px;color:#f2c744}
#pk .pg{border:1px solid var(--bd);border-radius:6px;margin:14px 0;overflow:hidden}
#pk .pgh{background:#1b2331;padding:7px 12px;font-size:12.5px;font-weight:600;
         border-bottom:1px solid var(--bd)}
#pk .card2{padding:11px 12px;border-bottom:1px solid #202836;cursor:pointer}
#pk .card2:last-child{border-bottom:none}
#pk .card2:hover{background:rgba(242,199,68,.06)}
#pk .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
#pk .nm2{font-size:13px;font-weight:600}
#pk .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;margin:4px 0}
#pk .kv b{font-size:12.5px}
#pk .why{color:var(--warn);font-size:11.5px;margin-top:5px;line-height:1.5}
#pk .cost{color:var(--dim);font-size:11px;font-family:ui-monospace,Menlo,monospace}
#pk .none{color:var(--dim);padding:40px 0;text-align:center}

/* ---- 数据字典 ---- */
#dk{display:grid;grid-template-columns:214px minmax(0,1fr);gap:20px;margin-top:14px}
@media (max-width:880px){#dk{grid-template-columns:1fr}}
.dside{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 84px);
  overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px}
@media (max-width:880px){.dside{position:static;max-height:none}}
.dhint{font-size:11px;color:var(--dim);line-height:1.55;padding:2px 4px 10px;
  border-bottom:1px solid var(--line);margin-bottom:8px;word-break:break-all}
.dhint b{color:var(--fg)}
.dgrp{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;
  margin:12px 0 5px;padding-left:4px}
.ditem{display:flex;justify-content:space-between;gap:6px;align-items:baseline;
  padding:6px 8px;border-radius:5px;color:var(--dim);font-size:12.5px;
  border-left:2px solid transparent}
.ditem:hover{background:var(--panel2);color:var(--fg)}
.ditem.on{background:var(--panel2);color:var(--fg);border-left-color:var(--accent)}
.ditem.miss{opacity:.4;text-decoration:line-through}
.ditem .dmeta{font-family:"SF Mono",Menlo,monospace;font-size:10px;color:var(--dim);flex:none}
.dbar{display:flex;gap:10px;align-items:center;position:sticky;top:47px;
  background:var(--bg);padding:8px 0 10px;z-index:4;border-bottom:1px solid var(--line)}
#dq{flex:1;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;color:var(--fg);font-size:12.5px;
  font-family:"SF Mono",Menlo,monospace}
#dq:focus{outline:none;border-color:var(--accent)}
.dhits{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--dim);flex:none}
.dsrc{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--dim);
  margin:12px 0 2px}
.dmd{font-size:13px;line-height:1.62;padding-bottom:60px}
.dmd h2.dh{font-size:19px;margin:22px 0 8px;padding-bottom:7px;
  border-bottom:1px solid var(--line);color:var(--fg)}
.dmd h3.dh{font-size:14px;margin:24px 0 8px;color:var(--accent);
  letter-spacing:.02em}
.dmd h4.dh,.dmd h5.dh{font-size:13px;margin:18px 0 6px;color:var(--fg)}
.dmd p{margin:8px 0;max-width:88ch}
.dmd ul,.dmd ol{margin:8px 0;padding-left:22px;max-width:88ch}
.dmd li{margin:3px 0}
.dmd hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.dmd blockquote{margin:12px 0;padding:9px 13px;border-left:3px solid var(--accent);
  background:var(--panel);border-radius:0 5px 5px 0;color:var(--dim);max-width:88ch}
.dmd blockquote b{color:var(--fg)}
.dmd code{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:1px 4px;color:var(--fg)}
.dmd pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;overflow-x:auto;margin:10px 0}
.dmd pre code{background:none;border:0;padding:0;font-size:11.5px;line-height:1.55}
.dtw{overflow-x:auto;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);margin:10px 0 16px}
table.dt{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
table.dt th{text-align:left;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);padding:8px 11px;background:var(--panel2);
  border-bottom:1px solid var(--line);white-space:nowrap;position:static;box-shadow:none}
table.dt td{padding:8px 11px;border-bottom:1px solid var(--line);
  vertical-align:top;line-height:1.55}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover td{background:var(--panel2)}
table.dt td:first-child{color:var(--fg)}
.dhi{background:rgba(91,156,240,.32);border-radius:2px}
.ditem.nohit{opacity:.35}
.ditem .dmeta{white-space:nowrap}
/* ---- 实盘模块 ---- */
.lvwarn{background:rgba(224,163,60,.12);border:1px solid var(--warn);color:var(--warn);
  border-radius:6px;padding:8px 12px;margin:0 0 14px;font-size:12px;line-height:1.7}
.lvcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin:0 0 14px}
.lvhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lvhead h2{margin:0;font-size:15px}
.lvtag{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.lvtag.on{color:var(--accent);border-color:var(--accent)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lvsec{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel2)}
.lvsec h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
table.lvt{width:100%;border-collapse:collapse;font-size:12px}
table.lvt th{text-align:right;color:var(--dim);font-weight:500;padding:3px 6px;
  border-bottom:1px solid var(--line);font-size:11px}
table.lvt th:first-child,table.lvt td:first-child{text-align:left}
table.lvt td{text-align:right;padding:3px 6px;border-bottom:1px solid rgba(42,49,58,.5);
  font-variant-numeric:tabular-nums}
table.lvt tr:last-child td{border-bottom:0}

<script>
const $=s=>document.querySelector(s), fmtN=(v,d=2)=>v==null?'—':(+v).toFixed(d);
/* 名称是【当时】的名称（服务端按行日期从 security_name 解析）——
   拿当前名称标一笔 2016 年的交易是误导：002711 走过
   欧浦钢网→欧浦智网→ST欧浦→*ST欧浦→欧浦退。名称缺失时退化为只显示代码。 */
const nmcode=(v,r)=>r.name?`${r.name}<span class="cd">${v}</span>`:`<span class="cd0">${v}</span>`;
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=2)=>v==null?'—':(v*100).toFixed(d)+'%';
const sign=v=>v==null?'':(v>0?'pos':(v<0?'neg':''));
let RUNS=[], CUR=null, DATA={}, HD={off:0,lim:100};

/* 直接 r.json() 会把服务端的纯文本错误（404 的 "not found"）变成
   "Unexpected token 'o'…" 这种看不懂的解析报错 —— 而真实原因往往是
   【服务端还是旧进程、没有这个新接口】。这里先看状态码再解析，把话说清楚。 */
async function j(u){
  const r=await fetch(u);
  const txt=await r.text();
  if(!r.ok){
    const path=(u.split('?')[0]);
    throw new Error(r.status===404
      ? `接口 ${path} 不存在（服务端可能是旧进程，重启 serve.py 再试）`
      : `${path} 返回 HTTP ${r.status}：${txt.slice(0,120)}`);
  }
  let o; try{ o=JSON.parse(txt); }
  catch(e){ throw new Error(`${u.split('?')[0]} 返回的不是 JSON：${txt.slice(0,120)}`); }
  if(o&&o.error) throw new Error(o.error);
  return o;
}

/* ============ 路由：用 location.hash，让浏览器前进/后退天然可用 ============ */
function route(){
  // 年详情页要排在 run 之前匹配 —— run 的 (.+) 是贪婪的，会把 /y/2016 一起吃掉。
  // 同一份回测内切换年份【不重新拉数据】：CUR/DATA 还在就直接重画。
  const my=/^#\/run\/(.+)\/y\/(\d{4})$/.exec(location.hash||'');
  if(my){
    const id=decodeURIComponent(my[1]); YPAGE=my[2];
    if(warm(id)){ tab(2); } else { openRun(id, 2); }
    return;
  }
  const m=/^#\/run\/(.+)$/.exec(location.hash||'');
  if(m){
    const id=decodeURIComponent(m[1]); YPAGE=null; MSEL=null; DSEL=null;
    if(warm(id)){ tab(2); } else { openRun(id); }
    return;
  }
  const v=/^#\/ver\/([0-9a-f]{6,64})$/.exec(location.hash||'');
  if(v){ openVersion(v[1]); return; }
  if((location.hash||'')==='#/picks'){ showPicks(); return; }
  const lm=/^#\/live(?:\/([\w-]+))?$/.exec(location.hash||'');
  if(lm){ showLive(lm[1]||null); return; }
  const dm=/^#\/docs(?:\/([\w-]+))?$/.exec(location.hash||'');
  if(dm){ showDocs(dm[1]||null); return; }
  showCatalog();
}
/* 同一份回测内切年份不必重拉数据。但【详情视图必须正在显示】才能走这条快捷路径 ——
   从目录页后退回来时 #main 是隐藏的，只调 tab() 不会把它显出来（曾因此白屏）。 */
function warm(id){
  return CUR===id && DATA.eq && $('#main') && $('#main').style.display!=='none';
}
window.onhashchange=route;
$('#home').onclick=()=>{location.hash='';};
$('#back').onclick=()=>{location.hash='';};

/* ============ 实盘模块 ============ */
/* 页面只负责【显示与录入】。所有规则判定都在服务端 assay/live.py ——
   它把成交流水重建成 Portfolio 再喂给真引擎，不在前端重算任何一条规则。 */
let LV=null, LVSEL=null;

/* esc 复用文件上方那个（第 ~357 行）—— 不重复定义。 */
function num(x,d){ return (x==null||isNaN(x))?'—':Number(x).toLocaleString('zh-CN',
  {minimumFractionDigits:d==null?0:d, maximumFractionDigits:d==null?0:d}); }

  $('#nb').onclick=async()=>{
    const m=$('#nmsg');
    try{
      const r=await post('/api/live/save',{id:$('#na').value.trim(),

async function post(u,body){
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const t=await r.text(); let o;
  try{ o=JSON.parse(t); }catch(e){ throw new Error(t.slice(0,150)); }
  if(o&&o.error) throw new Error(o.error);
  return o;
}

function sigHtml(s){

  const why={stop:'止损', limit_up_exit:'炸板离场', rebalance_out:'调仓换出'};
  return w+`<div class="lvsec" style="margin-bottom:14px">
    <h3>${esc(s.for_date)} 待办 ${s.is_rebalance_day?'· 调仓日':'· 非调仓日'}

          :'<div class="none">无</div>'}</div>

            <td>${num(x.limit,2)}</td><td>${num(x.amount)}</td></tr>`).join('')}</table>
          <div class="lvwhy">限价 = T-1 收盘 × 1.05（防高开买不进）；twopass 分配，估余 ${num(s.left_est)}</div>`
          :'<div class="none">无</div>'}</div>

function fillFormHtml(sig,ro){
  const rows=[].concat((sig&&sig.sell)||[],(sig&&sig.buy)||[]);
  return `<div class="lvsec"><h3>录入成交</h3>
    <div class="lvform">
      <input id="fd" size="6" placeholder="YYYY-MM-DD" value="${sig?esc(sig.for_date):''}">
      <input id="fc" size="6" placeholder="代码">

      <input id="fq" size="6" placeholder="股数">

      <button class="btn" id="fb" ${ro?'disabled':''}>录一笔</button>
    </div>

      <button class="btn" id="fbulk" ${ro?'disabled':''}>解析并录入</button>
      ${rows.length?`<button class="btn" id="fauto" ${ro?'disabled':''}>按信号全部成交（价格用参考价，可再改）</button>`:''}
    </div>
    <div class="lvmsg" id="fmsg"></div></div>`;
}

function parseBulk(txt){
  const out=[], bad=[];
  txt.split(/\n/).forEach((ln,i)=>{
    ln=ln.trim(); if(!ln) return;
    const p=ln.split(/[\s,\t]+/).filter(Boolean);
    if(p.length<5){ bad.push('第'+(i+1)+'行字段不足5个'); return; }
    const side=/买|buy|b/i.test(p[2])&&!/卖/.test(p[2])?'buy':'sell';
    out.push({trade_date:p[0], code:p[1].toUpperCase(), side:side,
              shares:parseInt(p[3],10), price:parseFloat(p[4]), source:'bulk'});
  });
  return {rows:out, bad:bad};
}

function wireFills(aid, sig, ro){
  if(ro) return;
  const m=()=>$('#fmsg');
  const done=async(rows)=>{
    try{
      const r=await post('/api/live/fill',{id:aid, rows:rows});
      if(r.errors&&r.errors.length){
        m().className='lvmsg bad';
        m().innerHTML='录入 '+r.added+' 笔，以下失败：<br>'+r.errors.map(esc).join('<br>');
      }else{ loadLive(aid); }
    }catch(e){ m().className='lvmsg bad'; m().textContent=String(e); }
  };
  $('#fb').onclick=()=>done([{trade_date:$('#fd').value.trim(), code:$('#fc').value.trim().toUpperCase(),
    side:$('#fs').value, shares:parseInt($('#fq').value,10), price:parseFloat($('#fp').value)}]);
  $('#fbulk').onclick=()=>{
    const r=parseBulk($('#ft').value);
    if(r.bad.length){ m().className='lvmsg bad'; m().innerHTML=r.bad.map(esc).join('<br>'); return; }
    if(!r.rows.length){ m().className='lvmsg bad'; m().textContent='没解析出任何一行'; return; }
    done(r.rows);
  };
  const fa=$('#fauto');
  if(fa) fa.onclick=()=>{
    const rows=[].concat(
      (sig.sell||[]).map(x=>({trade_date:sig.for_date, code:x.code, side:'sell',
        shares:x.shares, price:x.ref_price, name:x.name, source:'signal'})),
      (sig.buy||[]).map(x=>({trade_date:sig.for_date, code:x.code, side:'buy',
        shares:x.shares, price:x.ref_price, name:x.name, source:'signal'})));
    if(!confirm('按信号录入 '+rows.length+' 笔？价格用的是 T-1 参考价，成交后请逐笔改成实际价（录反向冲正 + 重录）。')) return;
    done(rows);
  };
}

/* ============ 数据字典 ============ */
/* 内容【不烤在前端】—— 服务端每次请求重读磁盘上的 md。
   改 md 刷新页面就生效，新增一份文档只需在 server.py 的 _DOCS 加一行。 */
let DOCS=null, DOCKEY=null, DOCQ='', DOCHTML={}, DOCALL=false;

async function showDocs(key){
  stopPoll();
  $('#cat').style.display='none'; $('#vp').innerHTML=''; $('#vp').style.display='none';
  $('#filter').style.display='none'; $('#expand').style.display='none';
  $('#back').style.display=''; $('#main').style.display='';

    try{ DOCS=await j('/api/docs'); }
    catch(e){ $('#main').innerHTML='<div class="none">数据字典读取失败：'+e+'</div>'; return; }
  }
  const avail=DOCS.docs.filter(d=>d.exists);
  DOCKEY = key || (avail[0]&&avail[0].key) || null;
  const groups=[];
  DOCS.docs.forEach(d=>{ let g=groups.find(x=>x.g===d.group);
    if(!g){ g={g:d.group, items:[]}; groups.push(g); } g.items.push(d); });
  $('#main').innerHTML=`<div id="dk">
    <div class="dside">
      <div class="dhint">直接读仓库里的 md —— <b>改文件刷新即生效</b>。<br>
        根目录 <code>${DOCS.root}</code></div>
      ${groups.map(g=>`<div class="dgrp">${g.g}</div>`+g.items.map(d=>
        `<a class="ditem${d.key===DOCKEY?' on':''}${d.exists?'':' miss'}"
            href="#/docs/${d.key}" ${d.exists?'':'title="文件不存在"'}>
           <span>${d.title}</span>
           <span class="dmeta" data-key="${d.key}"
                 data-size="${d.exists?(d.bytes/1024).toFixed(1)+'K':'缺'}"

async function loadDoc(key){

    catch(e){ c.innerHTML='<div class="none">读取失败：'+e+'</div>'; return; }
  }
  c.innerHTML=`<div class="dsrc">${r.rel}${r.mtime?' · 更新于 '+r.mtime:''}</div>`+r.html;

/* 过滤当前这篇：命中的行留下并高亮，整表空掉就连带标题一起隐藏。
   —— 表格是这批文档的主体，按【行】过滤比按段落过滤有用得多。 */
function dfilter(){
  const c=$('#dc'); if(!c) return;
  const q=(DOCQ||'').trim().toLowerCase();
  const rows=[...c.querySelectorAll('table.dt tbody tr')];
  rows.forEach(tr=>{
    tr.querySelectorAll('td').forEach(td=>{
      if(td.dataset.raw!==undefined){ td.innerHTML=td.dataset.raw; delete td.dataset.raw; }
    });
  });
  let hit=0;
  rows.forEach(tr=>{
    const ok = !q || tr.textContent.toLowerCase().includes(q);
    tr.style.display = ok?'':'none';
    if(ok){ hit++; if(q) tr.querySelectorAll('td').forEach(td=>dmark(td,q)); }
  });
  // 空表 + 其后紧跟的标题一起收起
  c.querySelectorAll('.dtw').forEach(w=>{
    const n=[...w.querySelectorAll('tbody tr')].filter(t=>t.style.display!=='none').length;
    w.style.display = (q && n===0)?'none':'';
  });
  if(q){
    [...c.querySelectorAll('h3.dh, h4.dh')].forEach(h=>{
      let n=h.nextElementSibling, vis=false;
      while(n && !/^H[2-4]$/.test(n.tagName)){
        if(n.style.display!=='none' && n.textContent.trim()) vis=true;
        n=n.nextElementSibling;
      }
      h.style.display = vis?'':'none';
    });
    c.querySelectorAll('p, ul, ol, blockquote').forEach(el=>{
      el.style.display = el.textContent.toLowerCase().includes(q)?'':'none';
    });
  }else{
    c.querySelectorAll('h3.dh, h4.dh, p, ul, ol, blockquote').forEach(
      el=>{el.style.display='';});
  }
  const h=$('#dhits');
  if(h) h.textContent = rows.length ? (q?hit+' / '+rows.length+' 行':rows.length+' 行') : '';
  dcount(q);
}

/* 跨篇计数：过滤时在侧栏把每一篇的命中行数标出来 —— 否则你只能看到当前这篇，
   而「这个概念在哪一篇」恰恰是最常问的。首次过滤把全部文档拉一遍并缓存。 */
async function dcount(q){
  const metas=[...document.querySelectorAll('.dmeta[data-key]')];
  if(!q || q.length<2){
    metas.forEach(m=>{ m.textContent=m.dataset.size;
      m.parentElement.classList.remove('nohit'); });
    return;
  }
  if(!DOCALL){
    DOCALL=true;
    const need=(DOCS?DOCS.docs:[]).filter(d=>d.exists && !DOCHTML[d.key]);
    await Promise.all(need.map(async d=>{
      try{ DOCHTML[d.key]=await j('/api/doc?key='+encodeURIComponent(d.key)); }
      catch(e){ /* 单篇失败不拖累其它篇 */ }
    }));
  }
  const box=document.createElement('div');
  metas.forEach(m=>{
    const r=DOCHTML[m.dataset.key];
    if(!r||!r.html){ m.textContent=m.dataset.size; return; }
    box.innerHTML=r.html;
    const n=[...box.querySelectorAll('table.dt tbody tr')]
              .filter(tr=>tr.textContent.toLowerCase().includes(q)).length;
    m.textContent = n? n+' 命中' : '—';
    m.parentElement.classList.toggle('nohit', n===0);
  });
}

function dmark(td,q){
  const raw=td.innerHTML;
  const t=td.textContent, i=t.toLowerCase().indexOf(q);
  if(i<0) return;
  td.dataset.raw=raw;
  // 只在纯文本节点上高亮，避免破坏 <code>/<b>/<a> 结构
  const walk=n=>{
    if(n.nodeType===3){
      const s=n.nodeValue, k=s.toLowerCase().indexOf(q);
      if(k<0) return;
      const sp=document.createElement('span'); sp.className='dhi';
      const after=n.splitText(k); after.splitText(q.length);
      sp.textContent=after.nodeValue; after.parentNode.replaceChild(sp, after);
      return;
    }
    [...n.childNodes].forEach(walk);
  };
  [...td.childNodes].forEach(walk);
}

/* 建任意深度的目录树：
     文件夹（可嵌套文件夹）→ 策略文件 → 【代码版本】→ 回测
   ★ 策略身份 = 文件内容哈希：同一路径改一个字符就是另一个策略，
     所以版本是独立的一层。只有一个版本时跳过这层，免得多点一次。 */
function buildTree(rs){
  const root={dirs:{}, files:{}};
  rs.forEach(r=>{
    let parts=(r.strategy_path||'').split('/').filter(Boolean);
    if(parts[0]==='strategies'){
      parts=parts.slice(1);
    }else if(parts.length>1){
      // ★ 仓库外的路径【压成一层】。诊断用的一次性脚本常放在 scratchpad，
      //   strategy_path 会是逃逸出仓库的相对路径，例如
      //   ../../../../private/tmp/claude-501/<...>/scratchpad/froec_oldsql.py
      //   —— 8 段路径会铺出 8 层、每层只有一个子节点的空壳，把目录树撑坏。
      //   完整路径仍挂在文件节点的 title 上，可审计。
      parts=['_仓库外', parts[parts.length-1]];
    }
    if(parts.length<1||!parts[0]) parts=['_未知路径', r.strategy+'.py'];
    const file=parts.pop();
    let node=root;
    parts.forEach(d=>{ node.dirs[d]=node.dirs[d]||{dirs:{},files:{}}; node=node.dirs[d]; });
    (node.files[file]=node.files[file]||[]).push(r);
  });
  return root;
}
function countTree(node){
  // ★ marked 要向上冒泡：折叠状态下也得看得见这个目录里有没有选中的规则，
  //   否则「打标记方便找」这个目的就落空了 —— 还得逐层展开才知道。
  let files=0,runs=0,strats=0,best=null,marked=0;
  Object.values(node.dirs).forEach(d=>{const c=countTree(d);
    files+=c.files; runs+=c.runs; strats+=c.strats; marked+=c.marked;
    if(c.best!=null&&(best==null||c.best>best)) best=c.best;});
  Object.values(node.files).forEach(rs=>{files++; runs+=rs.length;
    strats+=new Set(rs.map(r=>r.code_sha)).size;
    rs.forEach(r=>{if(r.mark) marked++;
      if(r.annual_return!=null&&(best==null||r.annual_return>best)) best=r.annual_return;});});
  return {files,runs,strats,best,marked};
}
function stcnt(n){return n?`<span class="stcnt" title="含 ${n} 条选中的规则">★${n>1?'×'+n:''}</span>`:'';}
function renderNode(node,depth,keyPrefix,auto){
  let h='';
  // 文件夹（可嵌套）
  Object.keys(node.dirs).sort().forEach(d=>{
    const k=keyPrefix+'/'+d, op=auto||OPEN.has(k), c=countTree(node.dirs[d]);
    h+=`<div class="nd d${depth} ${op?'op':''}" data-k="${k}"
          style="padding-left:${14+depth*20}px">
        <span class="ar">▶</span><span class="ic">📁</span>
        <span class="nm">${d}</span>${stcnt(c.marked)}
        <span class="sub">${c.files} 个文件 · ${c.strats} 个策略 · ${c.runs} 次回测</span>
        <span class="sp"></span>
        <span class="sub">最佳年化 <b class="${sign(c.best)}">${pct(c.best,1)}</b></span></div>
      <div class="body ${op?'op':''}">${renderNode(node.dirs[d],depth+1,k,auto)}</div>`;
  });
  // 策略文件
  Object.keys(node.files).sort().forEach(f=>{
    const rs=node.files[f], k=keyPrefix+'/'+f, op=auto||OPEN.has(k);
    // ★ 版本层按【语义哈希】分组：改注释/排版/简介不算新版本。
    //   字节哈希仍在每条回测里保留（审计追溯：归档里躺的是哪份字节）。
    const byv={}; rs.forEach(r=>{const k=r.sem_sha||r.code_sha;(byv[k]=byv[k]||[]).push(r);});
    const vs=Object.keys(byv).sort((a,b)=>
      (agg(byv[b]).latest.ran_at||'')<(agg(byv[a]).latest.ran_at||'')?-1:1);
    const a=agg(rs);
    h+=`<div class="nd d${depth} ${op?'op':''}" data-k="${k}"
          style="padding-left:${14+depth*20}px">
        <span class="ar">▶</span><span class="ic">📄</span>
        <span class="nm" title="${esc(rs[0].strategy_path||'')}">${f}</span>${stcnt(rs.filter(r=>r.mark).length)}
        <span class="sub">${vs.length} 个版本 · ${rs.length} 次回测</span>
        ${vs.length===1?`<span class="vnote">${esc(byv[vs[0]][0].note||'（未填简介）')}${
            byv[vs[0]][0].note_src==='docstring'?'<span class="cmt" style="margin-left:6px">取自 docstring</span>':''}</span>
          <span class="vopen" data-ver="${newest(byv[vs[0]]).code_sha256}">代码 / 回测 →</span>`:''}
        <span class="sp"></span>
        <span class="sub">年化 <b class="${sign(a.best)}">${pct(a.best,1)}</b>
          ~ <b class="${sign(a.worst)}">${pct(a.worst,1)}</b>
          · 最近 ${(a.latest.ran_at||'').replace('T',' ').slice(5,16)}</span></div>
      <div class="body ${op?'op':''}">`;
    if(vs.length===1){
      // 只有一个版本 -> 直接列回测，不多套一层
      h+=runTable(rs);
    }else{
      vs.forEach(v=>{
        const vk=k+'@'+v, vop=auto||OPEN.has(vk), va=agg(byv[v]);
        h+=`<div class="nd d${depth+1} ${vop?'op':''}" data-k="${vk}"
              style="padding-left:${14+(depth+1)*20}px">
            <span class="ar">▶</span><span class="ic">⌗</span>
            <span class="nm sha">${v}</span>${stcnt(byv[v].filter(r=>r.mark).length)}
            ${(()=>{const nb=new Set(byv[v].map(r=>r.code_sha)).size;
                return nb>1?`<span class="pill" title="行为相同，仅注释/排版/简介不同">${nb} 份字节版本</span>`:'';})()}
            <span class="vnote">${esc(byv[v][0].note||'（未填简介）')}${
              byv[v][0].note_src==='docstring'?'<span class="cmt" style="margin-left:6px">取自 docstring</span>':''}</span>
            <span class="sp"></span>
            <span class="vopen" data-ver="${newest(byv[v]).code_sha256}"
              >代码 / 回测 →</span></div>
          <div class="body ${vop?'op':''}">${runTable(byv[v])}</div>`;
      });
    }
    h+='</div>';
  });
  return h;
}
function renderCatalog(){
  const q=$('#filter').value.trim().toLowerCase();
  const rs=RUNS.filter(r=>!q||((r.strategy_path||'')+' '+r.strategy+' '+r.run_id+' '+r.code_sha+' '+

          <div class="kv">
            <span>年化 <b class="${sign(r.annual_return)}">${pct(r.annual_return,2)}</b></span>
            <span>回撤 <b class="neg">${pct(r.max_drawdown,2)}</b></span>
            <span>夏普 <b>${fmtN(r.sharpe)}</b></span>
            <span>超额年化 <b class="${sign(r.excess_annual)}">${pct(r.excess_annual,2)}</b></span>
            <span>信息比率 <b>${fmtN(r.info_ratio)}</b></span>
            <span>年换手 <b>${fmtN(r.turnover_per_year,1)}</b></span>
            <span>交易 <b>${r.n_trades??'—'}</b></span>
            <span>胜率 <b>${pct(r.win_rate,1)}</b></span>
          </div>
          <div class="cost">${r.start} ~ ${r.end} · 本金 ${(+r.cash).toLocaleString()}

        </div>`).join('')).join('')}

  </div>`;
  document.querySelectorAll('#pk .card2[data-go]').forEach(e=>
    e.onclick=()=>{ location.hash='#/run/'+encodeURIComponent(e.dataset.go); });
}

/* ============ 选中标记 ============ */
/* ★ 打在【单次回测】上：run 记录了策略 + 参数 + 区间 + 成本 + 数据指纹，
   才构成一条完整的「规则」。策略文件或代码版本都不够 —— 同一版本换个
   参数就是另一条规则（froec 的 kcb_688_only=0 与默认值就是两条）。 */
function pickBar(){
  const ms=RUNS.filter(r=>r.mark);
  if(!ms.length) return '';
  ms.sort((a,b)=>((a.group||'')+a.strategy).localeCompare((b.group||'')+b.strategy));
  return `<div id="pick"><h3>★ 选中的规则（${ms.length}）</h3><table>${ms.map(r=>
    `<tr data-go="${r.run_id}">
       <td style="white-space:nowrap"><b>${esc(r.strategy)}</b></td>
       <td>${Object.entries(r.params||{}).map(([k,v])=>
            `<span class="pill">${esc(k)}=${esc(String(v))}</span>`).join('')||
            '<span class="mn">默认参数</span>'}</td>
       <td style="white-space:nowrap">年化 <b class="${sign(r.annual_return)}"
            >${pct(r.annual_return,2)}</b></td>
       <td style="white-space:nowrap">回撤 <span class="neg">${pct(r.max_drawdown,2)}</span></td>
       <td style="white-space:nowrap">夏普 ${fmtN(r.sharpe)}</td>
       <td class="mn">${r.start} ~ ${r.end}</td>
       <td class="mn">${esc(r.mark_note||'')}</td>
       ${r.stale?'<td><span class="stale">数据已变</span></td>':'<td></td>'}
     </tr>`).join('')}</table>
    <div class="note" style="margin:6px 0 0">★ 记的是 run，含参数与成本口径；
      标 <b>数据已变</b> 的说明归档时的数据与当前面板不一致，数字不能直接引用。</div></div>`;
}
function wireStars(){
  document.querySelectorAll('.st[data-mk]').forEach(e=>e.onclick=async ev=>{
    ev.stopPropagation();                 // 否则会连带打开这次回测的详情页
    const id=e.dataset.mk, r=RUNS.find(x=>x.run_id===id);
    let body;
    if(r&&r.mark){ body={run_id:id, mark:''}; }        // 已选中 -> 取消
    else{
      const note=prompt('为什么选中它？（可留空，会显示在顶部「选中的规则」里）',
                        (r&&r.mark_note)||'');
      if(note===null) return;                          // 取消对话框 = 不改动
      body={run_id:id, mark:'star', note:note};
    }
    e.style.opacity='.4';
    try{
      const res=await fetch('/api/mark',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const o=await res.json();
      if(o.error){ alert('打标记失败：'+o.error); e.style.opacity=''; return; }
      await loadRuns0();                                // 重取，别只改本地状态
      if(!location.hash) renderCatalog();
    }catch(err){ alert('打标记失败：'+err); e.style.opacity=''; }
  });
  document.querySelectorAll('#pick tr[data-go]').forEach(e=>
    e.onclick=()=>{ location.hash='#/run/'+encodeURIComponent(e.dataset.go); });
}
$('#filter').oninput=()=>{ if(!location.hash) renderCatalog(); };
$('#expand').onclick=()=>{
  const anyClosed=document.querySelector('.nd[data-k]:not(.op)');
  if(anyClosed) document.querySelectorAll('.nd[data-k]').forEach(e=>OPEN.add(e.dataset.k));
  else OPEN.clear();
  $('#expand').textContent=anyClosed?'全部收起':'全部展开';
  renderCatalog();
  // 展开是逐层的：新露出来的节点这一轮才存在，需要再补一次
  if(anyClosed) for(let i=0;i<6;i++){
    const more=document.querySelectorAll('.nd[data-k]:not(.op)');
    if(!more.length) break;
    more.forEach(e=>OPEN.add(e.dataset.k)); renderCatalog();
  }
};


/* ============ 版本页：源码 + 可填参数 + 触发回测 ============ */
/* 版本 = 代码哈希。同一版本下所有回测的代码完全相同，所以「看代码」「按参数
   再跑一次」都属于版本这一层，而不是单次回测那一层。 */
let VER=null, POLL=null;
function stopPoll(){ if(POLL){clearInterval(POLL); POLL=null;} }

  const runs=RUNS.filter(r=>(r.sem_sha256||r.code_sha256)===(v.sem_sha256||v.code_sha256));

        <span class="meta">${esc(v.group||'')} · <span class="mono">${esc(v.strategy_path||'')}</span>
          · 版本 <span class="sha">${esc(v.sem_sha||v.code_sha)}</span>
          <span class="cmt">(行为哈希)</span> · ${runs.length} 次回测</span></div>
      <div class="row1"><span class="vnote">${esc(v.note||'（未填简介）')}${
          v.note_src==='docstring'?'<span class="cmt" style="margin-left:8px">—— 该版本没写 NOTE，这句取自 docstring；同一文件的多个旧版本会显示相同内容</span>':''}</span></div>

          <div class="cmt">YYYY-MM-DD</div></div>

          <input data-p="${esc(pp.name)}" placeholder="${esc(pp.default)}">
          <div class="cmt">默认 <span class="dv">${esc(pp.default)}</span>

async function startBacktest(){
  const btn=$('#f_run'), msg=$('#f_msg');
  const params={};
  document.querySelectorAll('#vp input[data-p]').forEach(e=>{
    const t=e.value.trim(); if(t) params[e.dataset.p]=t;});
  const body={sha:VER.code_sha256, params,
    start:$('#f_start').value.trim(), end:$('#f_end').value.trim(),
    cash:$('#f_cash').value.trim(), jq_cost:$('#f_jq').checked};
  btn.disabled=true; btn.style.opacity=.45; msg.textContent='提交中…';
  let r;
  try{
    r=await (await fetch('/api/backtest',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  }catch(e){ r={error:String(e)}; }
  if(r.error){ msg.innerHTML='<span class="bad">'+esc(r.error)+'</span>';
    btn.disabled=false; btn.style.opacity=1; return; }
  msg.textContent='';
  $('#jobsec').style.display='';
  $('#joblog').textContent=r.cmd+'\n';
  pollJob(r.job_id, btn);
}

function pollJob(id, btn){
  stopPoll();
  const log=$('#joblog'), st=$('#jobstate');
  POLL=setInterval(async()=>{
    let o; try{ o=await j('/api/job?id='+encodeURIComponent(id)); }catch(e){ return; }
    log.textContent=(o.lines||[]).join('\n');
    log.scrollTop=log.scrollHeight;
    if(o.state==='running'){ st.textContent='运行中…'; return; }
    stopPoll();
    btn.disabled=false; btn.style.opacity=1;
    if(o.state==='done'){
      st.innerHTML='完成'+(o.run_id?` · <a href="#/run/${encodeURIComponent(o.run_id)}">查看结果 →</a>`:'');
      // 归档变了，刷新列表，这样目录树和「历次回测」都能立刻看到新记录
      loadRuns0().then(()=>{ if(VER) renderVersionRuns(); });
    }else{
      st.innerHTML='<span class="bad">失败（退出码 '+o.rc+'）</span>';
    }
  },1200);
}

async function loadRuns0(){ RUNS=await j('/api/runs'); }
function renderVersionRuns(){
  const runs=RUNS.filter(r=>(r.sem_sha256||r.code_sha256)===(VER.sem_sha256||VER.code_sha256));
  const secs=document.querySelectorAll('#vp .sec');
  const box=secs[secs.length-1];
  if(!box) return;
  box.innerHTML='<h3>该版本的历次回测</h3>'+(runs.length?runTable(runs):'<div class="note">还没有回测</div>');
  box.querySelectorAll('.runs tbody tr[data-id]').forEach(e=>e.onclick=()=>{
    location.hash='#/run/'+encodeURIComponent(e.dataset.id);});
}

/* ============ SVG 折线图 ============ */
function lineChart(el,series,opt){
  opt=opt||{}; const W=1160,H=opt.h||330,L=54,R=16,T=opt.t||22,B=26;
  const n=series[0].v.length; if(!n){el.innerHTML='<div class="note">无数据</div>';return;}
  const log=!!opt.log;
  const tf=v=>log?Math.log10(Math.max(v,1e-6)):v;
  let lo=Infinity,hi=-Infinity;
  series.forEach(s=>s.v.forEach(v=>{if(v==null)return;const t=tf(v);
    if(t<lo)lo=t; if(t>hi)hi=t;}));
  if(!(hi>lo)){hi=lo+1;}
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*(n<2?0:i/(n-1)), Y=v=>T+(H-T-B)*(1-(tf(v)-lo)/(hi-lo));
  const path=s=>{let d='',on=false;
    s.v.forEach((v,i)=>{if(v==null){on=false;return;}
      d+=(on?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';on=true;});return d;};
  // y 轴刻度
  let ticks=[];
  for(let k=0;k<=4;k++){const t=lo+(hi-lo)*k/4; ticks.push(log?Math.pow(10,t):t);}
  const yl=v=>opt.pctAxis?((v-1)*100).toFixed(0)+'%':(v>=10?v.toFixed(0)+'x':v.toFixed(2)+'x');
  // x 轴：取 6 个日期
  const xs=[]; for(let k=0;k<6;k++){const i=Math.round((n-1)*k/5); xs.push([i,opt.dates[i]]);}
  el.innerHTML=`
   ${opt.title?`<div class="ttl">${opt.title}</div>`:''}
   ${opt.ctl||''}
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
     ${ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
        <text class="ax" x="${L-7}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${yl(v)}</text>`).join('')}
     ${xs.map(([i,d])=>`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${d}</text>`).join('')}
     ${series.map(s=>`<path d="${path(s)}" fill="none" stroke="${s.c}"
        stroke-width="${s.w||1.6}" stroke-linejoin="round"/>`).join('')}
     <rect id="hz" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
   </svg>
   <div class="note" style="padding-left:8px">${series.map(s=>
      `<span style="color:${s.c}">━</span> ${s.n}`).join('　')}</div>`;
  // hover
  const svg=el.querySelector('svg'), tip=$('#tip');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect();
    const i=Math.round((n-1)*Math.min(1,Math.max(0,((e.clientX-r.left)/r.width*W-L)/(W-L-R))));
    tip.style.display='block'; tip.style.left=(e.clientX+12)+'px';
    tip.style.top=(e.clientY+10)+'px';
    tip.textContent=opt.dates[i]+'\n'+series.map(s=>s.n+'  '+
      (s.v[i]==null?'—':(opt.pctAxis?((s.v[i]-1)*100).toFixed(1)+'%':s.v[i].toFixed(3)+'x'))).join('\n');};
  svg.onmouseleave=()=>{$('#tip').style.display='none';};
}
let EQLOG=true;
let EQR={a:null,b:null};      // 权益曲线的显示区间（null = 全程）

function paneEquity(){
  const e=DATA.eq, s=DATA.run.stats;
  const D=e.dates;
  // ★ 区间【重新归一】：截一段不是把全程曲线切开看，而是以区间首日为 1x
  //   重算。否则 2024 那种年份会显示成 "从 18x 到 19x"，读不出当年涨跌。
  //   回撤同理 —— 峰值只在区间内累计，不带入区间之前的历史高点。
  let i0=0,i1=D.length-1;
  if(EQR.a){ while(i0<D.length-1 && D[i0]<EQR.a) i0++; }
  if(EQR.b){ while(i1>0 && D[i1]>EQR.b) i1--; }
  if(i1<i0){ i0=0; i1=D.length-1; EQR={a:null,b:null}; }
  // ★ 基点取【区间前一交易日】收盘，与收益明细里的年/月收益同口径
  //   （用区间内首日做基点会漏掉首日那根，2024 会显示 +6.52% 而不是 +8.68%）。
  //   锚点那天也画进曲线，所以起点正好落在 1x 上。
  const j0=i0>0?i0-1:i0;
  const cut=v=>v==null?null:v.slice(j0,i1+1);
  const dates=cut(D);
  const base=e.equity[j0];
  const eq=cut(e.equity).map(v=>v/base);
  let peak=0; const dd=eq.map(v=>{peak=Math.max(peak,v);return v/peak-1;});
  const ser=[{n:'策略',v:eq,c:'#5b9cf0',w:1.8}];
  if(e.benchmark){
    const bb=cut(e.benchmark), b0=bb.find(v=>v!=null);
    if(b0) ser.push({n:'基准 '+(e.benchmark_code||''),
                     v:bb.map(v=>v==null?null:v/b0),c:'#8b97a6',w:1.3});
  }
  const full=(i0===0&&i1===D.length-1);
  const ret=eq[eq.length-1]-1, mdd=Math.min(...dd);
  const yrs=[...new Set(D.map(d=>d.slice(0,4)))].sort();
  const btn=(t,a,b,on)=>`<span class="rg ${on?'on':''}" data-a="${a||''}" data-b="${b||''}">${t}</span>`;
  const last=D[D.length-1], shift=n=>{const d=new Date(last);
    d.setFullYear(d.getFullYear()-n); return d.toISOString().slice(0,10);};
  $('#p1').innerHTML=`
    <div class="rgbar">区间
      ${btn('全部','','',full)}
      ${btn('近1年',shift(1),'',!full&&EQR.a===shift(1))}
      ${btn('近3年',shift(3),'',!full&&EQR.a===shift(3))}
      ${btn('近5年',shift(5),'',!full&&EQR.a===shift(5))}
      <span class="sp"></span>
      ${yrs.map(y=>btn(y,y+'-01-01',y+'-12-31',
          EQR.a===y+'-01-01'&&EQR.b===y+'-12-31')).join('')}
      <span class="sp"></span>
      <input type="date" id="ra" value="${EQR.a||D[0]}">
      <span style="color:var(--dim)">~</span>
      <input type="date" id="rb" value="${EQR.b||last}">
      <span class="rg" id="rgo">应用</span>
    </div>
    <div class="note">显示 <b>${D[i0]} ~ ${D[i1]}</b>（${i1-i0+1} 交易日）：
      区间收益 <b class="${sign(ret)}">${_sn(ret,2)}%</b>，
      区间最大回撤 <b class="neg">${pct(-mdd,2)}</b>。
      ★ 截取区间会<b>重新归一</b>（基点 = ${j0<i0?'区间前一交易日 '+D[j0]:'首日'} 收盘 = 1x），
      回撤峰值也只在区间内累计 —— 不是把全程曲线切开看。
      与「收益明细」里的年/月收益<b>同口径</b>。</div>
    <div class="chart" id="c1"></div>
    <div class="note">纵轴为净值倍数（区间起点 1x）。${EQLOG?'当前<b>对数坐标</b>。':'当前线性坐标。'}
      基准按区间首日归一；统计卡里的基准收益以<b>回测首日前一交易日</b>收盘为基点
      （与聚宽一致），两者口径不同。</div>
    <div class="chart" id="c2"></div>`;
  lineChart($('#c1'),ser,{dates,log:EQLOG,title:'净值曲线',h:360,
    ctl:`<div class="ctl"><span class="${EQLOG?'on':''}" id="lg">对数</span><span class="${EQLOG?'':'on'}" id="ln">线性</span></div>`});
  $('#lg').onclick=()=>{EQLOG=true;paneEquity();};
  $('#ln').onclick=()=>{EQLOG=false;paneEquity();};
  lineChart($('#c2'),[{n:'回撤',v:dd.map(v=>v+1),c:'#e05b5b',w:1.4}],
    {dates,title:'回撤（水下图）',h:190,pctAxis:true});
  $('#p1').querySelectorAll('.rg[data-a]').forEach(b=>b.onclick=()=>{
    EQR={a:b.dataset.a||null,b:b.dataset.b||null}; paneEquity();});
  $('#rgo').onclick=()=>{EQR={a:$('#ra').value||null,b:$('#rb').value||null}; paneEquity();};
}

/* ============ 收益明细：年热力 → 年详情页（月热力）→ 月内日热力 ============ */
/* 数据全部来自 /api/equity 的 dates + equity ——【不需要新表】：
     · dates 本身就是交易日历，不在里面的日期即非交易日（日历格子打斜纹）
     · 日收益 = equity[i]/equity[i-1]-1，首日无前值故记 —
     · 月收益基点 = 上月最后一个交易日权益（首月退化为自身首日，与原实现一致）
     · 年收益 = 该年首末权益比；年内/月内最大回撤在各自的日线上重算 */
let YPAGE=null;                      // 年详情页的年份，null = 年度总览
let MSEL=null;                       // 年详情页里展开的月份 'YYYY-MM'
let DSEL=null;                       // 日历里选中的那一天 'YYYY-MM-DD'
let YOPEN=null;                      // 兼容旧状态位（openRun 会重置）

function _mstat(){
  const e=DATA.eq, by={}, dr={}, byY={};
  let prev=null;
  e.dates.forEach((d,i)=>{
    const k=d.slice(0,7), y=d.slice(0,4);
    if(!(k in by)) by[k]=[prev==null?e.equity[i]:prev,e.equity[i]];
    by[k][1]=e.equity[i];
    if(!(y in byY)) byY[y]=[prev==null?e.equity[i]:prev,e.equity[i]];
    byY[y][1]=e.equity[i];
    dr[d]=prev==null?null:(prev?e.equity[i]/prev-1:null);
    prev=e.equity[i];
  });
  const mv={}; Object.entries(by).forEach(([k,[a,b]])=>{mv[k]=a?b/a-1:null;});
  const yv={}; Object.entries(byY).forEach(([k,[a,b]])=>{yv[k]=a?b/a-1:null;});
  // 区间内最大回撤：在该区间【自己的日线】上重算，不是全程回撤的切片
  const dd=k=>{let pk=0,mx=0;
    e.dates.forEach((d,i)=>{ if(!d.startsWith(k)) return;
      if(e.equity[i]>pk) pk=e.equity[i];
      if(pk) mx=Math.max(mx,1-e.equity[i]/pk);});
    return mx;};
  const nd={}; e.dates.forEach(d=>{const y=d.slice(0,4),k=d.slice(0,7);
    nd[y]=(nd[y]||0)+1; nd[k]=(nd[k]||0)+1;});
  return {mv,yv,dr,dd,nd,idx:Object.fromEntries(e.dates.map((d,i)=>[d,i]))};
}

/* 底色标定（两次都翻过车，把结论写在这里）：
     · 第一版 rgba(240,91,91,.85) + 红字 -> 对比度 1.28:1，字溶进背景
     · 第二版矫枉过正，alpha 封顶 0.50 又太淡，弱格子几乎没颜色
   现在：**底色压暗但不降浓度**（168,44,44 / 24,116,82），alpha 0.15~0.88，
   强度走 sqrt 让中段更早出色。字保持中性亮色，实测对比度：
     最弱格 12.6:1、中段 7.5~8.6:1、最强格 6.2:1(红) / 5.2:1(绿)
   —— 全部 >= WCAG AA 4.5，多数 >= AAA 7。 */
const _hcol=(v,k)=>{
  if(v==null) return 'transparent';
  const t=Math.min(1,Math.abs(v)*(k||3));
  const a=(0.15+Math.sqrt(t)*0.73).toFixed(3);
  return v>0?`rgba(168,44,44,${a})`:`rgba(24,116,82,${a})`;
};
/* 强度弱的格子底色近乎透明，方向全靠这个 +/- 号 —— 不能省 */
const _sn=(v,d)=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(d);
const _yhash=y=>'#/run/'+encodeURIComponent(CUR)+'/y/'+y;

function paneMonthly(){ YPAGE?paneYear():paneYears(); }

/* ---- 第一层：年度热力 ---- */

     可继续下钻到月、到日。</div>
   <div class="hm y">${ys.map(y=>{const v=S.yv[y];
     return `<div class="hc" data-y="${y}" style="background:${_hcol(v)}">
       <div class="k">${y}</div>
       <div class="v">${_sn(v,1)}%</div>
       <div class="n">回撤 ${pct(S.dd(y),1)} · ${S.nd[y]} 日</div></div>`;}).join('')}</div>
   ${_legend()}`;
  $('#p2').querySelectorAll('.hc').forEach(c=>c.onclick=()=>{location.hash=_yhash(c.dataset.y);});

     ${card('交易日',S.nd[y])}

   </div>
   <h3 class="sec">${y} 年 · 月度热力<span style="float:right;font-weight:400;color:var(--dim)">

   <div class="hm m">${[...Array(12)].map((_,i)=>{
     const k=y+'-'+String(i+1).padStart(2,'0'), v=S.mv[k];

/* ---- 第三层：月内日热力（自然日历，非交易日打斜纹）---- */
function drawCal(S){
  const box=$('#cal'); if(!box) return;
  if(!MSEL){box.innerHTML='';return;}
  const [Y,M]=MSEL.split('-').map(Number);
  const first=new Date(Date.UTC(Y,M-1,1)), ndays=new Date(Date.UTC(Y,M,0)).getUTCDate();
  const lead=(first.getUTCDay()+6)%7;          // 周一为第一列
  const e=DATA.eq;
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cd pad"></div>';
  let nt=0,ntd=0,best=null,worst=null;
  for(let d=1;d<=ndays;d++){
    const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const i=S.idx[ds];
    if(i===undefined){cells+=`<div class="cd off"><div class="d">${d}</div></div>`;nt++;continue;}
    ntd++;
    const v=S.dr[ds];
    if(v!=null){ if(best==null||v>best[1])best=[ds,v]; if(worst==null||v<worst[1])worst=[ds,v]; }
    const pos=e.cash_pct?(1-e.cash_pct[i]):null;
    cells+=`<div class="cd ${DSEL===ds?'on':''}" data-d="${ds}"
      style="background:${_hcol(v,12)}"
      title="${ds}  ${v==null?'首日无前值':'日收益 '+pct(v,2)}
仓位 ${pos==null?'—':pct(pos,1)}   持仓 ${e.n_positions?e.n_positions[i]:'—'} 只
点击看当日持仓与买卖">
      <div class="d">${d}</div>
      <div class="v">${_sn(v,2)}</div></div>`;
  }
  box.innerHTML=`<h3 class="sec">${Y} 年 ${M} 月 · 日热力
     <span style="float:right;font-weight:400">交易日 ${ntd} 天 / 非交易日 ${nt} 天
     ${best?`　最好 ${best[0].slice(8)}日 <span class="pos">${pct(best[1],2)}</span>`:''}
     ${worst?`　最差 ${worst[0].slice(8)}日 <span class="neg">${pct(worst[1],2)}</span>`:''}
     </span></h3>
   <div class="calg">${['一','二','三','四','五','六','日']
     .map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>`;
  box.querySelectorAll('.cd[data-d]').forEach(c=>c.onclick=()=>{
    DSEL=(DSEL===c.dataset.d)?null:c.dataset.d;
    box.querySelectorAll('.cd').forEach(x=>x.classList.toggle('on',x.dataset.d===DSEL));
    drawDay(S);});
  drawDay(S);
}

function _legend(){
  const mk=v=>`<i style="background:${_hcol(v)}"></i>`;
  return `<div class="lgd">跌 ${[-.25,-.12,-.05,-.01].map(mk).join('')}
    <i style="background:transparent"></i>${[.01,.05,.12,.25].map(mk).join('')} 涨
    <span style="margin-left:10px">底色只表示方向与强度，正负看数字前的 +/- 号</span></div>`;
}

  tbl($('#d_buy'),o.buys,[
    {k:'code',t:'标的',l:1,f:(v,r)=>nm(r)},

    {k:'ret',t:'该笔最终',s:1,f:v=>_sn(v,2)+'%'},
  ],'当日买入 '+o.buys.length+' 笔'+(o.buys.length?
      '　（后两列是这笔【整笔】的最终结果，不是当日收益）':'（无）'));
  tbl($('#d_hold'),o.holdings,[
    {k:'code',t:'标的',l:1,f:(v,r)=>nm(r)},
    {k:'weight',t:'权重',f:v=>pct(v,1)},
    {k:'value',t:'市值',f:v=>money(v)},
    {k:'shares',t:'股数',f:v=>money(v)},
    {k:'entry_date',t:'建仓日'},
    {k:'entry_price',t:'建仓价',f:px},
    {k:'last_price',t:'现价',f:px},
    {k:'unrealized_ret',t:'浮盈',s:1,f:v=>_sn(v,2)+'%'},
    {k:'unrealized_pnl',t:'浮盈额',s:1,f:v=>money(v)},
  ],'收盘持仓 '+o.holdings.length+' 只');
}

/* ============ 通用表格（可排序） ============ */
/* opt.group: 按该列分组，值变化时插一条粘性分隔行（同组行必须相邻，由后端排序保证）。
   opt.groupNote(rows) 给分隔行右侧加汇总。点列头排序会打散分组，此时自动关掉分隔行。 */
function tbl(el,rows,cols,note,opt){
  opt=opt||{};
  if(!rows.length){el.innerHTML=(note?`<div class="note">${note}</div>`:'')+
    '<div class="note">无数据</div>';return;}
  let sk=null,sd=-1;
  const body=rs=>{
    let out='',last=null;
    const grp=opt.group&&!sk;   // 排序后分组无意义（同组行不再相邻）
    rs.forEach(r=>{
      if(grp&&r[opt.group]!==last){
        last=r[opt.group];
        const same=rs.filter(x=>x[opt.group]===last);
        out+=`<tr class="dayhd"><td colspan="${cols.length}">${last}`+
             `<span>${opt.groupNote?opt.groupNote(same):same.length+' 只'}</span></td></tr>`;
      }
      out+='<tr>'+cols.map(c=>{const v=r[c.k];
        const f=c.f?c.f(v,r):(v==null?'—':v);
        return `<td class="${c.l?'l':''} ${c.s?sign(v):''}">${f}</td>`;}).join('')+'</tr>';
    });
    return out;
  };
  const draw=()=>{
    let rs=rows.slice();
    if(sk) rs.sort((a,b)=>{const x=a[sk],y=b[sk];
      if(x==null)return 1; if(y==null)return -1;
      return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sd;});
    el.innerHTML=(note?`<div class="note">${note}</div>`:'')+
     `<div class="tw"><table><thead><tr>${cols.map(c=>
        `<th data-k="${c.k}" class="${c.l?'l':''}">${c.t}${sk===c.k?(sd>0?' ▲':' ▼'):''}</th>`).join('')}
      </tr></thead><tbody>${body(rs)}</tbody></table></div>`;
    el.querySelectorAll('th').forEach(t=>t.onclick=()=>{
      const k=t.dataset.k; sd=(sk===k)?-sd:-1; sk=k; draw();});
    // 日期分隔行要贴在表头【下方】，而表头高度取决于字号/padding/浏览器 ——
    // 与其估一个 px 值（估错就会重叠或留缝），渲染后量出来写进 CSS 变量。
    const th=el.querySelector('th');
    if(th) el.querySelector('.tw').style.setProperty('--thh',
      Math.round(th.getBoundingClientRect().height)+'px');
  };
  draw();
}

}
async function paneHoldings(){
  const h=await j(`/api/holdings?id=${CUR}&offset=${HD.off}&limit=${HD.lim}`);
  const pg=Math.floor(h.off===undefined?HD.off/HD.lim:h.offset/h.limit)+1;
  const np=Math.max(1,Math.ceil(h.total/h.limit));
  // ★ 上下两套导航用 class 而不是 id —— 先前用 id="p*" 正则替换成 id="b*" 生成底部
  //   一份，选择器却按 '#'+p+id.slice(1) 拼出 '#bpf'（真实 id 是 '#bf'），
  //   底部按钮全都绑不上事件。class + querySelectorAll 没有这种拼接歧义。
  const nav=`<div class="pg">
     <button class="pf" ${pg<=1?'disabled':''}>« 首页</button>
     <button class="pp" ${pg<=1?'disabled':''}>‹ 上一页</button>
     <span>第 <input class="pi" value="${pg}"> / ${np} 页</span>
     <button class="pn" ${pg>=np?'disabled':''}>下一页 ›</button>
     <button class="pl" ${pg>=np?'disabled':''}>末页 »</button>
     <span style="margin-left:10px">每页
       <select class="ps">${[50,100,200].map(x=>
         `<option ${x===h.limit?'selected':''}>${x}</option>`).join('')}</select> 条</span>
     <span style="margin-left:10px">共 ${h.total.toLocaleString()} 条 /
       ${h.n_days.toLocaleString()} 个交易日</span></div>`;
  $('#p4').innerHTML=`<div class="note">逐日持仓快照，<b>按日期倒序</b>（最近的在前），
     同日内按权重降序。份额是<b>后复权记账单位</b>，真实股数 = 份额 × 当日复权因子。
     点列头排序会打散日期分块（同组行不再相邻）。</div>
     ${nav}<div id="hdt"></div>${nav}`;
  tbl($('#hdt'),h.rows,[
    {k:'code',t:'股票',l:1,f:nmcode},{k:'weight',t:'权重',f:v=>pct(v,2)},
    {k:'value',t:'市值',f:v=>v==null?'—':(+v).toFixed(0)},
    {k:'shares',t:'份额(后复权)',f:v=>fmtN(v,1)},
    {k:'last_price',t:'现价',f:v=>fmtN(v,3)},
    {k:'entry_date',t:'建仓日',l:1},{k:'entry_price',t:'建仓价',f:v=>fmtN(v,3)},
    {k:'unrealized_ret',t:'浮动收益',f:v=>pct(v,2),s:1},
    {k:'unrealized_pnl',t:'浮动盈亏',f:v=>v==null?'—':(+v).toFixed(0),s:1},
    {k:'div_gross',t:'累计分红',f:v=>fmtN(v,0)},
  ],null,{group:'date',groupNote:rs=>{
    const mv=rs.reduce((a,r)=>a+(r.value||0),0);
    const w=rs.reduce((a,r)=>a+(r.weight||0),0);
    return `${rs.length} 只 · 市值 ${mv.toLocaleString('en',{maximumFractionDigits:0})} · 仓位 ${(w*100).toFixed(1)}%`;}});
  const go=o=>{HD.off=Math.max(0,Math.min(o,(np-1)*HD.lim));paneHoldings();};
  const on=(cls,fn,ev)=>document.querySelectorAll('#p4 .'+cls)
      .forEach(e=>e[ev||'onclick']=fn);
  on('pf',()=>go(0)); on('pp',()=>go(HD.off-HD.lim));
  on('pn',()=>go(HD.off+HD.lim)); on('pl',()=>go((np-1)*HD.lim));
  on('ps',e=>{HD.lim=+e.target.value;HD.off=0;paneHoldings();},'onchange');
  on('pi',e=>go((Math.max(1,+e.target.value)-1)*HD.lim),'onchange');
}

    ['策略路径',m.strategy_path],['代码 SHA256',m.code_sha256],
