<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>因子广场 · assay</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared/common.css">
<div id="app">
  <div id="top"></div>
  <div class="page" id="pg"></div>
</div>
<div id="tip"></div>
<script src="/shared/common.js"></script>
<script src="/shared/chart.js"></script>
<script src="/shared/kchart.js"></script>
<script src="/shared/stockpop.js"></script>
<script>
/* ============ 因子广场 ============
   回答三件事：都有哪些因子、每个的效果怎么样、它是怎么算的。

   🔴 整页照【服务端】那份清单渲染（/api/factors/meta 给区间 / 前瞻 / 族，
     /api/factors 给行）—— 页面里没有任何一个因子名、也没有任何一个区间。
     所以加一个因子（datalake/build/factors/ 注册一条 Spec），广场上自动就有，
     而前端硬编码一份的话新因子页面上不会出现，**而那不报错**
     （同「加一个指标，广场上自动就有」「/api/sector/kinds 说有几类」那两条）。

   🔴 它是【回测域的子页】—— 顶栏点亮「📚 回测」而不单占一个入口：
     因子是做策略时用的，看盘用的是「📊 指标广场」。两者互相有交叉链接，
     且各自说清「我不是另一个」—— 名字太像，不说的话人会以为走错了地方。

   🔴 三条口径（caveats）由服务端给并【原样印出来】：这一页每个数都带着
     "不是可实现收益 / 超额基准是等权平均 / t 值重叠虚高"三个前提，
     不写出来的话人会拿这里的 −19.86% 去跟别处的数比大小
     （同「别人的『股息率』里藏着别人的窗口与去重规则」）。

   命名：顶层一律 FAC / fac 前缀（FQ 已被个股页的复权口径占用）。
*/

// ---- 列定义写【一处】：表头 / 排序 / 单元格都读它 ----------------
// 分三处写迟早"表头 8 列配 9 个数据"，而那不报错、只是整表错位一格
//（同 LVPOS_COLS / COLS 那两条）。
// 顺序按用户给的那串来：超额 -> 换手 -> IC -> IR。better 是"哪边更好"，
// 换列排序时默认方向照它给 —— 一律降序会把最差的排最前面。
const FCOL = [
  {k:'name_cn',     t:'因子',            tx:1, srt:0},
  {k:'q_lo_ex_ann', t:'最小分位超额年化', better:'hi', f:v=>facPct(v), col:1,
   h:'最小分位（因子值最低的那 10%）相对当日横截面等权平均的超额，折年化'},
  {k:'q_hi_ex_ann', t:'最大分位超额年化', better:'hi', f:v=>facPct(v), col:1,
   h:'最大分位（因子值最高的那 10%）相对当日横截面等权平均的超额，折年化'},
  {k:'to_lo',       t:'最小分位换手',     better:'lo', f:v=>pct(v,1),
   h:'每 h 个交易日调一次仓，相邻两次该分位成分变了百分之几。越高交易成本越大'},
  {k:'to_hi',       t:'最大分位换手',     better:'lo', f:v=>pct(v,1),
   h:'同上，最大分位'},
  {k:'ic',          t:'IC 均值',          better:'abs', f:v=>fmtN(v,4), col:1,
   h:'每日因子值与前瞻收益的横截面 Spearman 秩相关，取区间均值。绝对值越大越有预测力'},
  {k:'ir',          t:'IR',               better:'abs', f:v=>fmtN(v,3), col:1,
   h:'IC 均值 / IC 标准差 —— 预测力的稳定程度'},
  {k:'t_adj',       t:'t（折过）',         better:'abs', f:v=>fmtN(v,2), col:1,
   h:'IC 的 t 值，已按 N/h 折掉重叠窗口的虚高；它仍偏乐观，别当显著性用'},
];

let FACM = null;      // 服务端给的可选项与口径
let FACR = [];        // 当前这一份行
let FACS = {k:'t_adj', d:-1};   // 排序：默认按 |t| 降序（与服务端一致）

const facPct = v => v == null ? '—'
  : (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';

// ---- URL 就是状态：这一页的地址是拿去分享的 -----------------------
const facQ = k => qs(k) || '';
function facNav(kv) {
  const u = new URL(location.href);
  for (const k in kv) {
    const v = kv[k];
    if (v === '' || v == null) u.searchParams.delete(k);
    else u.searchParams.set(k, v);
  }
  location.href = u.pathname + u.search;
}

// ================= 入口 =================
async function facBoot() {
  const id = facQ('id'), ms = facQ('missing');
  pageHead('runs', ms ? '🧪 算不出来的因子' : id ? '🧪 因子详情' : '🧪 因子广场');
  try { FACM = await j('/api/factors/meta'); }
  catch (e) { $('#pg').innerHTML = '<div class="warn">取不到因子目录：'
    + esc(String(e)) + '<br>还没算过的话先跑一次 python3 assay/factor_eval.py</div>';
    return; }
  if (ms) facMissing(); else if (id) facDetail(id); else facList();
}

// ================= 算不出来的那些 =================
/* 🔴 原清单 278 个名字，广场只列得出有值的那 161 个 —— 剩下 117 个此前
   **在页面上根本不存在**。而"查不到"与"本地根本算不了"在屏幕上长得一模一样
   （同「删了要留痕，否则空与本来就没有分不出来」那条）。

   🔴🔴 **两档必须分开说**：no_data / calib_failed / no_spec / ambiguous /
   sparse / const_undef 是【做不了或要先定案】；todo 是【可复现、只是还没写】。
   揉成一句"暂时无法计算"的话，65 个只差有人去写的因子会被读成"这东西算不了"。
   分档由**服务端**给（`blocked`），页面不认识任何一个原因 key ——
   加一档原因，这一页自动就有（同「整页照服务端清单渲染」）。 */
let FACMS = null;

async function facMissing() {
  $('#pg').innerHTML = '<h2>🧪 算不出来的因子</h2><div class="note">读取中…</div>';
  try { FACMS = await j('/api/factors/missing'); }
  catch (e) { $('#pg').innerHTML = '<div class="warn">取不到：' + esc(String(e)) + '</div>'; return; }
  facMsRender();
}

function facMsRender() {
  const o = FACMS, back = '/factors.html?win=' + encodeURIComponent(facWin()) +
    '&h=' + encodeURIComponent(facH());
  if (!o.n) {
    $('#pg').innerHTML = '<h2>🧪 算不出来的因子</h2><div class="warn">' +
      esc(o.why_empty || '这份清单还没建出来') + '</div>' +
      '<div class="lvtags"><a class="btn" href="' + back + '">‹ 回因子广场</a></div>';
    return;
  }
  const q = facQ('q').trim().toLowerCase();
  const hit = r => !q || ((r.name_cn || '') + ' ' + (r.detail || '') + ' ' +
    (r.reason_cn || '')).toLowerCase().includes(q);

  let body = '';
  let shown = 0;
  o.reasons.forEach(g => {
    const rows = o.rows.filter(r => r.reason_key === g.key && hit(r));
    if (!rows.length) return;
    shown += rows.length;
    body += '<tr class="grp"><td colspan="2"><span class="gb">' +
      '<span class="' + (g.blocked ? 'mblk' : 'mtodo') + '">' +
      (g.blocked ? '做不了 / 要先定案' : '还没做') + '</span> · ' +
      esc(g.label) + '　<span class="dim">' + rows.length +
      (rows.length === g.n ? '' : ' / ' + g.n) + ' 个</span>' +
      '<span class="gwhy">' + esc(g.why) + '</span></span></td></tr>';
    // 行号与「手工加的」都是**名称后面的小字注解**，与 cnCell 的代码
    // 同一件事，所以用同一个 `.cd`（2026-09-24 那次改名之后它才是干净的：
    // 在那之前日历格子也叫 .cd，把边框与手型光标加到了它身上）。
    body += rows.map(r => '<tr><td class="tx">' + esc(r.name_cn) +
      (r.src_row ? '<span class="cd">原清单第 ' + r.src_row + ' 行</span>' : '') +
      (r.source === 'manual' ? '<span class="cd">手工加的</span>' : '') +
      // 空着 = 组头那句话就是全部原因。填一句"按上面那条"的话，
      // 117 行里有 100 行是同一句废话，真正有补充的那 17 条反而被淹没
      '</td><td class="tx">' + (r.detail ? esc(r.detail) : '') +
      // 🔴 **只有手工那条给删除**：注册表里的是代码，页面删不动 ——
      //   摆一个点了必然报错的 × 在那儿，比不摆更糟（同 backLink 那条）。
      (r.source === 'manual'
        ? ' <a href="#" class="mdel" data-n="' + esc(r.name_cn) +
          '" title="从手工清单里删掉（账本 append-only，删的是一条 remove）">×</a>'
        : '') +
      '</td></tr>').join('');
  });

  $('#pg').innerHTML = '<h2>🧪 算不出来的因子</h2>' +
    '<div class="lvtags"><a class="btn" href="' + back + '">‹ 回因子广场</a>' +
    '<span class="lvtag">做不了 / 要先定案 <b>' + o.n_blocked + '</b></span>' +
    '<span class="lvtag">只是还没写 <b>' + o.n_todo + '</b></span>' +
    '<input id="facq" class="fq" placeholder="搜名称 / 原因" value="' +
      esc(facQ('q')) + '" style="width:190px">' +
    (FACMF ? '' : '<a href="#" class="btn" id="mfopen">+ 手工加一条</a>') +
    '</div>' +
    '<div class="note">' + esc(o.note) + '</div>' +
    '<div class="note">' + esc(o.todo_note) + '</div>' +
    '<div class="note">右边那一列<b>空着</b>表示：上面那条带子里的原因' +
    '就是全部原因，这一条没有额外的话要说。</div>' +
    facMsForm() +
    (shown ? '<div class="pw"><table class="lvt"><thead><tr>' +
      '<th class="tx">因子（原清单里的名字）</th>' +
      '<th class="tx" title="只列【这一条特有的】补充；空着表示' +
      '上面那条带子里的原因就是全部原因">这一条特有的补充</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>'
    : '<div class="note">没有匹配「' + esc(q) + '」的。</div>') +
    '<div class="note">上面带「手工加的」标记的那些在 ' +
    '<code>live/factor_missing.jsonl</code>（append-only，删一条是追加一条' +
    ' remove）；其余是注册表里的，<b>页面删不动</b> —— 要让它从这份清单里' +
    '消失，只有去 <code>datalake/build/factors/</code> 写一条 Spec。' +
    '两者是同一份名单的两半，建目录表时有覆盖自证（必须正好分完原清单，' +
    '不重不漏，不过就拒绝写出）。</div>' +
    (o.warn ? '<div class="warn">' + esc(o.warn) + '</div>' : '');

  const qi = $('#facq');
  if (qi) {
    let t = null;
    qi.oninput = () => { clearTimeout(t); t = setTimeout(() => facNav({q: qi.value.trim()}), 300); };
    qi.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(t); facNav({q: qi.value.trim()}); } };
  }
  facMsWire();
}

/* ---- 手工加一条 --------------------------------------------------
   🔴 表单**默认折起**：它有三个输入框，常驻会把这一页撑满，而"看清单"
     才是天天要做的事（同「+ 新增费率」那条）。
   🔴 原因下拉**照服务端那份全量原因表**渲染（含一条因子都没有的档）——
     照"清单里出现过的"去拼的话，某一档被实现光了它就静默从下拉里消失。
   ★ 按钮**一律不设 disabled**：只读模式下照样可点，点了把原因和下一步
     说清楚（disabled 的元素连 title 都不触发）。 */
let FACMF = false;

function facMsForm() {
  const o = FACMS;
  if (!FACMF) return '';   // 折起时只有顶上那排里的按钮，见 facMsRender
  const opt = (o.options || []).map(r =>
    '<option value="' + esc(r.key) + '">' +
    (r.blocked ? '做不了 / 要先定案' : '还没做') + ' · ' + esc(r.label) +
    '（现有 ' + r.n + ' 个）</option>').join('');
  return '<div class="lvsec" id="mform"><h3>手工加一条</h3>' +
    '<div class="note">原清单里没有、但你想记下来的因子 —— 记进 ' +
    '<code>live/factor_missing.jsonl</code>（append-only）。' +
    (o.can_write ? '' : '　🔴 服务是 <b>--readonly</b> 起的，加不进去：' +
      '去掉那个参数重启一次。') + '</div>' +
    '<div class="lvtags" style="flex-wrap:wrap;gap:10px">' +
    '<label>因子名 <input id="mfn" class="fq" style="width:210px" ' +
      'placeholder="原清单里的名字，或你自己起的"></label>' +
    '<label>为什么算不出来 <select id="mfr" class="fsel">' + opt + '</select></label>' +
    '<label style="flex:1;min-width:260px">这一条特有的补充 ' +
      '<input id="mfd" class="fq" style="width:100%" ' +
      'placeholder="缺哪个数据 / 哪一步没定案 —— 只有名字的话，这份清单等于没说为什么"></label>' +
    '<a href="#" class="btn" id="mfok">加进清单</a>' +
    '<a href="#" class="lvtag" id="mfno">取消</a>' +
    '</div><div class="note" id="mfmsg"></div></div>';
}

function facMsWire() {
  const open = $('#mfopen');
  if (open) open.onclick = e => { e.preventDefault(); FACMF = true; facMsRender(); };
  const no = $('#mfno');
  if (no) no.onclick = e => { e.preventDefault(); FACMF = false; facMsRender(); };
  const ok = $('#mfok');
  if (ok) ok.onclick = async e => {
    e.preventDefault();
    const msg = $('#mfmsg');
    msg.className = 'note';
    msg.textContent = '提交中…';
    const r = await facMsPost({act: 'add', name: $('#mfn').value,
      reason: $('#mfr').value, detail: $('#mfd').value});
    if (r) { FACMF = false; FACMS = r; facMsRender(); }
  };
  $('#pg').querySelectorAll('a.mdel').forEach(a => {
    a.onclick = async e => {
      e.preventDefault();
      const n = a.dataset.n;
      if (!confirm('把「' + n + '」从手工清单里删掉？\n\n' +
                   '账本是 append-only 的 —— 删的是追加一条 remove，' +
                   '原来那条记录还在日志里。')) return;
      const r = await facMsPost({act: 'remove', name: n});
      if (r) { FACMS = r; facMsRender(); }
    };
  });
}

async function facMsPost(b) {
  let r;
  try { r = await post('/api/factors/missing', b); }
  catch (e) { r = {error: String(e)}; }
  if (r && r.error) {
    // 🔴 报错要留在表单旁边 —— 扔到页面别处去的话，人盯着输入框却看不到
    //   为什么被退回来（同「参数校验的提示挪进弹窗内部」那条）
    const m = $('#mfmsg');
    if (m) { m.className = 'warn'; m.textContent = r.error; }
    else alert(r.error);
    return null;
  }
  return r;
}

// 「算不出来的」那一页的地址（带着当前区间/前瞻，回来时还在原处）
function facMsHref() {
  return '/factors.html?missing=1' + facCtx();
}

// ================= 列表 =================
function facWin() { return facQ('win') || '1y'; }
function facH()   { return facQ('h') || '20'; }
function facPool(){ return facQ('pool') || 'all'; }
// 详情页 / 返回链接都要带着当前池子 —— 不带的话点进去看的是另一个池的数，
// 而屏幕上两个池长得一模一样（同「⚖ 拉去对比要带着当前这只票过去」）
function facCtx() {
  return '&h=' + encodeURIComponent(facH()) + '&win=' + encodeURIComponent(facWin()) +
         (facPool() === 'all' ? '' : '&pool=' + encodeURIComponent(facPool()));
}
// 这个池的口径（分几组 / 当日最少几只）—— 由服务端给，页面不写死
function facPm() {
  return (FACM.pools || []).find(x => x.key === facPool()) || {key:'all', label:'全市场', nq:10};
}

function facBarHtml() {
  const w = facWin(), h = facH(), g = facQ('group'), ab = facQ('abs');
  const wins = FACM.windows.map(x =>
    '<a href="#" class="lvtag rg' + (x.k === w ? ' on' : '') +
    '" data-nav="win" data-v="' + esc(x.k) + '">' + esc(x.label) + '</a>').join('');
  const hs = FACM.horizons.map(x =>
    '<a href="#" class="lvtag rg' + (String(x) === h ? ' on' : '') +
    '" data-nav="h" data-v="' + x + '">' + x + ' 日</a>').join('');
  // 🔴 池子清单**照服务端给的那份**渲染，页面里没有任何一个池子名 ——
  //   加一个池子广场上自动就有（同「加一个指标广场上自动就有」）。
  //   没算过的**不藏起来**，标出来并说为什么（同「算不出来的要有名有姓」）。
  const ps = (FACM.pools || []).map(x =>
    '<option value="' + esc(x.key) + '"' + (x.key === facPool() ? ' selected' : '') +
    '>' + esc(x.label) + (x.ready ? '' : '（还没算）') + '</option>').join('');
  const gs = ['<option value="">全部族（' + FACM.n_factors + ' 个因子）</option>']
    .concat(FACM.groups.map(x => '<option value="' + esc(x.group_key) + '"' +
      (x.group_key === g ? ' selected' : '') + '>' + esc(x.group_cn) +
      '（' + x.n + '）</option>')).join('');
  return '<div class="lvtags" style="gap:14px;flex-wrap:wrap;align-items:center">' +
    '<span><b class="dim">池子</b> <select id="facp" class="fsel">' + ps + '</select></span>' +
    '<span><b class="dim">看多久</b> ' + wins + '</span>' +
    '<span><b class="dim">前瞻</b> ' + hs + '</span>' +
    '<select id="facg" class="fsel">' + gs + '</select>' +
    '<input id="facq" class="fq" placeholder="搜名称 / 编码 / 公式" value="' +
      esc(facQ('q')) + '" style="width:190px">' +
    '<label style="cursor:pointer"><input type="checkbox" id="facab"' +
      (ab ? ' checked' : '') + '> 含量纲不可比的</label>' +
    '</div>';
}

function facSortRows() {
  const c = FCOL.find(x => x.k === FACS.k) || FCOL[0];
  const rows = FACR.slice();
  rows.sort((a, b) => {
    let x = a[c.k], y = b[c.k];
    if (c.better === 'abs') { x = x == null ? null : Math.abs(x);
                              y = y == null ? null : Math.abs(y); }
    // null 一律排最后（不管升降序）—— 当 0 参与排序的话它会混在正负之间，
    // 看着像"这个因子不好不坏"，而事实是【没有数据】（同 LVSORT 那条）
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    if (typeof x === 'string') return FACS.d * x.localeCompare(y);
    return FACS.d * (x - y);
  });
  return rows;
}

function facTable() {
  const rows = facSortRows();
  const th = FCOL.map(c => {
    const on = FACS.k === c.k;
    return '<th class="' + (c.tx ? 'tx' : 'rt') + (c.srt === 0 ? '' : ' srt') +
      '" data-k="' + c.k + '"' + (c.h ? ' title="' + esc(c.h) + '"' : '') + '>' +
      esc(c.t) + (on ? (FACS.d < 0 ? ' ↓' : ' ↑') : '') + '</th>';
  }).join('');
  const tr = rows.map(r => '<tr>' + FCOL.map(c => {
    if (c.k === 'name_cn') return '<td class="tx">' + facName(r) + '</td>';
    const v = r[c.k];
    const sty = c.col && v != null ? ' style="color:' + upc(v) + '"' : '';
    return '<td class="rt"' + sty + '>' + c.f(v) + '</td>';
  }).join('') + '</tr>').join('');
  return '<div class="pw"><table class="lvt"><thead><tr>' + th +
    '</tr></thead><tbody>' + tr + '</tbody></table></div>';
}

// 名称 + 小字编码放同一格（同 cnCell 那条：名称是人扫的，编码是机读的），
// 两者【都】可点 —— 只有编码可点的话，习惯认名字的人会以为不能点
function facName(r) {
  const u = '/factors.html?id=' + encodeURIComponent(r.factor_id) + facCtx();
  return '<a href="' + u + '">' + esc(r.name_cn || r.factor_id) + '</a>' +
    '<span class="cd"><a href="' + u + '">' + esc(r.factor_id) + '</a>' +
    ' · ' + esc(r.group_cn || '') +
    (r.xs_comparable ? '' : ' · <span class="warn2">量纲</span>') +
    (r.src_dup ? ' · <span class="dim" title="与另一个因子秩相关 >= 0.999，' +
      '多半是同一件事的两种写法">近似重复</span>' : '') +
    // 🔴 当日不同取值 < 分位数 -> 分位切点整个落在并列里，"最小分位超额"
    //   与"换手"**不是有意义的数**（实测 aroon_up 某日 5092 行只有 26 个
    //   取值、56% 都是 0.0）。不标的话那几行看着和别的一样可信。
    (r.nuniq != null && r.nuniq < facPm().nq
      ? ' · <span class="warn2" title="当日只有 ' + r.nuniq + ' 个不同取值，' +
        '少于 ' + facPm().nq + ' 个分位 —— 切点整个落在并列里，' +
        '分位收益与换手不是有意义的数（按代码定序只是让它可复现，不是让它对）"' +
        '>并列</span>' : '') + '</span>';
}

// 三条口径原样印出来（服务端给），不是我这儿编的
function facCaveats() {
  // 🔴 t 那一列光靠列头的 tooltip 说不清 —— 用户直接问了「最后一列的 t
  //   是什么意思」，那就是"不自我解释"的证据。而且**这张表默认按 |t| 排序**，
  //   页面上原本一个字都没说（同「人自己数出来的数字不带口径，页面印出来的
  //   可以带」那条）。
  return '<div class="lvsec"><h3>怎么读这几个数</h3><ul class="note">' +
    '<li><b>IC 均值</b>：每日「因子值 vs 未来收益」的横截面秩相关，取区间平均。' +
    '正 = 因子值越大未来收益越高；负 = 反向因子。绝对值越大越有预测力。</li>' +
    '<li><b>IR</b> = IC 均值 ÷ IC 标准差 —— 预测力<b>稳不稳</b>，' +
    '而不是有多强。</li>' +
    '<li><b>t（折过）</b> = IR × √(有效样本数)，回答「这个因子的 IC ' +
    '<b>稳定地不是 0</b> 吗」。“折过”折的是<b>重叠窗口</b>：前瞻 20 日时' +
    '今天算 t→t+20、明天算 t+1→t+21，共用 19 天的未来收益，' +
    'N 个交易日并不是 N 个独立样本 —— 有效样本按 N ÷ 前瞻天数折，' +
    '不折的话 t 会虚高约 √20 ≈ 4.5 倍。' +
    '🔴 它<b>仍然偏乐观</b>（粗校正，不是 Newey-West），' +
    '所以只用来<b>排除</b>连粗校正都过不了的，<b>不用来"证明"什么</b>。' +
    '前瞻 1 日不重叠，折不折一样。<b>这张表默认就按 |t| 降序排。</b></li>' +
    FACM.caveats.map(x => '<li>' + esc(x) + '</li>').join('') +
    '<li>股票池：' + esc(FACM.pool) + '</li>' +
    (function () {
      const pm = facPm();
      if (pm.key === 'all') return '';
      // 🔴 小池子的分位数不一样（成分太少，照 10 组切每组只有几只），
      //   必须**响亮地说出来** —— 不说的话两个池的"最小分位超额"摆在
      //   一起看着可比，而它们不是（同「口径不一致要响亮地说出来」）。
      return '<li>当前池子：<b>' + esc(pm.label) + '</b>，' +
        '成分按<b>两步 ASOF</b> 的 PIT 语义取自面板' +
        (pm.nq !== 10 ? '；🔴 这个池分 <b>' + pm.nq + '</b> 组、当日最少 <b>' +
          pm.min_xs + '</b> 只（不是 10 组 / 100 只）—— 成分太少，' +
          '照 10 组切每组只有几只，分位收益是噪声。' +
          '<b>它的分位数与别的池不可直接比大小</b>' : '') + '</li>';
    })() +
    '<li>超额的基准：' + esc(FACM.excess_base) + '</li>' +
    '<li>前瞻收益：' + esc(FACM.fwd) + '</li>' +
    '<li>换手：' + esc(FACM.turnover) + '</li>' +
    '</ul></div>';
}

function facWire() {
  // 事件委托挂在 #pg 上 —— 这一整块是 innerHTML 填进去的，
  // 逐个绑的话换一次就没有 handler 了（点了没反应，且不报错）
  $('#pg').onclick = e => {
    const a = e.target.closest('a[data-nav]');
    if (a) { e.preventDefault(); facNav({[a.dataset.nav]: a.dataset.v}); return; }
    const th = e.target.closest('th.srt');
    if (th) {
      const c = FCOL.find(x => x.k === th.dataset.k);
      if (!c) return;
      // 换列时默认方向按【哪边更好】给 —— 一律升序会把最差的排最前面
      if (FACS.k === c.k) FACS.d = -FACS.d;
      else { FACS.k = c.k; FACS.d = c.better === 'lo' ? 1 : -1; }
      $('#pg').querySelector('.pw').outerHTML = facTable();
      facWire();
    }
  };
  // 🔴 换池子要**回到第一屏的排序**吗？不 —— 排序是"我现在想看什么"，
  //   池子变了那个诉求没变。但 `q`（搜索）保留、`group` 保留：它们是
  //   "我在找哪一类"，跨池仍然成立。
  const pp = $('#facp'); if (pp) pp.onchange = () => facNav({pool: pp.value});
  const g = $('#facg'); if (g) g.onchange = () => facNav({group: g.value});
  const ab = $('#facab'); if (ab) ab.onchange = () => facNav({abs: ab.checked ? 1 : ''});
  const q = $('#facq');
  if (q) {
    let t = null;
    q.oninput = () => { clearTimeout(t); t = setTimeout(() => facNav({q: q.value.trim()}), 300); };
    q.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(t); facNav({q: q.value.trim()}); } };
  }
}

/* ---------------- 详情页那六张图（2026-09-25） ----------------
   与 /api/factor 分开取：那一发一回来表格就能画，而这六块要现算
   （单因子约 6 秒，之后走缓存）。先把表格给人看，别一起等。 */
let FACCH = null, FACLOG = 0, FACALLQ = 1;

/* 分位配色：小 -> 大 走 红 -> 绿。基准单独一个中性色。
   ★ 不用 upc()：那是"涨绿跌红"的语义，而这里的颜色表示的是【第几个分位】。 */
function facQcol(q, nq) {
  if (q === 0) return '#7d8596';   /* 基准：中性灰蓝，不落在红-绿那条带上 */
  return 'hsl(' + Math.round(0 + 132 * (q - 1) / Math.max(1, nq - 1)) + ',62%,46%)';
}

async function facCharts(id) {
  const el = $('#facch');
  if (!el) return;
  el.innerHTML = '<div class="lvsec"><div class="note">这几张图要现算 ' +
    '（单因子约 6 秒，之后走缓存）…</div></div>';
  let o;
  try { o = await j('/api/factor/charts?id=' + encodeURIComponent(id) + facCtx()); }
  catch (e) {
    el.innerHTML = '<div class="lvsec"><div class="warn">这几张图取不到：' +
      esc(String(e)) + '</div></div>';
    return;
  }
  if (!o || o.error) {
    el.innerHTML = '<div class="lvsec"><div class="warn">' +
      esc((o && o.error) || '没有返回') + '</div></div>';
    return;
  }
  FACCH = o;
  el.innerHTML =
    '<div class="lvsec"><h3>分位数净值曲线' +
      helpIcon('nav', o.caveats.nav) + '</h3>' +
      '<div class="lvtags" id="navctl">' +
        '<a href="#" class="lvtag rg on" data-log="0">普通轴</a>' +
        '<a href="#" class="lvtag rg" data-log="1">对数轴</a>' +
        '<a href="#" class="lvtag" data-allq="1">全分位</a>' +
      '</div><div id="ch_nav"></div>' +
      '<div class="note" id="navnote"></div></div>' +
    '<div class="lvsec"><h3>IC 时序图' + helpIcon('ic', o.caveats.ic) +
      '</h3><div id="ch_ic"></div></div>' +
    '<div class="lvsec"><h3>行业 IC' + helpIcon('ind', o.caveats.ind) +
      '</h3><div id="ch_ind"></div></div>' +
    '<div class="lvsec"><h3>换手率' + helpIcon('turn', o.caveats.turn) +
      '</h3><div id="ch_turn"></div></div>' +
    '<div class="lvsec"><h3>买入信号衰减分析' + helpIcon('dec', o.caveats.decay) +
      '</h3><div id="ch_dec"></div>' +
      '<div class="note">' + esc(o.caveats.decay) + '</div></div>' +
    '<div class="lvsec"><h3>因子值最大 / 最小的那几只' +
      helpIcon('tb', o.caveats.tb) + '</h3><div id="ch_tb"></div></div>';
  bindHelp(el);
  facChRender();
  $('#navctl').onclick = e => {
    const t = e.target.closest('a');
    if (!t) return;
    e.preventDefault();
    if (t.dataset.log != null) FACLOG = +t.dataset.log;
    else FACALLQ = FACALLQ ? 0 : 1;
    [...$('#navctl').querySelectorAll('a')].forEach(a2 => {
      if (a2.dataset.log != null) a2.classList.toggle('on', +a2.dataset.log === FACLOG);
      else a2.classList.toggle('on', !!FACALLQ);
    });
    facChNav();
  };
}

function facChNav() {
  const o = FACCH, d = o.nav;
  if (!d.dates.length) {
    $('#ch_nav').innerHTML = '<div class="note">这个区间里没有数据</div>';
    return;
  }
  const nq = d.nq;
  const keep = q => FACALLQ || q === 0 || q === 1 || q === nq;
  const ser = d.series.filter(x => keep(x.q)).map(x => ({
    n: x.q === 0 ? '基准（池内等权）' :
       (x.q === 1 ? '最小分位' : (x.q === nq ? '最大分位' : '第 ' + x.q + ' 分位')),
    c: facQcol(x.q, nq), v: x.nav
  }));
  /* 🔴 净值恒 > 0，所以对数轴不需要对负值做 clamp —— 服务端给的就是净值
     而不是"净值 − 1"（给收益率的话 log 那条路会把负值压到 1e-6，
     **而图看着完全正常**）。 */
  lineChart($('#ch_nav'), ser, {
    dates: d.dates, h: 380,
    pctAxis: FACLOG ? 0 : 1, log: FACLOG ? 1 : 0, ratioAxis: FACLOG ? 1 : 0
  });
  $('#navnote').textContent = FACLOG
    ? '对数轴：纵轴是净值【倍数】（起点 1.0）—— 分位之间差几十倍时，普通轴会把除了最高那条以外的全压平。'
    : '普通轴：纵轴是累计收益（起点 0%）。' + o.caveats.nav;
}

function facChRender() {
  const o = FACCH;
  facChNav();

  const ic = o.ic;
  if (ic.dates.length) {
    lineChart($('#ch_ic'), [
      { n: 'IC', c: '#6aa9e0', v: ic.ic },
      { n: '22 日移动平均', c: '#e08a3c', v: ic.ma }
    ], { dates: ic.dates, h: 300, zero: 0 });
  } else { $('#ch_ic').innerHTML = '<div class="note">这个区间里没有 IC</div>'; }

  if (o.ind.length) {
    hbarChart($('#ch_ind'), o.ind.map(x => ({
      n: x.ind, v: x.ic,
      t: x.ind + '　IC ' + x.ic.toFixed(4) + '　计入 ' + x.nday + ' 天'
    })), { fmt: v => (v == null ? '—' : v.toFixed(3)) });
  } else { $('#ch_ind').innerHTML = '<div class="note">这个区间里算不出行业 IC</div>'; }

  const tn = o.turn;
  if (tn.dates.length) {
    const nq = o.nav.nq;
    lineChart($('#ch_turn'), tn.series.map(x => ({
      n: x.q === 1 ? '最小分位' : '最大分位',
      c: x.q === 1 ? '#6aa9e0' : '#e08a8a', v: x.turn
    })), { dates: tn.dates, h: 280, zero: 0 });
  } else { $('#ch_turn').innerHTML = '<div class="note">这个区间里没有换手</div>'; }

  const dc = o.decay;
  if (dc.series.length) {
    const nq = dc.nq;
    barChart($('#ch_dec'), dc.lags.map(k => 'lag' + k), dc.series.map(x => ({
      n: x.q === 1 ? '最小分位' : '最大分位',
      c: x.q === 1 ? '#6aa9e0' : '#7d8596', v: x.ex
    })), { h: 260 });
  } else { $('#ch_dec').innerHTML = '<div class="note">这个区间里算不出衰减</div>'; }

  const tb = o.top_bottom;
  const tbl2 = (rows, ttl) =>
    '<div><h4 style="margin:0 0 6px">' + ttl + '</h4>' +
    (rows.length ? '<div class="pw"><table class="lvt"><tbody>' +
      rows.map(r => '<tr><td class="tx">' + cnCell(r.code, r.name) +
        '</td><td class="rt">' + fmtN(r.val, 6) + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="note">没有</div>') + '</div>';
  $('#ch_tb').innerHTML = tb.date
    ? '<div class="note">' + esc(tb.date) + ' 收盘，池内共 ' + tb.n_all + ' 只</div>' +
      '<div class="pgrid" style="grid-template-columns:1fr 1fr;gap:16px">' +
      tbl2(tb.top, '因子值最大的 ' + tb.top.length + ' 只') +
      tbl2(tb.bottom, '因子值最小的 ' + tb.bottom.length + ' 只') + '</div>'
    : '<div class="note">最新一天没有这个因子的值</div>';
}

facBoot();
</script>
